# Self-hosted Android releases for the staff and guest apps: an Expo Updates (protocol 1) endpoint
# plus the files it points at and the installable APKs. Pure static files - tools/dev/release.ts
# writes them to /var/www/sunset-mobile; nothing runs on the server.
#
# Install on the VPS:
#   1. mkdir -p /var/www/sunset-mobile
#   2. Put the `map` block below at the top of /etc/nginx/sites-available/sunsetsamui (outside any
#      server block - it belongs to the http context), and the four `location` blocks inside the
#      `server { listen 443 ... }` block, next to the existing ones. They don't touch /api/ or the
#      site.
#   3. nginx -t && systemctl reload nginx
#
# How the update check works: an installed app asks GET /mobile/<app>/updates/manifest with headers
# Expo-Platform (android/ios) and Expo-Runtime-Version (the app version it was built as). nginx
# answers with that version's manifest.json, or 204 "no update" when there is none (and always for
# iOS, which updates through the App Store/TestFlight instead).

# Android only (iOS updates through TestFlight/App Store), and only a runtime version that is safe
# to put in a path - anything else maps to a directory that never exists, so the answer is 204.
# (A map, not an `if` in the location: `if` there silently disables try_files.)
map "$http_expo_platform:$http_expo_runtime_version" $sunset_mobile_runtime {
    "~^android:(?<rv>[0-9A-Za-z._-]{1,64})$"  $rv;
    default                                   "-none-";
}

# Update files are named by their content hash and never change; everything else (latest.json, the
# APKs) must be re-checked every time.
map $uri $sunset_mobile_cache {
    "~^/mobile/[a-z]+/updates/.+/assets/"  "public, max-age=31536000, immutable";
    default                                "no-cache";
}

# --- inside the 443 server block ---

location = /mobile/staff/updates/manifest {
    root /var/www/sunset-mobile;
    default_type application/json;
    add_header expo-protocol-version 1 always;
    add_header expo-sfv-version 0 always;
    add_header Cache-Control "no-cache, no-store" always;
    try_files /staff/updates/$sunset_mobile_runtime/android/manifest.json @sunset_mobile_no_update;
}

location = /mobile/guest/updates/manifest {
    root /var/www/sunset-mobile;
    default_type application/json;
    add_header expo-protocol-version 1 always;
    add_header expo-sfv-version 0 always;
    add_header Cache-Control "no-cache, no-store" always;
    try_files /guest/updates/$sunset_mobile_runtime/android/manifest.json @sunset_mobile_no_update;
}

location @sunset_mobile_no_update {
    add_header expo-protocol-version 1 always;
    add_header Cache-Control "no-cache, no-store" always;
    return 204;
}

# Update files, APKs and latest.json.
location ^~ /mobile/ {
    alias /var/www/sunset-mobile/;
    autoindex off;
    types { application/vnd.android.package-archive apk; application/json json; application/javascript hbc; image/png png; image/jpeg jpg; font/ttf ttf; application/xml xml; }
    default_type application/octet-stream;
    # No `always`: an error (a 403, a 404 for a file not uploaded yet) must never be marked
    # immutable - Cloudflare cached exactly that for .png files and kept serving the 403 after
    # the cause was fixed on the server. Errors get no-store; success gets the map's value.
    add_header Cache-Control $sunset_mobile_cache;
    error_page 403 404 = @sunset_mobile_missing;
}
location @sunset_mobile_missing {
    add_header Cache-Control "no-store" always;
    return 404;
}
