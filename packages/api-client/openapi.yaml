      tags: [PublicOrdering]
      summary: List dine-in-relevant menu items (public)
      description: >
        Unauthenticated. Powers the guest QR ordering menu. Only items a guest may actually
        order: `isAvailable == true` and `department != SPA` (a spa treatment is never something
        a guest picks off a menu screen - it's booked as a `SpaAppointment` and billed through
        the ordinary staff order flow, same exclusion `OrderPrintingService#printTickets` already
        applies when deciding what gets a kitchen/bar ticket at all). Distinct from `GET /menu`
        (staff, unfiltered) - `MenuService#listPublic` is a separate method so the staff catalog
        view is never affected by this filter.
      security: []
      responses:
