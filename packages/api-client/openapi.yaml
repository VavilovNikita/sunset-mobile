  /uploads/rooms/{roomId}/{filename}:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
      - name: filename
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRoomImage
      tags: [Public]
      summary: Serve an uploaded room image
      description: >
        Unauthenticated. Serves files written under `UPLOADS_ROOT/rooms/{roomId}/`
        by `POST /rooms/{id}/images`. The path shape matches `Room.images`
        entries exactly (`/uploads/rooms/{id}/{filename}`); on the deployed
        VPS the reverse proxy in front of this service rewrites public
        `/uploads/...` requests to this app's `/api/uploads/...` route so
        `Room.images` values need no prefix rewriting on the frontend.
      security: []
      responses:
        "200":
          description: The image file.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404":
          description: No such file (unknown room, unknown filename, or a path escaping the room's upload directory).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Not found

  /shift-codes:
    get:
      operationId: listShiftCodes
      tags: [Roster]
      summary: List the shift codes currently offered
      description: >
        Any authenticated staff member - an employee reading their own schedule needs to know
        what "9" or "PH" actually means as much as a manager building the grid does. Returns
        only `active` rows (the current version of each `(staffArea, code)` pair); a historical
        `RosterEntry` may reference a retired version not returned here, and still resolves
        correctly by id - see `ShiftCode`'s own description. With `staffArea` given, this is a
        *resolved* view for that one area, not a raw filter: every area-scoped code for it, plus
        every shared (`staffArea: null`) code whose `code` string isn't also defined for this area
        - the area-scoped version wins and the shared one is left out, never both. Without
        `staffArea`, every active row is returned exactly as stored, area-scoped and shared alike,
        for the shift-code management screen itself, where seeing both rows of a collision is the
        point.
      parameters:
        - name: staffArea
          in: query
          schema:
            $ref: "#/components/schemas/StaffArea"
      responses:
        "200":
          description: Active shift codes, optionally resolved to one area.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShiftCode"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createShiftCode
      tags: [Roster]
      summary: Define a new shift code, or a new version of an existing one
      description: >
        Requires MANAGER or above. `ShiftCode` rows are never edited - creating one with the
        same `staffArea`+`code` (including both null - two shared rows for the same `code`) as an
        existing active row retires that row (`active` becomes `false`) and this one takes its
        place for new entries, while every `RosterEntry` already pointing at the retired row keeps
        meaning exactly what it meant. This is the same "agreed terms are frozen" precedent
        `BookingSegmentNightlyRate` already applies to room rates - a code's hours changing today
        must never reinterpret what an entry from last month meant. Defining an area-scoped code
        never retires a shared code of the same `code` string, or vice versa - `staffArea` is part
        of what identifies "the same code", so a shared and an area-scoped row coexist and the
        area-scoped one takes precedence for its own area (see `GET /shift-codes`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftCodeCreateInput"
      responses:
        "201":
          description: The new shift code version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftCode"
        "400":
          description: A second interval was given without a first, or an interval's end isn't after its start.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /shift-codes/{id}/versions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createShiftCodeVersion
      tags: [Roster]
      summary: Edit an existing shift code - saved as a new version effective today
      description: >
        Requires MANAGER or above, same as `POST /shift-codes`. The edit action on the shift-code
        screen: `id` is the code's current (active) version; `staffArea` and `code` stay as they
        are, every other term (hours, `countsAsWorked`, `isPaid`, `kind`, `displayColor`) comes from
        the body. Not an in-place edit - same versioning as `POST /shift-codes`: the current row is
        retired and a new one takes over, `effectiveFrom` = today in the hotel's own zone.

        Unlike `POST /shift-codes`, existing roster entries follow the edit from today on: every
        `RosterEntry` dated today or later that points at any version of this `(staffArea, code)`
        is moved to the new version, and so is every `EmployeePattern.defaultShiftCode` pointing at
        one (a pattern may only use an active code, and `POST /roster/generate` would otherwise keep
        stamping the retired one). Entries dated before today keep the version they had, so
        coverage, totals and the actuals export for past days still read the old terms.

        Editing the same code a second time on the same day amends today's version in place rather
        than creating a second one (two versions can't start on the same date), as long as no
        entry dated before today points at it - otherwise 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftCodeVersionInput"
      responses:
        "201":
          description: The new (or, for a same-day re-edit, amended) current version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftCode"
        "400":
          description: An interval is malformed, or `kind` doesn't match the hours / `countsAsWorked` (e.g. `ABSENCE` that counts as worked).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: No such shift code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: >
            `id` is a retired version (edit the current one instead), or today's version is
            already referenced by an entry dated before today.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /shift-codes/{id}/kind:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateShiftCodeKind
      tags: [Roster]
      summary: Set or correct a shift code's kind, in place
      description: >
        Requires MANAGER or above. The one deliberate exception to `ShiftCode` rows never being
        edited (see `POST /shift-codes`'s own description): `kind` is a classification of what a
        code already is, not one of the agreed terms `RosterEntry`s depend on staying frozen -
        correcting it later doesn't reinterpret what anyone actually worked or was paid, so this
        mutates the existing row rather than retiring it and creating a new version. Refused (400)
        if `kind` doesn't match the row's own interval shape (`SPLIT` needs two intervals,
        `MORNING`/`EVENING` need exactly one, `OPEN_SCHEDULE`/`ABSENCE` need none) - see
        `ShiftCodeKind`'s own description for what each one means.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftCodeKindUpdateInput"
      responses:
        "200":
          description: The updated shift code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftCode"
        "400":
          description: kind doesn't match this code's own interval shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: "SPLIT needs two intervals - this code only has one"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: No such shift code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /shift-codes/{id}/display-color:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateShiftCodeDisplayColor
      tags: [Roster]
      summary: Set or clear a shift code's display colour, in place
      description: >
        Requires MANAGER or above. Same no-versioning pattern as `PATCH /shift-codes/{id}/kind`
        (see that endpoint's own description) - `displayColor` is a presentation attribute, not an
        agreed term any `RosterEntry` depends on staying frozen, so this mutates the existing row
        rather than retiring it and creating a new version. Unlike `kind`, this may also be used to
        clear a code back to unset (omit `displayColor`, or send it explicitly `null`) - see
        `ShiftCodeDisplayColorUpdateInput`'s own description.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftCodeDisplayColorUpdateInput"
      responses:
        "200":
          description: The updated shift code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftCode"
        "400":
          description: displayColor was sent but isn't a 6-digit hex colour.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: No such shift code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /employee-patterns:
    get:
      operationId: listEmployeePatterns
      tags: [Roster]
      summary: List every employee's roster pattern
      description: >
        Requires MANAGER or above. One row per employee who has a pattern set - an employee
        with none yet (just added, not set up) simply doesn't appear; `POST /roster/generate`
        only ever fills dates for employees who do.
      responses:
        "200":
          description: Every set pattern.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeePattern"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /employee-patterns/{employeeUserId}:
    parameters:
      - name: employeeUserId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: setEmployeePattern
      tags: [Roster]
      summary: Set (or replace) one employee's roster pattern
      description: >
        Requires MANAGER or above. Full replacement, not a partial update - matches this
        project's own convention wherever the caller has no reason not to send everything.
        `defaultShiftCodeId`, if given, must be an active code belonging to the same
        `staffArea` named in this same body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeePatternInput"
      responses:
        "200":
          description: The saved pattern.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeePattern"
        "400":
          description: '`defaultShiftCodeId` belongs to a different `staffArea` than the one given, or isn''t active.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: No such employee.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /roster/employees:
    get:
      operationId: listRosterEmployees
      tags: [Roster]
      summary: List active employees for building the roster
      description: >
        Requires MANAGER or above. Deliberately narrower than `GET /users` (`ADMIN` only,
        Staff account management) - the same reasoning `GET /spa-appointments/therapists`
        already documents for its own narrower read: a manager building the roster needs
        names to assign shifts to, not the account-management surface. Active employees only.
      responses:
        "200":
          description: Active employees, with their roster pattern's area if one is set.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RosterEmployee"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /roster:
    get:
      operationId: getRosterMonth
      tags: [Roster]
      summary: The whole roster grid for one month
      description: >
        Requires MANAGER or above. `coverageWarnings` is computed here, not on the frontend -
        every `(staffArea, date)` whose `countsAsWorked` entries fall below that area's
        `StaffAreaCoverageRule.minimumWorking` (default 0, meaning no rule set yet, never
        warns). This is a warning, not a block: the roster this endpoint returns can already be
        under-covered, same "the software doesn't get to veto a fact about the world" reasoning
        `RoomUnitService#createBlock` already documents.
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          description: 1-12.
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        "200":
          description: The month's entries, the employees who have any, and any coverage warnings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterMonth"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /roster/me:
    get:
      operationId: getMyRoster
      tags: [Roster]
      summary: My own schedule for one month
      description: >
        Any authenticated staff member - their own `RosterEntry` rows only, read-only. No pay,
        no coverage warnings, no other employee's schedule - those stay a manager's concern.
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        "200":
          description: The caller's own entries for the month.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RosterEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /roster/generate:
    post:
      operationId: generateRosterMonth
      tags: [Roster]
      summary: Seed a month's roster from every employee's pattern
      description: >
        Requires MANAGER or above. For every employee with a pattern, fills every date in the
        named month with their `defaultShiftCodeId` except their own `weeklyDayOff` weekday -
        only where that date has no entry yet. Never overwrites an existing entry, which is
        what makes this safe to run again (after adding a new employee's pattern partway through
        setting up a month, for instance) without disturbing anything already hand-edited.
        Everything after this is the ordinary drag-editing surface - this is a starting draft,
        not a final schedule.
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        "200":
          description: The month, after generation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterMonth"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /roster/copy:
    post:
      operationId: copyRosterMonth
      tags: [Roster]
      summary: Fill a month by copying an earlier stretch of the roster
      description: >
        Requires MANAGER or above. The way to set up a month when nobody has an employee pattern
        (so `POST /roster/generate` has nothing to work from): copy what was actually rostered
        before. The source defaults to the whole previous month; `sourceFrom`/`sourceTo` narrow
        it to any range of at least 7 days.

        Copied by weekday, not by day of the month, because a roster is a weekly rhythm (a
        weekly day off has to stay on the same weekday). The source is cut to whole weeks - its
        first `7 x floor(days / 7)` days - and repeated to cover the target month: each target
        date takes the entry its own weekday had at the matching point of that cycle, i.e.
        `sourceFrom + ((target - sourceFrom) mod period)`. A blank source cell (a day off) stays
        blank.

        Same safety rules as `/roster/generate`: an existing entry in the target month is never
        overwritten (re-running is harmless), an inactive employee is skipped, and a copied code
        is re-pointed to the version of that code in force on the target date (see
        `ShiftCode.effectiveFrom`) - a code with no such version is skipped and counted, never
        guessed. Notes and locks are not copied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RosterCopyInput"
      responses:
        "200":
          description: The target month after copying, with what happened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterCopyResult"
        "400":
          description: Invalid range (fewer than 7 days, `sourceFrom` after `sourceTo`, or overlapping the target month).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /roster/entries:
    post:
      operationId: createRosterEntry
      tags: [Roster]
      summary: Assign a shift directly (fill a blank cell)
      description: Requires MANAGER or above. Fails if the employee already has an entry that date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RosterEntryCreateInput"
      responses:
        "201":
          description: The new entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterEntry"
        "400":
          description: This employee already has an entry on this date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: No such employee or shift code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /roster/entries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteRosterEntry
      tags: [Roster]
      summary: Remove an entry (turn the day back into a day off)
      description: Requires MANAGER or above. Refused on a `locked` entry - unlock it first.
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkTrue"
        "400":
          description: This entry is locked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: No such entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /roster/entries/{id}/date:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: moveRosterEntry
      tags: [Roster]
      summary: Move this entry to another date (same employee)
      description: >
        Requires MANAGER or above. The drag-to-another-date gesture. Refused (400) if this
        entry is `locked`, or if the employee already has a different entry on the target date -
        cancelled, not guessed at, the same "a miss cancels" rule the calendar/spa grids settled
        on for their own drags.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RosterMoveInput"
      responses:
        "200":
          description: The moved entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterEntry"
        "400":
          description: This entry is locked, or the employee already has an entry on the target date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: No such entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /roster/entries/{id}/employee:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: reassignRosterEntry
      tags: [Roster]
      summary: Give this day to a different employee
      description: >
        Requires MANAGER or above. The drag-onto-a-different-person's-empty-cell gesture -
        ownership of the shift moves to the named employee, same date, same shift code.
        Crosses `staffArea` freely (covering another area for a day is a normal, wanted
        operation here, unlike the booking/spa swaps' same-type restriction - there's no frozen
        price or duration at stake). Refused (400) if this entry is `locked`, or the target
        employee already has an entry that date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RosterReassignInput"
      responses:
        "200":
          description: The reassigned entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterEntry"
        "400":
          description: This entry is locked, or the target employee already has an entry on this date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: No such entry, or no such employee.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /roster/entries/{id}/swap:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: swapRosterEntries
      tags: [Roster]
      summary: Exchange two employees' days
      description: >
        Requires MANAGER or above. The drag-onto-another-person's-occupied-cell gesture: this
        entry's `(date, shiftCodeId)` trades with the other one's. Unlike the booking room swap
        or the spa table swap, this needs no SERIALIZABLE write and no deferred constraint -
        a person's own calendar dates aren't a resource a third party can be contending for the
        way a room unit or a spa table is, so an ordinary two-row update inside one transaction
        is enough; see `RosterService#swapEntries`'s own comment before reaching for either of
        those two mechanisms here. Refused (400) if either entry is `locked`, or if either
        employee already has an entry on the other's date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RosterSwapInput"
      responses:
        "200":
          description: This entry, after the swap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterEntry"
        "400":
          description: Either entry is locked, the two ids are the same, or either employee already has an entry on the other's date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: This entry not found, or the other entry not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /roster/entries/{id}/lock:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: setRosterEntryLocked
      tags: [Roster]
      summary: Lock or unlock an entry against being moved
      description: >
        Requires MANAGER or above. The system-recognized form of "do not move" - already
        written by hand as a cell comment in the spreadsheet this module replaces. A locked
        entry refuses to be dragged as a source, or overwritten as a target, by move, reassign,
        or swap alike, until unlocked - a hard refusal, not a warning, since it's a deliberate
        per-entry choice the scheduler themselves made, not the system second-guessing a fact
        about the world the way the coverage warning below has to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RosterLockInput"
      responses:
        "200":
          description: The entry, with its new lock state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: No such entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /staff-area-coverage-rules:
    get:
      operationId: listStaffAreaCoverageRules
      tags: [Roster]
      summary: List every area's minimum-staffing rule
      description: Requires MANAGER or above. An area with no rule set simply doesn't appear - treated as no minimum (never warns).
      responses:
        "200":
          description: Every rule currently set.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffAreaCoverageRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /staff-area-coverage-rules/{staffArea}:
    parameters:
      - name: staffArea
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/StaffArea"
    put:
      operationId: setStaffAreaCoverageRule
      tags: [Roster]
      summary: Set one area's minimum-staffing rule
      description: Requires MANAGER or above.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffAreaCoverageRuleInput"
      responses:
        "200":
          description: The saved rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAreaCoverageRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /attendance:
    get:
      operationId: listAttendancePunches
      tags: [Roster]
      summary: List raw attendance punches
      description: >
        Requires MANAGER or above. The raw stream, not paired sessions - see `AttendancePunch`'s
        own description for why a split shift's four punches need no special handling here.
      parameters:
        - name: employeeUserId
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: to
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Every punch for this employee in the range, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendancePunch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

    post:
      operationId: recordAttendancePunch
      tags: [Roster]
      summary: Record a punch by hand
      description: >
        Requires MANAGER or above in v1 - an employee punching themselves on a shared device
        needs the same identity-confirmation decision the phone POS already makes for money
        actions, deliberately not decided here (see this module's own proposal). `source` is
        always `MANUAL` from this endpoint; a future scanner integration writes the same table
        with `source=SCANNER` and no separate write path.

        Also the mechanism behind closing an "incomplete" day (an odd punch count) - there is no
        separate correction endpoint, a correction is just another punch recorded here, with a
        note explaining it, and `ATTENDANCE_PUNCH_CORRECTED` used instead of
        `ATTENDANCE_PUNCH_RECORDED` for its own audit entry when `note` is given alongside a
        punch that resolves a day that was previously incomplete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendancePunchCreateInput"
      responses:
        "201":
          description: The recorded punch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendancePunch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: No such employee.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /attendance/summary:
    get:
      operationId: getAttendanceSummary
      tags: [Roster]
      summary: Planned vs. actual, one employee, one month
      description: >
        Requires MANAGER or above - same visibility floor as pay, since this is the data pay
        depends on. One entry per day: the planned shift (if any - `OP` and a day off both carry
        no planned interval, distinguished by whether a `RosterEntry` exists at all, and `OP`'s
        own zero-interval shape means this never shows a fabricated zero planned. A day with an
        odd number of punches is `incomplete`, closed only by another punch recorded through
        `POST /attendance` with an explanatory note.
      parameters:
        - name: employeeUserId
          in: query
          required: true
          schema:
            type: string
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        "200":
          description: One summary row per day of the month.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceDaySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /attendance/today:
    get:
      operationId: getTodayShiftBoard
      tags: [Roster]
      summary: Who's on shift right now
      description: >
        Requires MANAGER or above, same floor as the rest of attendance. One row per employee
        with a `countsAsWorked` `RosterEntry` for today - see `TodayShiftStatus`'s own description
        for exactly who that excludes. Meant to be polled (there is no push mechanism here): every
        value is computed fresh from this instant's `Clock`, today's `RosterEntry`/`ShiftCode`,
        and today's `AttendancePunch` rows - never cached between requests.
      responses:
        "200":
          description: One status row per employee on shift-relevant duty today.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TodayShiftStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /attendance/server-time:
    get:
      operationId: getServerTime
      tags: [Roster]
      summary: What time the server currently thinks it is
      description: >
        Requires MANAGER or above, same floor as the rest of attendance. A diagnostic read of
        the app's own injected `Clock` bean (`ClockConfig`) - not a fresh `Instant.now()`/
        `LocalDateTime.now()` - so this can never disagree with what "today"/"now" actually
        resolves to for attendance and roster. Exists so a clock/timezone drift (the server
        computing "today" in the wrong zone) is visible at a glance instead of only showing up
        as a subtly wrong attendance status.
      responses:
        "200":
          description: The server's current time, per its own clock.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerTime"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /attendance/devices:
    get:
      operationId: listAttendanceDevices
      tags: [AttendanceDevices]
      summary: List fingerprint terminals
      description: Requires MANAGER or above. Every registered device, active or not.
      responses:
        "200":
          description: All devices.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceDevice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
    post:
      operationId: createAttendanceDevice
      tags: [AttendanceDevices]
      summary: Register a fingerprint terminal
      description: Requires MANAGER or above. `serial` must be unique - registering the same physical device twice is rejected with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceDeviceInput"
      responses:
        "201":
          description: Device registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceDevice"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "409":
          description: A device with this serial is already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: A device with this serial is already registered

  /attendance/devices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateAttendanceDevice
      tags: [AttendanceDevices]
      summary: Update a fingerprint terminal
      description: Requires MANAGER or above. Full replacement of all `AttendanceDeviceInput` fields - no partial update, same convention as `PrinterInput`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceDeviceInput"
      responses:
        "200":
          description: Updated device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceDevice"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Device not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Device not found
        "409":
          description: Another device already has this serial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: A device with this serial is already registered
    delete:
      operationId: deleteAttendanceDevice
      tags: [AttendanceDevices]
      summary: Delete a fingerprint terminal
      description: >
        Requires MANAGER or above. A device that has ever produced a punch (has
        `AttendancePunch` rows) can't be deleted - deactivate it (`active=false`) instead, the
        same convention as `DELETE /printers/{id}`.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkTrue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Device not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Device not found
        "409":
          description: This device has recorded punches and can't be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: This device has recorded punches and can't be deleted.

  /attendance/devices/{id}/resync:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: resyncAttendanceDevice
      tags: [AttendanceDevices]
      summary: Force a full re-read of one device's attendance log
      description: >
        Requires MANAGER or above. Every poll after a device's first is windowed (see
        `AttendanceDevice.lastSeenAt`'s own description) - this forces a full read instead,
        regardless of any existing watermark, for the one case a window can't recover from on its
        own: a device whose clock jumped far enough backward (most plausibly a factory reset) that
        new records now fall before the last watermark rather than after it. Attempts the read
        immediately (bounded by a short socket timeout) and returns the device either way -
        `lastSeenAt` moving to just now means it worked, an unchanged `lastSeenAt` means it
        didn't, the same "attempt now, report what actually happened" shape as
        `POST /printers/{id}/test`.
      responses:
        "200":
          description: Resync attempted - see `lastSeenAt` for whether it reached the device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceDevice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Device not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Device not found

  /employee-pay-rates:
    get:
      operationId: listEmployeePayRates
      tags: [Roster]
      summary: List one employee's daily-rate history
      description: Requires MANAGER or above.
      parameters:
        - name: employeeUserId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Every rate version, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeePayRate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
    post:
      operationId: createEmployeePayRate
      tags: [Roster]
      summary: Set a new daily rate, effective from a given date
      description: >
        Requires MANAGER or above. Never edits an existing rate - a raise creates a new
        versioned row, so a month straddling the change (a rise partway through, say, August)
        computes each day's pay from whichever rate was actually in effect that day. Same
        "agreed terms are frozen" shape as `ShiftCode` and `BookingSegmentNightlyRate`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeePayRateCreateInput"
      responses:
        "201":
          description: The new rate version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeePayRate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: No such employee.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /roster/actuals-export:
    get:
      operationId: exportRosterActuals
      tags: [Roster]
      summary: Export a month's assigned vs. actual worked days and hours, as an Excel workbook
      description: >
        Requires MANAGER or above, the same floor as the rest of the roster module's write/export
        surface. Two sheets. "Summary": one row per employee who either had a
        `shiftCode.countsAsWorked` roster entry that month or at least one real `AttendancePunch`
        that month (a punch with no matching entry is exactly the kind of anomaly this export
        exists to surface, not drop) - Days assigned/Hours assigned are the plan (`OP` counts as a
        day with no fixed hours, `PH` doesn't count at all, same as before this export reported
        real attendance); Days present/Hours worked are real punches, paired consecutive IN/OUT
        per day the same way `GET /attendance/summary` does; Incomplete days counts days that
        month with an odd punch count. "Arrivals & departures": one row per punch that month
        across every employee in scope, sorted by employee then punch time - the raw log Summary's
        totals are computed from, not pre-paired into sessions here. No money: the hotel's
        accountant keeps pay calculation off-system (everyone is currently on a monthly salary
        held in a sheet this system has never seen, and there are no part-timers), so this export
        reports only the underlying facts and leaves the arithmetic where it already lives.
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        "200":
          description: The .xlsx workbook (Summary, Arrivals & departures).
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /roster/export:
    get:
      operationId: exportRosterGrid
      tags: [Roster]
      summary: Export a month's roster grid, as an Excel workbook
      description: >
        Requires ADMIN - stricter than the rest of this module's MANAGER floor, matching the
        Excel import's own floor (`/roster/import/**`), not the actuals export's. One row per
        employee, grouped and ordered exactly as the on-screen grid (`RosterGrid.tsx`) renders it -
        by `StaffArea` in the fixed order Admin, Front Office, Maintenance, Housekeeping,
        Restaurant, Kitchen, then employees with no area set, alphabetically by name within each
        group; a group with nobody in it is left out entirely, same as on screen. One column per
        day of the month; a populated cell shows its `ShiftCode.code` with the cell filled
        `displayColor` where a code has one, the same neutral fallback the grid itself uses where
        it doesn't (see `ShiftCode.displayColor`'s own description). Weekend columns and, if the
        exported month is the current one, the "today" column are styled to match the grid's own
        visual cues as closely as Excel formatting allows. Bottom rows are the same Working/Off/
        Absent daily totals the grid's own `tfoot` computes (`Working`: entries whose `shiftCode.
        countsAsWorked` is true; `Off`: active employees minus anyone with any entry that day;
        `Absent`: entries whose `shiftCode.kind` is `ABSENCE`) - recomputed here rather than shared
        code, since that computation exists only client-side today (`RosterGrid.tsx`'s own totals
        block), not as a backend endpoint this could call into.
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        "200":
          description: The .xlsx workbook.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Token is valid but lacks the required role (`ADMIN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /roster/import/preview:
    post:
      operationId: previewRosterImport
      tags: [Roster]
      summary: Dry-run an Excel schedule import
      description: >
        Requires ADMIN. Reads one month's sheet (named like `Sep26`, matching `year`/`month`) from
        the uploaded workbook and reports what importing it would do - nothing is written by this
        call, not even a remembered name or colour mapping. Only the grid of codes is read: the
        trailing columns after it, the legend, the totals rows, and the notes block are never
        parsed - their position and shape vary between months in ways that make reading them
        unsafe to assume. See `RosterImportPreview` for the full shape of what comes back; resolve
        every unmapped name (`POST /roster/import/name-mappings`) and every unresolved "9" colour
        (`POST /roster/import/color-mappings`) until `canCommit` is true, then `POST
        /roster/import/commit` with the returned `importId`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, year, month]
              properties:
                file:
                  type: string
                  format: binary
                year:
                  type: integer
                month:
                  type: integer
                  minimum: 1
                  maximum: 12
      responses:
        "200":
          description: The dry-run report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterImportPreview"
        "400":
          description: Not a readable schedule workbook, or no sheet named for this year/month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Token is valid but lacks the required role (`ADMIN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /roster/import/name-mappings:
    post:
      operationId: createRosterImportNameMapping
      tags: [Roster]
      summary: Resolve one name found in a schedule import
      description: >
        Requires ADMIN. Map `rawName` to an existing account (`employeeUserId`), or create a new
        no-login one on the spot (`newEmployeeName`) - never both. Remembered against the account
        from then on: the same spelling in a later import resolves automatically, without asking
        again. Names are never matched automatically by this API in any other way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RosterImportNameMappingInput"
      responses:
        "200":
          description: The resulting mapping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterImportNameMappingResult"
        "400":
          description: Body failed validation, or named neither/both of employeeUserId and newEmployeeName.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Token is valid but lacks the required role (`ADMIN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: employeeUserId does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /roster/import/color-mappings:
    post:
      operationId: createRosterImportColorMapping
      tags: [Roster]
      summary: Resolve one ambiguous "9" found in a schedule import
      description: >
        Requires ADMIN. Records which `ShiftCode` a given `(rawCode, fillColor)` means, by the
        `ShiftCode`'s own `code` string - not scoped to an area, since which code text a colour
        means is the same fact everywhere in the file. Remembered from then on, and re-resolved
        fresh (per the area each individual cell actually belongs to) against whatever's active
        for that code on every later import, so a later edit to that `ShiftCode`'s hours (a new
        version - see `ShiftCode`'s own description) is picked up automatically rather than
        silently invalidating this mapping.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RosterImportColorMappingInput"
      responses:
        "200":
          description: The resulting mapping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterImportColorMappingResult"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Token is valid but lacks the required role (`ADMIN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: shiftCodeId does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /roster/import/commit:
    post:
      operationId: commitRosterImport
      tags: [Roster]
      summary: Write a previously-previewed Excel schedule import
      description: >
        Requires ADMIN. Re-reads the same file `importId` refers to and re-resolves it fresh
        against whatever is mapped by now - never trusts that a client-side "canCommit" from an
        earlier preview still holds. Refuses (400) if anything is still unresolved. An entry whose
        date already has one for that employee is skipped, never overwritten - see
        `RosterImportCollision`'s own description. Exactly one audit entry is written for the
        whole import, naming the month and the counts in `RosterImportResult`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RosterImportCommitInput"
      responses:
        "200":
          description: What was actually written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterImportResult"
        "400":
          description: Unresolved names, unresolved "9" colours, or unreadable cells remain - see `RosterImportPreview` (call preview again to see what's left).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Token is valid but lacks the required role (`ADMIN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: This importId is unknown or has expired - upload the file again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /roster/grid-import/preview:
    post:
      operationId: previewRosterGridImport
      tags: [Roster]
      summary: Dry-run re-importing this app's own roster grid export
      description: >
        Requires ADMIN, same floor as `/roster/import/**` and `/roster/export`. Reads a file
        previously produced by `GET /roster/export` - not the hotel's hand-built schedule
        (`/roster/import/**` is that path) - by way of a hidden metadata sheet that export writes
        alongside the visible grid, carrying the export's own timestamp plus, for every cell it
        wrote, exactly which `User` and which `ShiftCode` (by id, not by text) it meant. A cell
        resolves positionally against that metadata whenever it's unchanged since export; a cell
        whose row or code text doesn't match the metadata (added or retyped by hand after export)
        falls back to ordinary name/code-text resolution instead - see each `RosterGridImportDiffRow.resolution`
        for which happened. Nothing is written by this call. Reports only rows that would actually
        change (`diffRows` - `ADD`/`REMOVE`/`CHANGE`; unchanged cells are just a count) plus what
        would need resolving before `POST /roster/grid-import/commit` can apply everything:
        `unmatchedEmployees` (resolve exactly like `/roster/import/name-mappings` - the same
        remembered mapping is reused, so resolving one here also resolves it for the hand-built
        importer and vice versa), `retiredCodes` (a cell's metadata names a `ShiftCode` id that's
        since been superseded - `RosterGridImportCommitInput.retiredCodeResolutions` recreates it
        with its exact historical definition, shown here in full for review/edit), and
        `unknownCodes` (a hand-typed code with no metadata at all -
        `RosterGridImportCommitInput.unknownCodeResolutions` defines it from scratch, same fields
        `POST /shift-codes` takes). `canCommit` is true only once all three of those are empty;
        a `lockedConflict` or `staleSinceExport` row never blocks commit, only flags itself for
        review (see each field's own description).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, year, month]
              properties:
                file:
                  type: string
                  format: binary
                year:
                  type: integer
                month:
                  type: integer
                  minimum: 1
                  maximum: 12
      responses:
        "200":
          description: The dry-run report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterGridImportPreview"
        "400":
          description: Not a readable .xlsx, no sheet named "Roster {year}-{month}", or that sheet has no import-metadata sheet alongside it (not produced by this app's own export).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Token is valid but lacks the required role (`ADMIN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /roster/grid-import/commit:
    post:
      operationId: commitRosterGridImport
      tags: [Roster]
      summary: Write a previously-previewed roster grid re-import
      description: >
        Requires ADMIN. Re-reads the same file `importId` refers to and re-resolves it fresh
        against whatever is true right now - never trusts an earlier preview's "canCommit". Refuses
        (400) if any `unmatchedEmployees`, `retiredCodes`, or `unknownCodes` entry a fresh preview
        would report isn't covered by this call's own `retiredCodeResolutions`/
        `unknownCodeResolutions` (or, for a name, isn't already resolvable via
        `/roster/import/name-mappings`). A `RosterEntry` with `locked: true` is never overwritten
        or removed by this call, regardless of what the file says - it's always excluded and
        counted in `skippedLocked`, the same "front desk decides" posture this app uses everywhere
        else `locked` matters. `excludeCells` lets the caller additionally skip specific
        non-locked rows by hand (typically ones flagged `staleSinceExport` in the preview) without
        having to omit them from the file itself. Exactly one audit entry is written for the whole
        import.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RosterGridImportCommitInput"
      responses:
        "200":
          description: What was actually written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterGridImportResult"
        "400":
          description: Unresolved employees, retired codes, or unknown codes remain - see `RosterGridImportPreview` (call preview again to see what's left).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Token is valid but lacks the required role (`ADMIN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: This importId is unknown or has expired - upload the file again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /integrations/siteminder/reservations:
    post:
      operationId: importSiteMinderReservation
      tags: [SiteMinder]
      summary: Import one SiteMinder reservation (create, update or cancel)
      security:
        - siteMinderIntegrationKey: []
      description: >
        Called by our own polling script, once per reservation it reads - not by staff (a staff
        token gets 403). Idempotent on `reference`: posting the same reservation again never
        creates a second booking.


        - `BOOKED`, reference not seen before: creates a `CONFIRMED` booking (channel mapped from
          `channel`, see `SiteMinderReservationInput.channel`) through the same availability
          check as every other booking. `totalPrice` is SiteMinder's agreed total and becomes the
          booking's price, frozen per night (spread evenly, any rounding remainder on the last
          night). This is the one place a price arrives from outside instead of being computed
          from this system's rates, because the guest already agreed it on the OTA. A new
          name-only `Guest` card is created for it every time. It is never matched to an existing
          card by name, because a wrong match would show this stay in someone else's guest
          account. Duplicate cards are the known cost until contacts are available.
        - `BOOKED` or `MODIFIED`, reference seen before: applies whatever differs - dates (through
          the same path as `PATCH /bookings/{id}/schedule`, keeping the assigned room unless it
          isn't free for the new dates), then the agreed total (re-spread over the nights), then
          `adults`/`children`. Guest name and channel are not updated. A room type that differs
          from the one originally booked is rejected with 409 (there's no path that changes a
          whole stay's room type - staff have to handle it). A booking cancelled in this system is
          never reinstated by an import (`SKIPPED`).
        - `CANCELLED`, reference seen before: cancels the booking through the same path as a
          staff cancellation (`PATCH /bookings/{id}/status`), with the same effects - the room is
          released, and a `PAID` booking's settlement is reversed in the ledger.
        - `MODIFIED` or `CANCELLED` for a reference never imported: nothing is created; the result
          is `SKIPPED` with a message, and the server logs a warning.


        An import whose SiteMinder timestamp (the latest of `bookedAt`/`modifiedAt`/`cancelledAt`)
        is older than the last one applied to this booking is `SKIPPED` as stale.


        Each step of an update is its own write, like the staff endpoints it reuses: if one step
        fails (say, the new dates aren't available), the steps before it stay applied and the next
        poll retries the rest. Every change is audited under the booking's usual actions with the
        actor `SITEMINDER`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteMinderReservationInput"
      responses:
        "200":
          description: What the import did.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteMinderImportResult"
        "400":
          description: >
            Body failed validation - including a `roomTypeName` with no mapping, reported under
            `fieldErrors.roomTypeName` with the exact unmapped name, so it can be added via
            `POST /integrations/siteminder/room-type-mappings`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or wrong `X-Integration-Key`, or the integration isn't configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: A staff token - this route only accepts the integration key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: >
            The change can't be applied as-is: the dates aren't available, the room type changed,
            the booking has been split by a relocation in a way the change can't follow, or a
            concurrent import of the same reservation is in progress. Needs a person, or a retry on
            the next poll.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Selected dates are no longer available

  /integrations/siteminder/room-type-mappings:
    get:
      operationId: listSiteMinderRoomTypeMappings
      tags: [SiteMinder]
      summary: List SiteMinder room type mappings
      description: Requires MANAGER or above.
      responses:
        "200":
          description: Every mapping, ordered by SiteMinder room type name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteMinderRoomTypeMapping"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
    post:
      operationId: createSiteMinderRoomTypeMapping
      tags: [SiteMinder]
      summary: Map a SiteMinder room type name to a room type
      description: >
        Requires MANAGER or above. Names are matched case-insensitively, with surrounding and
        repeated whitespace ignored. Mapping a name that's already mapped is rejected with 409 -
        change the existing mapping instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteMinderRoomTypeMappingInput"
      responses:
        "201":
          description: Mapping created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteMinderRoomTypeMapping"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Room type not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found
        "409":
          description: This SiteMinder room type is already mapped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: This SiteMinder room type is already mapped

  /integrations/siteminder/room-type-mappings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: updateSiteMinderRoomTypeMapping
      tags: [SiteMinder]
      summary: Change a SiteMinder room type mapping
      description: >
        Requires MANAGER or above. Full replacement. Affects future imports only - bookings
        already imported keep the room type they were created with.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteMinderRoomTypeMappingInput"
      responses:
        "200":
          description: Updated mapping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteMinderRoomTypeMapping"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Mapping or room type not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Mapping not found
        "409":
          description: Another mapping already has this SiteMinder room type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: This SiteMinder room type is already mapped
    delete:
      operationId: deleteSiteMinderRoomTypeMapping
      tags: [SiteMinder]
      summary: Delete a SiteMinder room type mapping
      description: Requires MANAGER or above. Imports naming this room type are rejected as unmapped from then on.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkTrue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Mapping not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Mapping not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT returned by `POST /auth/login`, sent as `Authorization: Bearer
        <token>`. Contains `sub` (user id), `email`, `role`, standard `iat`/`exp`
        (default TTL 7 days, configurable via `JWT_TTL_DAYS`). Every route in
        this file except `POST /bookings` and the unauthenticated `/auth/*`
        endpoints (`login`, `logout`) requires a valid token, returning 401 if
        missing/invalid/expired, and 403 where the route additionally requires
        role `ADMIN`.
    guestBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT returned by `POST /guest-auth/verify` or `POST /guest-auth/login`, sent the same way
        as `bearerAuth` (`Authorization: Bearer <token>`) but signed with a completely different
        secret and verified by a separate filter - see the `GuestAccountAuth` tag. A staff
        `bearerAuth` token never satisfies this scheme and vice versa. Required by every
        `GuestAccount`-tagged operation; 401 if missing/invalid/expired.
    siteMinderIntegrationKey:
      type: apiKey
      in: header
      name: X-Integration-Key
      description: >
        Shared secret for the SiteMinder polling script, configured on the server as
        `SITEMINDER_INTEGRATION_KEY` (unset = the integration is off and every call is 401). Honored
        on `POST /integrations/siteminder/reservations` only - on any other route it
        authenticates nothing - and grants no staff role, so the script can't reach anything else
        with it. A staff `bearerAuth` token on the import route gets 403: imports come from the
        script, not a person.

  responses:
    ValidationErrorResponse:
      description: Request failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    Unauthorized:
      description: No valid JWT.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: Unauthorized
    Forbidden:
      description: Token is valid but lacks the required role (`ADMIN`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: Forbidden
    ForbiddenManagerPlus:
      description: Token is valid but lacks the required role (`MANAGER` or above).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: Forbidden
    ForbiddenCashierPlus:
      description: Token is valid but lacks the required role (`CASHIER` or above).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: Forbidden
    ForbiddenEngineerOrManagerPlus:
      description: >
        Token is valid but the caller has neither the `ENGINEER` job function nor role `MANAGER`
        or above - see `JobFunction`, an axis independent of `RoleHierarchy`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: Forbidden

  schemas:
    Role:
      type: string
      enum: [ADMIN, MANAGER, CASHIER, WAITER]
      description: >
        Hierarchical: ADMIN > MANAGER > CASHIER > WAITER (see RoleHierarchy bean). A role
        check written as e.g. "CASHIER" is satisfied by CASHIER, MANAGER, or ADMIN. `/users/**`
        is the one exception — hard-restricted to ADMIN regardless of hierarchy.

    JobFunction:
      type: string
      enum: [ENGINEER, HOUSEKEEPER, THERAPIST]
      description: >
        A second, independent authorization axis alongside `Role` — a sideways job, not a step
        on the ADMIN > MANAGER > CASHIER > WAITER ladder. A function grants access to specific
        endpoints on its own, without granting anything else and without being expressed as a
        role comparison; it never appears in the RoleHierarchy bean. `User.functions` is a set
        (zero or more, no duplicates) — see that schema. `THERAPIST` marks a staff account as a
        spa therapist for `SpaAppointment.therapistUserId` - an ordinary staff account like any
        other (the same account shape shifts/hours will use), not a separate person record; one
        whose holder never signs in costs nothing beyond the row itself. No endpoint is gated on
        this function in v1 (there is no therapist self-service screen yet - reception is the
        only surface), so it exists purely as a tag on who counts as a bookable therapist.

    Zone:
      type: string
      enum: [RESTAURANT, BAR, SPA, POOL, ROOM_SERVICE]
      description: Physical area a POS Table belongs to.

    TableShape:
      type: string
      enum: [ROUND, SQUARE, RECTANGLE]
      description: How a table is drawn on its floor plan. Display only - nothing else reads it.

    OrderDateBasis:
      type: string
      enum: [OPENED, CLOSED]
      description: Which date `GET /orders`' `from`/`to` filter on - see that parameter's own description.

    MenuDepartment:
      type: string
      enum: [KITCHEN, BAR, SPA]
      description: >
        Where a MenuItem's kitchen/bar ticket prints - independent of `category`, which is a
        free-text display grouping for the menu itself (e.g. "Mains", "Cocktails") and has no
        effect on print routing. `SPA` is not a real ticket-printer department: a treatment item
        never generates a kitchen/bar ticket at all (see `OrderPrintingService`) - the guest's
        receipt still prints normally, since that's a separate print path keyed off the order,
        not this field. `SpaAppointmentTreatment.treatmentMenuItemId` must reference a `SPA`-
        department item with `durationMinutes` set; that's what makes an item schedulable.

    PrinterDepartment:
      type: string
      enum: [KITCHEN, BAR, CASHIER]
      description: >
        What a Printer receives. `KITCHEN`/`BAR` get routed kitchen/bar tickets (split from
        order line items by `MenuItem.department`); `CASHIER` gets pre-bills, guest receipts,
        and shift Z-reports - nothing routed by menu department ever goes there.

    PrinterCodepage:
      type: string
      enum: [PC437, TIS620]
      description: >
        The single-byte ESC/POS code page text is encoded into before sending, since receipts
        can contain non-ASCII (guest names, menu item names) and Latin/Thai need different
        tables. `PC437` (the standard US/Latin ESC/POS code page) is the default; `TIS620`
        covers Thai. Not a hardcoded global setting - each Printer picks its own, since a hotel
        can have Latin-only and Thai-capable printers side by side.

    PrintDocumentType:
      type: string
      enum: [KITCHEN_TICKET, BAR_TICKET, PREBILL, GUEST_RECEIPT, Z_REPORT, TEST_PAGE]
      description: >
        `KITCHEN_TICKET` and `BAR_TICKET` are the two station tickets an order send splits into
        by `MenuItem.department` - separate values (not one type disambiguated by `summary` text)
        so the queue can be filtered to a single station.

    PrintJobStatus:
      type: string
      enum: [PENDING, SENT, FAILED]
      description: >
        PENDING = queued, either freshly created or waiting for the next automatic retry.
        SENT = delivered successfully (terminal). FAILED = automatic retries exhausted - stays
        `FAILED` from here on regardless of what happens next: a manual retry
        (`POST /print-jobs/{id}/retry`) either succeeds (moves to `SENT`) or fails again, and
        dismissing it (`POST /print-jobs/dismiss`, see `PrintJob.dismissedAt`) doesn't change
        this value at all - it only stops the job counting as needing attention.

    Printer:
      type: object
      required: [id, name, department, host, port, codepage, isActive, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        department:
          $ref: "#/components/schemas/PrinterDepartment"
        host:
          type: string
          description: IP address or hostname on the hotel's local network.
        port:
          type: integer
          description: 'Almost always 9100 (raw ESC/POS-over-TCP) on real hardware.'
        codepage:
          $ref: "#/components/schemas/PrinterCodepage"
        isActive:
          type: boolean
          description: 'Whether this is currently the live printer for its `department` - see `Printer_one_active_per_department`.'
        createdAt:
          type: string
          format: date-time
        lastSentAt:
          type: string
          format: date-time
          description: >
            When this printer last accepted a job (the newest `SENT` print job's `updatedAt`).
            Derived from the print queue, not from a separate heartbeat: nothing polls a printer
            that has nothing to print, so a quiet printer simply has an old value here. Absent if
            it has never printed anything.
        lastFailedAt:
          type: string
          format: date-time
          description: >
            When a delivery attempt to this printer last failed (the newest `updatedAt` among its
            non-dismissed `PENDING`/`FAILED` jobs that carry a `lastError`). Dismissed jobs are
            left out because dismissing one also touches its `updatedAt`. Newer than
            `lastSentAt` means the printer is not answering right now. Absent if no undismissed
            attempt has failed.

    PrinterInput:
      type: object
      description: Full replacement on PATCH — no partial update (same convention as `MenuItemInput`/`TableInput`).
      required: [name, department, host]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        department:
          $ref: "#/components/schemas/PrinterDepartment"
        host:
          type: string
          minLength: 1
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 9100
        codepage:
          $ref: "#/components/schemas/PrinterCodepage"
          default: PC437
        isActive:
          type: boolean
          default: true

    PrintJob:
      type: object
      description: >
        A queued/attempted print. `payload` (the raw ESC/POS bytes actually sent) is
        intentionally not exposed here - it's binary and only meaningful to a printer.
        Dismissing a job (`POST /print-jobs/dismiss`) never deletes it or changes `status` - a
        dismissed job is still `FAILED`, just marked as not needing further attention. See
        `dismissedAt`.
      required: [id, printerId, documentType, summary, status, attempts, lastError, createdAt, updatedAt]
      properties:
        id:
          type: string
        printerId:
          type: string
        documentType:
          $ref: "#/components/schemas/PrintDocumentType"
        summary:
          type: string
          description: >
            Human-readable one-liner, e.g. "Kitchen ticket — Order #ab12cd34" or
            "Bar ticket — Order #ab12cd34" or, for a
            `GUEST_RECEIPT`, "Guest receipt — Order #ab12cd34 (CARD)" /
            "Guest receipt — Order #ab12cd34 (ROOM_CHARGE — Jane Doe)" - enough to tell two
            receipts on the same order apart at a glance. Never carries a money amount.
        status:
          $ref: "#/components/schemas/PrintJobStatus"
        attempts:
          type: integer
          description: Number of delivery attempts made so far (automatic + manual).
        lastError:
          type: string
          nullable: true
          description: 'Exception message from the most recent failed attempt; null if it has never failed.'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        dismissedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Set once this job is closed as not-actionable (`POST /print-jobs/dismiss`) - null
            for every job by default. `GET /print-jobs` excludes dismissed jobs unless
            `includeDismissed=true` is passed.
        dismissedByUserId:
          type: string
          nullable: true
        dismissNote:
          type: string
          nullable: true
          description: Optional free-text context supplied at dismiss time (e.g. "printer replaced 2026-09-02").

    DismissPrintJobsInput:
      type: object
      description: >
        Body of `POST /print-jobs/dismiss`. One call closes one or many jobs at once (a single
        job is just an array of one) - all-or-nothing, same as `PATCH /room-units/positions`:
        every id is checked (exists, visible to the caller's role, currently `FAILED`, not
        already dismissed) before any write happens.
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          items:
            type: string
        note:
          type: string
          description: Optional, applied to every job in this call - shown on each job and in its own audit-log entry.

    PrintAttemptResult:
      type: object
      description: Result of an on-demand print action that may legitimately have nothing to print to.
      required: [attempted]
      properties:
        attempted:
          type: boolean
          description: 'false when there was no active printer configured for the target department - nothing was queued.'
        job:
          $ref: "#/components/schemas/PrintJob"
          nullable: true
          description: 'null when `attempted` is false.'

    OrderStatus:
      type: string
      enum: [OPEN, SENT, PAID, CANCELLED]
      description: >
        OPEN (being built) -> SENT (sent to kitchen/bar, still editable-ish per business
        rule) -> PAID (closed with a Payment) or CANCELLED. PAID and CANCELLED are terminal.

    PaymentMethod:
      type: string
      enum: [CASH, CARD, ROOM_CHARGE, OTHER]
      description: >
        CARD is a ledger entry recorded on the cashier's word, not a confirmation from a
        payment terminal/acquirer — there is no card-processing integration.

    ShiftStatus:
      type: string
      enum: [OPEN, CLOSED]

    BookingStatus:
      type: string
      enum: [NEW, CONFIRMED, PAID, CANCELLED]

    BookingChannel:
      type: string
      enum: [DIRECT, PHONE, WALK_IN, BOOKING_COM, AIRBNB, AGODA, EXPEDIA, OTHER]
      description: >
        How a booking reached the hotel - a label staff record from what they already know (the
        guest booked by phone, walked in, said they found the hotel on Airbnb). Not an OTA
        integration: nothing is synced with any channel. `POST /bookings` (the public form) is
        always `DIRECT`, set server-side. Unrelated to the internal public-form-vs-front-desk
        distinction that drives auto-expiry of unconfirmed public inquiries, which is never
        exposed and never changes when this does. Bookings made before this field existed read
        `DIRECT` if they came through the public form and `OTHER` if staff entered them (their real
        channel was never recorded). Independent of `BookingPurpose`: a complimentary stay still
        has the channel it arrived by.

    BookingPurpose:
      type: string
      enum: [STANDARD, COMPLIMENTARY, HOUSE_USE]
      description: >
        Why the room is occupied: an ordinary paying stay (`STANDARD`), a complimentary stay
        (`COMPLIMENTARY`), or internal house use (`HOUSE_USE`). A separate question from
        `BookingChannel` (how the booking reached the hotel) - a comp booked by phone is
        `COMPLIMENTARY` + `PHONE`. Either way it is still a booking that occupies a room and counts
        as room-nights sold; a room taken out of sale is a `RoomUnitBlock` instead. Nothing forces
        `totalPrice` to zero for a comp or house-use stay - it is priced like any other booking.
        `POST /bookings` (the public form) is always `STANDARD`. Bookings made before this field
        existed read `STANDARD`.

    OccupancyStatus:
      type: string
      description: >
        Whether the guest is physically at the hotel - deliberately separate from
        `BookingStatus`, which stays commercial only (confirmed/paid/cancelled). One value per
        booking, not per segment: a guest checks in once and checks out once regardless of how
        many times they're relocated to a different room mid-stay. Never affects availability -
        the engine behind `GET /availability/{roomId}` and the booking calendar reads
        `BookingSegment`/`Booking.status` only, never this field. `NO_SHOW` is a label, not an
        action: it changes nothing about the booking's dates or `status`, and does not release
        any nights - the deliberate way to actually free them is cancelling or shortening the
        booking, a separate step.
      enum:
        - EXPECTED
        - CHECKED_IN
        - CHECKED_OUT
        - NO_SHOW

    CheckInResult:
      type: object
      description: >
        Response of `POST /bookings/{id}/check-in`. `warning` is set (but the check-in still
        succeeds) when the room being checked into is `DIRTY` - staff are told, not blocked; a
        room sometimes gets finished while the guest waits, and the desk must not stall on it.
      required: [booking, warning]
      properties:
        booking:
          $ref: "#/components/schemas/Booking"
        warning:
          type: string
          nullable: true

    CheckOutResult:
      type: object
      description: >
        Response of `POST /bookings/{id}/check-out`. `outstandingBalance` is the same number
        `GET /bookings/{id}/folio` would report at this instant (room total, if `status` isn't
        yet `PAID`, plus any uncollected `ROOM_CHARGE` payments) - the last moment front desk can
        act on it before the guest walks out. `"0.00"` means nothing is owed, not that the field
        was skipped.
      required: [booking, outstandingBalance]
      properties:
        booking:
          $ref: "#/components/schemas/Booking"
        outstandingBalance:
          type: string
          description: Decimal(10,2) rendered as a string.

    TodayBoardEntry:
      type: object
      description: >
        One row of `GET /bookings/today`. Whether a room still needs assigning
        (`booking.roomUnitId`) or cleaning (`booking.roomUnit.housekeepingStatus`) is already on
        the embedded `Booking` - this only adds what isn't: the folio balance, which needs its
        own payment lookup per booking.
      required: [booking, outstandingBalance]
      properties:
        booking:
          $ref: "#/components/schemas/Booking"
        outstandingBalance:
          type: string
          description: Decimal(10,2) rendered as a string. Same meaning as `CheckOutResult.outstandingBalance`.
        overdueDays:
          type: integer
          description: >
            How many days past `checkOut` a still-`CHECKED_IN` guest is (`0` when not overdue).
            The one rule for this lives in `OverstayRule` - an overdue guest is still in the house
            and still occupies their room tonight, on every screen. Same figure the night audit's
            missed departures show.

    TodayBoard:
      type: object
      description: >
        Response of `GET /bookings/today` - the front desk's daily working set, in the three
        groups reception actually thinks in. `arrivingToday` (`checkIn` = today,
        `occupancyStatus` = `EXPECTED`), `departingToday` (`checkOut` on or before today,
        `occupancyStatus` = `CHECKED_IN` - an overdue guest who should have left on an earlier day
        is still due out, see `TodayBoardEntry.overdueDays`), or `inHouse` (`occupancyStatus` =
        `CHECKED_IN`, regardless of date - a guest mid-stay, not just one departing today;
        `departingToday` is a subset by date, not a separate population). A booking marked `NO_SHOW` or already
        `CHECKED_OUT` today appears in none of the three - it's no longer part of today's
        open work.
      required: [arrivingToday, departingToday, inHouse]
      properties:
        arrivingToday:
          type: array
          items:
            $ref: "#/components/schemas/TodayBoardEntry"
        departingToday:
          type: array
          items:
            $ref: "#/components/schemas/TodayBoardEntry"
        inHouse:
          type: array
          items:
            $ref: "#/components/schemas/TodayBoardEntry"

    ErrorMessage:
      type: object
      required: [error]
      properties:
        error:
          type: string
      description: 'Generic error shape used by all hand-written `{ error: "..." }` responses.'

    ValidationError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          description: Output of Zod's `error.flatten()`.
          properties:
            formErrors:
              type: array
              items:
                type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
      example:
        error:
          formErrors: []
          fieldErrors:
            guestEmail: ["Invalid email"]

    OkTrue:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]

    OkUpdated:
      type: object
      required: [ok, updated]
      properties:
        ok:
          type: boolean
          enum: [true]
        updated:
          type: integer
          description: Number of day rows upserted.

    Room:
      type: object
      description: >
        Despite the name this is a **room type**, not a single physical room — individual
        sellable units are separate `RoomUnit` rows (see the RoomUnits tag). `activeUnitCount`
        is computed from those rows (`count(RoomUnit WHERE roomId = id AND isActive)`), not
        stored. `basePrice` is a Prisma `Decimal` — it serializes to a **string**, not a JSON
        number. `createdAt` serializes as an ISO-8601 datetime string.
      required: [id, name, description, capacity, activeUnitCount, basePrice, images, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        capacity:
          type: integer
        activeUnitCount:
          type: integer
          minimum: 0
          description: 'Computed - number of active (`isActive: true`) `RoomUnit` rows of this type.'
        basePrice:
          type: string
          description: Decimal(10,2) rendered as a string, e.g. `"1500.00"`.
        images:
          type: array
          items:
            type: string
          description: Paths under `/uploads/rooms/{id}/...`.
        createdAt:
          type: string
          format: date-time

    RoomInput:
      type: object
      description: >
        Body of `roomSchema`. Full replacement on PATCH — no partial update. Does not include a
        unit count - a room type has zero sellable units until `RoomUnit`s are added for it via
        `POST /room-units`.
      required: [name, description, capacity, basePrice]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          minLength: 10
        capacity:
          type: integer
          minimum: 1
          maximum: 20
          description: Coerced to a number server-side (`z.coerce.number()`); a numeric string is also accepted.
        basePrice:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Coerced to a number server-side (`z.coerce.number()`); a numeric string is also accepted.

    RoomUnit:
      type: object
      description: A single physical room ("203", "Garden Bungalow 4") - one sellable unit of a Room type.
      required: [id, roomId, label, isActive, housekeepingStatus, createdAt]
      properties:
        id:
          type: string
        roomId:
          type: string
        label:
          type: string
          description: Unique hotel-wide, not just within the room type.
        isActive:
          type: boolean
          description: Inactive units are excluded from `Room.activeUnitCount` and cannot be newly assigned to a booking.
        housekeepingStatus:
          $ref: "#/components/schemas/HousekeepingStatus"
        positionX:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: >
            Normalized (0..1) horizontal position on the property map image, set via
            `PATCH /room-units/positions`. Null (always paired with a null `positionY`) means
            this unit hasn't been placed on the map yet - a normal state, especially right after
            the map ships.
        positionY:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: Normalized (0..1) vertical position - see `positionX`.
        createdAt:
          type: string
          format: date-time

    HousekeepingStatus:
      type: string
      description: >
        Cleaning state of a physical room, independent of RoomUnitBlock (which pulls a unit off
        sale entirely, for a reason staff write out - maintenance, renovation). A DIRTY room is
        still sellable/assignable; `POST /bookings/{id}/check-in` warns but does not block when
        the room being checked into is dirty. `POST /bookings/{id}/check-out` always sets the
        checked-out booking's room DIRTY. Set explicitly via
        `PATCH /room-units/{id}/housekeeping`, CASHIER+.
      enum:
        - DIRTY
        - CLEAN

    HousekeepingStatusInput:
      type: object
      description: Body of `PATCH /room-units/{id}/housekeeping`.
      required: [housekeepingStatus]
      properties:
        housekeepingStatus:
          $ref: "#/components/schemas/HousekeepingStatus"

    RoomUnitInput:
      type: object
      description: Body of `POST /room-units`.
      required: [roomId, label]
      properties:
        roomId:
          type: string
        label:
          type: string
          minLength: 1
          maxLength: 60
        isActive:
          type: boolean
          default: true

    RoomUnitUpdateInput:
      type: object
      description: Body of `PATCH /room-units/{id}`. Full replacement of `label`/`isActive` — `roomId` is immutable after creation.
      required: [label, isActive]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
        isActive:
          type: boolean

    RoomUnitPositionInput:
      type: object
      description: >
        One entry of the array body of `PATCH /room-units/positions`. `positionX`/`positionY`
        must both be null (clears the position, returning the unit to "not placed") or both set
        within 0..1 - never one without the other; checked manually in `RoomUnitService`, not
        via `required` below. Deliberately NOT listing `positionX`/`positionY` under `required`
        despite them conceptually needing to be present: `org.openapitools:jackson-databind-
        nullable`'s Bean Validation integration registers an `@UnwrapByDefault` `ValueExtractor`
        for `JsonNullable<T>`, so a generated `@NotNull` on a `nullable: true` + `required`
        property validates the *unwrapped* value, rejecting the exact `null` these fields exist
        to accept - same reasoning as `RoomUnitAssignmentInput.roomUnitId` above.
      required: [roomUnitId]
      properties:
        roomUnitId:
          type: string
        positionX:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        positionY:
          type: number
          nullable: true
          minimum: 0
          maximum: 1

    RoomUnitBlockMaintenanceTask:
      type: object
      description: >
        Summary of the maintenance task this block was raised for, if any - a block can exist
        with no task at all, and a task can be linked to an existing block after the fact (see
        `MaintenanceTask.blockId`), so this is resolved live at read time, not stored on the
        block itself. Deliberately not the same shape as `PropertyMapMaintenanceTask` - no
        `blockExpired` here, since that field answers "has this block's own date range already
        passed while the task is still open," which is meaningless when the block being described
        is the very one already on screen.
      required: [taskId, description, status]
      properties:
        taskId:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/MaintenanceTaskStatus"

    RoomUnitBlock:
      type: object
      description: >
        A physical room pulled off sale for a date range, with a reason. Replaces the old
        Room-level `Availability.blockedCount`. `fromDate`/`toDate` are both inclusive.
      required: [id, roomUnitId, fromDate, toDate, reason, createdAt, createdByEmail, maintenanceTask]
      properties:
        id:
          type: string
        roomUnitId:
          type: string
        fromDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        toDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
        createdByEmail:
          type: string
          nullable: true
          description: >
            Denormalized from the creating user at read time, same convention as
            `Order.openedByEmail` - null for a block created before this was tracked, not a
            display bug; there is no "unknown user" placeholder to invent for history that was
            never captured.
        maintenanceTask:
          $ref: "#/components/schemas/RoomUnitBlockMaintenanceTask"
          nullable: true

    RoomUnitBlockInput:
      type: object
      description: Body of `POST /room-units/{id}/blocks`.
      required: [fromDate, toDate, reason]
      properties:
        fromDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        toDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        reason:
          type: string
          minLength: 1
      # Cross-field rule: fromDate <= toDate (matches RoomUnitBlock_date_range_check).

    RoomUnitBlockAffectedBooking:
      type: object
      description: >
        One booking whose stay overlaps a block being created on this unit - enough for the UI
        to name the guest and link to the booking (`GET /bookings/{id}`), not the full `Booking`
        object. `checkIn`/`checkOut`/`status` are the booking's own derived-from-segments fields
        (see `Booking`'s own description), not the specific segment that touches this unit - the
        overwhelmingly common case is one segment, and this stays a simple per-booking summary
        rather than a per-segment one.
      required: [bookingId, guestName, checkIn, checkOut, status]
      properties:
        bookingId:
          type: string
        guestName:
          type: string
        checkIn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        checkOut:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        status:
          $ref: "#/components/schemas/BookingStatus"

    RoomUnitBlockResult:
      type: object
      description: >
        Response of `POST /room-units/{id}/blocks`. `warning` is set (but the block is still
        created) when the blocked range overlaps one or more non-CANCELLED bookings - staff are
        told, not blocked, the same warn-don't-block shape as `CheckInResult`. Two distinct
        populations, because the manager's next move differs for each: `affectedBookings` are
        assigned to this exact physical unit (a certain conflict - the guest is in this specific
        room); `affectedUnassignedBookings` are booked into this unit's *room type* with no
        specific unit chosen yet (`Booking.roomUnitId` null) - not yet in this room, but pulling
        one more unit out of the type's pool can leave too few units for them, the same oversell
        `AvailabilityDay.availableCount` already models by not clamping at zero (see that
        schema). Both use the same overlap rule the calendar/availability engine already use to
        compare a booking against a block: `booking.checkIn <= block.toDate && booking.checkOut >
        block.fromDate` - `RoomUnitBlock.fromDate`/`toDate` are both inclusive, a booking's
        `checkOut` is exclusive (the departure day is free), so a block starting on a booking's
        checkout day does not warn.
      required: [block, warning, affectedBookings, affectedUnassignedBookings]
      properties:
        block:
          $ref: "#/components/schemas/RoomUnitBlock"
        warning:
          type: string
          nullable: true
        affectedBookings:
          type: array
          items:
            $ref: "#/components/schemas/RoomUnitBlockAffectedBooking"
        affectedUnassignedBookings:
          type: array
          items:
            $ref: "#/components/schemas/RoomUnitBlockAffectedBooking"
          description: >
            Non-CANCELLED bookings of this unit's room type, over the same dates, with no room
            unit assigned yet - not tied to this specific room, but competing for the same pool
            of units it belongs to. Does not attempt to compute whether the type actually goes
            into oversell (that depends on every other unit/booking of the type over the whole
            range, not just this one block) - it names the population that could be affected and
            leaves the judgment to the manager, the same warn-don't-decide stance as the rest of
            this response.

    MaintenanceTaskStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, DONE]
      description: >
        Forward-only in practice (see `PATCH /maintenance-tasks/{id}/status`): OPEN ->
        IN_PROGRESS -> DONE, skipping IN_PROGRESS allowed, going backward or repeating the
        current status is not.

    MaintenanceTask:
      type: object
      description: >
        A reported problem in a physical room. `roomId`/`roomName`/`unitLabel` are denormalized
        display fields (same pattern as `PropertyMapUnit`) so the UI doesn't need a second round
        trip. `blockId` is null until a manager links one via `POST /maintenance-tasks/{id}/block`
        - a block is optional, not every task needs the room pulled off sale. `closedAt` is null
        until `status` becomes `DONE`.
      required:
        [id, roomUnitId, roomId, roomName, unitLabel, description, status, blockId, reportedByUserId, reportedByEmail, photos, createdAt, closedAt]
      properties:
        id:
          type: string
        roomUnitId:
          type: string
        roomId:
          type: string
        roomName:
          type: string
        unitLabel:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/MaintenanceTaskStatus"
        blockId:
          type: string
          nullable: true
        reportedByUserId:
          type: string
        reportedByEmail:
          type: string
        photos:
          type: array
          items:
            type: string
          description: Served paths under `/maintenance-tasks/{id}/photos/{filename}` - staff-only, never `/uploads/**`.
        createdAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true

    MaintenanceTaskStatusUpdateInput:
      type: object
      description: Body of `PATCH /maintenance-tasks/{id}/status`.
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/MaintenanceTaskStatus"

    MaintenanceTaskBlockResult:
      type: object
      description: >
        Response of `POST /maintenance-tasks/{id}/block`. `blockResult` is exactly what
        `POST /room-units/{id}/blocks` itself returns (same overlap warning, same two affected-
        bookings populations) - linking a block to a task doesn't change that behavior, it reuses
        it.
      required: [task, blockResult]
      properties:
        task:
          $ref: "#/components/schemas/MaintenanceTask"
        blockResult:
          $ref: "#/components/schemas/RoomUnitBlockResult"

    SpaAppointmentStatus:
      type: string
      enum: [BOOKED, COMPLETED, CANCELLED, NO_SHOW]
      description: >
        Forward-only from `BOOKED` in practice: `PATCH /spa-appointments/{id}/status` accepts
        `COMPLETED`/`CANCELLED`/`NO_SHOW` as targets (never back to `BOOKED`, never between the
        three end states). `BOOKED` and `COMPLETED` both hold their slot - see `SpaAppointment`'s
        own description of the exclusion constraints, scoped `WHERE status IN ('BOOKED',
        'COMPLETED')` - completing a treatment must not free its table/therapist while it's still
        running. Only `CANCELLED`/`NO_SHOW` release the slot for a new booking of the same
        table/therapist/time.

    SpaAppointment:
      type: object
      description: >
        A half-hour-grid treatment slot - occupies both a POS `Table` (in the SPA zone) and a
        therapist (a staff `User` holding the `THERAPIST` job function) for
        `[startTime, startTime + durationMinutes)` on `date`. Always names a booking - there is
        no walk-in path and no separate client record (hotel guests only); `guestName` is
        resolved from that booking at read time, not stored here.

        `treatments` is one row per treatment booked on this appointment - the same treatment
        added twice is two rows, not a quantity of two (see `SpaAppointmentTreatment`).
        `durationMinutes` on this object is a maintained sum of `treatments[].durationMinutes`,
        kept as its own number so the two `EXCLUDE USING gist` constraints on the
        `SpaAppointment` table (one keyed on `tableId`, one on `therapistUserId`, each restricted
        to `status IN ('BOOKED', 'COMPLETED')` rows - see `V41__spa_appointment.sql` and
        `V43__spa_appointment_completed_still_occupies_slot.sql`) keep reading one plain column
        and never need to know the treatment table exists. The appointment's end is never
        stored - it's always `startTime + durationMinutes`, computed wherever needed. `date`/
        `startTime` are a plain date-only string and a plain local `HH:mm` string - the hotel is
        a single location and nothing in this API converts time zones, so there is deliberately
        no offset anywhere on this schema.

        The appointment stores no price - see `SpaAppointmentTreatment.currentPrice` and
        `orderId`. Only `durationMinutes` is frozen per treatment; unlike a room night, a
        treatment bills through the ordinary POS `OrderItem`/menu path, which prices every line
        live off the menu at the moment it's added to an order - freezing a second price here
        would just manufacture a number that can silently disagree with the one actually
        charged, not protect a guest-facing quote (none is shown when an appointment is booked).
        See CLAUDE.md's Spa billing section for the full reasoning.

        `missingTreatmentNames` names the completeness warning: which of this appointment's
        treatments the linked order does not (yet) carry. Only meaningful once `status` is
        `COMPLETED` - empty for every other status, regardless of `orderId`. A `CANCELLED` linked
        order counts as carrying nothing (a cancelled order bills nothing), so an appointment
        linked to one still shows every treatment as missing.

        A therapist losing the `THERAPIST`
        function or being deactivated while holding future `BOOKED` appointments does not cascade
        to this row automatically - `PATCH /users/{id}/active` / `PATCH /users/{id}/functions`
        instead return a warning listing the affected future appointments, the same warn-don't-
        block shape as `RoomUnitBlockResult`. Cancelling/shortening/early-checking-out the named
        booking has no equivalent warning today - nothing in this system cascades a booking-date
        change to this row, and no write path checks for an affected future appointment the way
        the therapist-side paths do. That gap is real, not yet closed.
      required:
        [
          id,
          bookingId,
          guestName,
          tableId,
          tableLabel,
          therapistUserId,
          therapistName,
          treatments,
          date,
          startTime,
          durationMinutes,
          status,
          orderId,
          missingTreatmentNames,
          createdByUserId,
          cancelledByUserId,
          cancelReason,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
        bookingId:
          type: string
        guestName:
          type: string
          description: Denormalized from the named booking at read time - same convention as `PropertyMapCurrentBooking.guestName`.
        tableId:
          type: string
        tableLabel:
          type: string
          description: Denormalized from the named table at read time.
        therapistUserId:
          type: string
        therapistName:
          type: string
          description: >
            Denormalized from the named therapist at read time. Unlike `Order.openedByEmail`,
            this names an appointment's *subject*, not an actor - THERAPIST is an ordinary staff
            tag (see `JobFunction`), so the named therapist may have no login at all, which is
            exactly why this is `therapistName` and not `therapistEmail`.
        therapistEmail:
          type: string
          description: >
            Absent for a no-login therapist (see `UserCreateInput`) - `therapistName` is the
            field to display, never absent.
        roomUnitLabel:
          type: string
          description: >
            The physical room (`RoomUnit.label`) the named booking occupies on `date`, resolved
            at read time from the booking's segments - so a relocated stay shows the room the
            guest is actually in that day. On a date outside the stay (allowed, with a warning -
            see `POST /spa-appointments`), the nearest segment's room: the last one from the
            departure day on, the first one before arrival. Absent when that segment has no room
            unit assigned yet.
        treatments:
          type: array
          items:
            $ref: "#/components/schemas/SpaAppointmentTreatment"
          description: One row per treatment, in no particular guaranteed order. Always at least one - an appointment cannot exist with zero treatments.
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Local 24-hour `HH:mm`. No time zone anywhere on this schema - see the class description.
        durationMinutes:
          type: integer
          description: A maintained sum of `treatments[].durationMinutes` - see the class description.
        status:
          $ref: "#/components/schemas/SpaAppointmentStatus"
        orderId:
          type: string
          nullable: true
          description: >
            The POS order that charged this treatment, if any - auto-resolved server-side once
            the order actually carries a `SPA`-department item and names this appointment's
            booking or table unambiguously, or set via an explicit `spaAppointmentId` on
            `OrderCreateInput` (see that field for exactly how), never computed or amount-bearing
            here. A `COMPLETED` appointment with `orderId: null` is a real, visible gap (a
            treatment settled another way, or one nobody rang up yet) - deliberately not blocked,
            see the class description.
        missingTreatmentNames:
          type: array
          items:
            type: string
          description: See the class description. Empty when there's nothing to warn about.
        createdByUserId:
          type: string
        cancelledByUserId:
          type: string
          nullable: true
        cancelReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SpaAppointmentTreatment:
      type: object
      description: >
        One treatment on a `SpaAppointment` - see that schema's own description for why this is
        a child row and not a quantity. `durationMinutes` is frozen at add time from
        `MenuItem.durationMinutes`, same "agreed terms are frozen" precedent the appointment
        itself already uses for its own maintained sum. `currentPrice` is deliberately not
        frozen - it's a live read of `MenuItem.price` at response time, the same "denormalized,
        not frozen" convention `treatmentName` already uses, shown so reception can see what a
        treatment currently costs. It is never authoritative for billing and never sent to any
        write endpoint - the server always prices the actual charge live off the menu when a
        treatment is added to an order, the ordinary `POST /orders/{id}/items` path every other
        department already uses.
      required: [id, treatmentMenuItemId, treatmentName, durationMinutes, currentPrice]
      properties:
        id:
          type: string
        treatmentMenuItemId:
          type: string
        treatmentName:
          type: string
          description: Denormalized `MenuItem.name` at read time - the treatment's current name, not frozen (unlike `durationMinutes`).
        durationMinutes:
          type: integer
          description: Frozen at add time from `MenuItem.durationMinutes`.
        currentPrice:
          type: string
          description: Live `MenuItem.price` at response time - see the class description for why this isn't frozen and isn't billing-authoritative.

    SpaAppointmentTreatmentCreateInput:
      type: object
      description: >
        Body of `POST /spa-appointments/{id}/treatments`. `treatmentMenuItemId` must reference a
        `SPA`-department item with `durationMinutes` set, same validation as
        `SpaAppointmentCreateInput`.
      required: [treatmentMenuItemId]
      properties:
        treatmentMenuItemId:
          type: string

    SpaAppointmentCreateInput:
      type: object
      description: >
        Body of `POST /spa-appointments`. `treatmentMenuItemId` must reference a `SPA`-department
        item with `durationMinutes` set (400 otherwise) - the appointment's first treatment; add
        more afterward with `POST /spa-appointments/{id}/treatments`. `date` outside the named
        booking's `[checkIn, checkOut]` (inclusive both ends - the guest is still in the hotel on
        the departure day) is a warning, not a rejection - see `SpaAppointmentResult`.
      required: [bookingId, tableId, therapistUserId, treatmentMenuItemId, date, startTime]
      properties:
        bookingId:
          type: string
        tableId:
          type: string
        therapistUserId:
          type: string
        treatmentMenuItemId:
          type: string
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'

    SpaAppointmentResult:
      type: object
      description: Response of `POST /spa-appointments`. `warning` is set (creation still succeeds) when `date` falls outside the named booking's stay - see `SpaAppointmentCreateInput`.
      required: [appointment, warning]
      properties:
        appointment:
          $ref: "#/components/schemas/SpaAppointment"
        warning:
          type: string
          nullable: true

    SpaAppointmentScheduleInput:
      type: object
      description: >
        Body of `PATCH /spa-appointments/{id}/schedule`. Full replacement of all four fields -
        same `tableId`/`therapistUserId`/`date`/`startTime` shape as `SpaAppointmentCreateInput`,
        minus `bookingId`/`treatmentMenuItemId` (neither changes here) and `durationMinutes`
        stays frozen from creation (see `SpaAppointment.durationMinutes`), so the appointment's
        own length is preserved regardless of where it moves.
      required: [tableId, therapistUserId, date, startTime]
      properties:
        tableId:
          type: string
        therapistUserId:
          type: string
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'

    SpaAppointmentStatusUpdateInput:
      type: object
      description: >
        Body of `PATCH /spa-appointments/{id}/status`. Only `COMPLETED`, `CANCELLED`, `NO_SHOW`
        are legal targets - see `SpaAppointmentStatus`. `cancelReason` is only meaningful (and
        only read) when `status` is `CANCELLED`.
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/SpaAppointmentStatus"
        cancelReason:
          type: string
          maxLength: 500

    SwapSpaAppointmentTableInput:
      type: object
      description: >
        Body of `POST /spa-appointments/{id}/swap-table`. The dragged appointment is named by the
        URL (`{id}`); this names the other side - same "the gesture has a direction" reasoning as
        `SwapSegmentRoomUnitInput`. Only the table changes for either side - `date`, `startTime`,
        `therapistUserId`, and `durationMinutes` all stay exactly as they were, which is what
        makes this well-defined regardless of how long either treatment runs: a 30-minute
        treatment and a 90-minute one trade tables exactly the same way two 90-minute ones would,
        because nothing about "how long" or "when" ever moves.
      required: [otherAppointmentId]
      properties:
        otherAppointmentId:
          type: string
          description: The other appointment to trade tables with. Must currently be BOOKED, same as the URL's own appointment.

    SpaSchedule:
      type: object
      description: >
        Response of `GET /spa-appointments?date=`. `openingTime`/`closingTime`/`slotMinutes` come
        from the backend's own config (`app.spa.*`), not a frontend constant, so the grid can
        never render slots the server wouldn't accept. `tables` is every active SPA-zone `Table`
        (the grid's rows); `appointments` is every appointment on `date` regardless of status (a
        cancelled/no-show slot still needs to render, just not as occupied).
      required: [date, openingTime, closingTime, slotMinutes, tables, appointments]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        openingTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        closingTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        slotMinutes:
          type: integer
        tables:
          type: array
          items:
            $ref: "#/components/schemas/Table"
        appointments:
          type: array
          items:
            $ref: "#/components/schemas/SpaAppointment"

    SpaTherapist:
      type: object
      description: >
        Minimal projection of a staff `User` holding the `THERAPIST` job function, for
        `GET /spa-appointments/therapists` - narrower than `GET /users` (ADMIN-only, deliberately
        outside the role hierarchy) so a CASHIER creating an appointment can list valid
        therapists without that escalation, the same "a role that may act must be able to read
        what the action needs" fix already applied to `GET /room-units`/`GET /availability`.
        Excludes an inactive user - see `PATCH /users/{id}/active`. `email` is absent for a
        no-login account (see `UserCreateInput`) - THERAPIST is an ordinary staff tag, unrelated
        to whether the account can sign in, so `name` is the field this picker displays, never
        absent.
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string

    SpaMapTableAppointment:
      type: object
      description: >
        A summary of one of today's appointments on a `SpaMapTable`, for the map's own detail
        panel - every status, not just `BOOKED`/`COMPLETED` (a cancelled/no-show slot is still
        part of the day's own story, same "still needs to render" reasoning `SpaSchedule.appointments`
        already documents). Not a substitute for `SpaAppointment` - no id-level editing lives here,
        only enough to list and link out to the real schedule.
      required: [id, startTime, durationMinutes, status, guestName, treatmentNames]
      properties:
        id:
          type: string
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        durationMinutes:
          type: integer
        status:
          $ref: "#/components/schemas/SpaAppointmentStatus"
        guestName:
          type: string
        treatmentNames:
          type: array
          items:
            type: string

    SpaMapTable:
      type: object
      description: >
        One SPA-zone table on the map (`GET /spa-map`), enriched with today's occupancy - the
        same kind of enrichment `PropertyMapUnit` already does for a room unit, computed the same
        way: once, server-side, from data already fetched for another read
        (`SpaAppointmentService#getSchedule`, the day grid's own batched query), not a per-table
        query. `busy` and `nextAppointmentStartTime` are two sides of one axis - a table is
        occupied by a `BOOKED`/`COMPLETED` appointment covering this exact moment (the same
        occupying-statuses set the two `EXCLUDE USING gist` constraints use, see
        `V43__spa_appointment_completed_still_occupies_slot.sql`), or it's free, in which case
        `nextAppointmentStartTime` names when that stops being true (or stays `null` for the rest
        of the day). `isActive` is a third, independent fact, exactly like
        `PropertyMapUnit.isActive` - a deactivated table is still listed here, dimmed, never
        excluded, and its `busy`/`nextAppointmentStartTime`/`appointments` are still the real
        values (whatever inactive-but-still-technically-scheduled state that implies) rather than
        being zeroed out - which state wins visually is a frontend decision, not encoded here.
      required: [tableId, label, capacity, shape, isActive, positionX, positionY, busy, nextAppointmentStartTime, appointments]
      properties:
        tableId:
          type: string
        shape:
          $ref: "#/components/schemas/TableShape"
        label:
          type: string
        capacity:
          type: integer
        isActive:
          type: boolean
        positionX:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        positionY:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        busy:
          type: boolean
          description: True when a BOOKED or COMPLETED appointment on this table covers this exact moment.
        nextAppointmentStartTime:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: The next BOOKED appointment's startTime today, after now - null when nothing is left today, regardless of `busy`.
        appointments:
          type: array
          items:
            $ref: "#/components/schemas/SpaMapTableAppointment"
          description: Every one of today's appointments on this table, regardless of status.

    SpaMap:
      type: object
      description: >
        The spa's own floor-plan background image and its tables' today-state - `GET /spa-map`,
        with the actual image bytes served separately from `GET /spa-map/image`, same split as
        `PropertyMap`/`GET /property-map/image`. Deliberately its own image, not the property
        map's: the spa's floor plan is SPA-zone tables (placed via `PATCH /tables/positions`, see
        `Table.positionX`), a different physical layout at a different scale than the property
        map's rooms, and a manager replacing one must never be mistaken for replacing the other.
      required: [imagePath, imageUpdatedAt, tables]
      properties:
        imagePath:
          type: string
          nullable: true
          description: Null until a manager uploads one via `POST /spa-map/image` - a normal state right after this ships.
        imageUpdatedAt:
          type: string
          format: date-time
          nullable: true
        tables:
          type: array
          items:
            $ref: "#/components/schemas/SpaMapTable"
          description: Every SPA-zone table (placed on the map or not, active or not), enriched with today's occupancy - see `SpaMapTable`.

    RestaurantMapTable:
      type: object
      description: >
        One non-SPA table on the restaurant map (`GET /restaurant-map`). `openOrderIds` are the
        table's `OPEN`/`SENT` orders - the same set the POS board treats as "occupied", and more
        than one is possible (`POST /orders` doesn't enforce one order per table). `isActive` is
        an independent fact, as on `SpaMapTable`: a deactivated table is still listed, never
        excluded.
      required: [tableId, label, zone, capacity, shape, isActive, positionX, positionY, openOrderIds]
      properties:
        tableId:
          type: string
        shape:
          $ref: "#/components/schemas/TableShape"
        label:
          type: string
        zone:
          $ref: "#/components/schemas/Zone"
        capacity:
          type: integer
        isActive:
          type: boolean
        positionX:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        positionY:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        openOrderIds:
          type: array
          items:
            type: string

    RestaurantMap:
      type: object
      description: >
        The restaurant's own floor-plan background image and its tables - `GET /restaurant-map`,
        with the image bytes served from `GET /restaurant-map/image`, same split as `SpaMap`. Its
        own image, not the spa's or the property map's: a different room, and replacing one must
        never be mistaken for replacing another.
      required: [imagePath, imageUpdatedAt, tables]
      properties:
        imagePath:
          type: string
          nullable: true
          description: Null until a manager uploads one via `POST /restaurant-map/image`.
        imageUpdatedAt:
          type: string
          format: date-time
          nullable: true
        tables:
          type: array
          items:
            $ref: "#/components/schemas/RestaurantMapTable"

    PropertyMapMaintenanceTask:
      type: object
      description: >
        Summary of the most urgent open (`OPEN`/`IN_PROGRESS`) `MaintenanceTask` on a
        `PropertyMapUnit`, if any - see that schema's `openMaintenanceTask`. When a unit has more
        than one open task, the one with `blockExpired: true` is preferred (if any), else the
        oldest.
      required: [taskId, description, status, blockExpired]
      properties:
        taskId:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/MaintenanceTaskStatus"
        blockExpired:
          type: boolean
          description: >
            True when this task has a linked block whose `toDate` has already passed while the
            task is still open - the room has silently returned to sale while still broken. The
            one state this field exists to catch; everything else about the task is informational.

    PropertyMapCurrentBooking:
      type: object
      description: >
        The booking a room unit is showing on the map right now - either a guest checked in this
        moment, or, only when the unit isn't currently occupied, a guest expected to check in
        today. Never both - a unit shows at most one of these.
      required: [bookingId, guestName, checkOut, occupancyStatus, outstandingBalance]
      properties:
        bookingId:
          type: string
        guestName:
          type: string
        checkOut:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        occupancyStatus:
          $ref: "#/components/schemas/OccupancyStatus"
        outstandingBalance:
          type: string
          description: >
            Decimal(10,2) as a string, from `BookingService#computeOutstandingBalance` - the
            same PAID-aware figure the check-out warning and `TodayBoardEntry` already use, not
            re-derived.
        overdueDays:
          type: integer
          description: >
            How many days past `checkOut` a still-`CHECKED_IN` guest is (`0` when not overdue).
            The one rule for this lives in `OverstayRule` - an overdue guest is still in the house
            and still occupies their room tonight, on every screen. Same figure the night audit's
            missed departures show.

    PropertyMapActiveBlock:
      type: object
      description: >
        A `RoomUnitBlock` covering today - independent of `PropertyMapUnit.isActive`, see that
        schema's description for why the two must not be collapsed into one flag.
      required: [reason, fromDate, toDate]
      properties:
        reason:
          type: string
        fromDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        toDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'

    PropertyMapUnit:
      type: object
      description: >
        One physical room on the property map (`GET /property-map`). `isActive` (permanently
        deactivated) and `activeBlock` (temporarily pulled off sale today, `isActive` still
        true) are independent facts and both always present here - never collapse them into a
        single "unavailable" flag, they mean different things and the frontend's display rule
        treats them differently (a deactivated unit reads as gone from the picture; a blocked
        unit reads as "unavailable today, will return" with its reason shown). Which one wins
        visually when both happen to be true is a frontend decision, not encoded in this DTO.
      required:
        [
          roomUnitId,
          roomId,
          roomName,
          unitLabel,
          isActive,
          housekeepingStatus,
          positionX,
          positionY,
          currentBooking,
          activeBlock,
          openMaintenanceTask,
        ]
      properties:
        roomUnitId:
          type: string
        roomId:
          type: string
        roomName:
          type: string
        unitLabel:
          type: string
        isActive:
          type: boolean
        housekeepingStatus:
          $ref: "#/components/schemas/HousekeepingStatus"
        positionX:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        positionY:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        currentBooking:
          $ref: "#/components/schemas/PropertyMapCurrentBooking"
          nullable: true
        activeBlock:
          $ref: "#/components/schemas/PropertyMapActiveBlock"
          nullable: true
        openMaintenanceTask:
          $ref: "#/components/schemas/PropertyMapMaintenanceTask"
          nullable: true
          description: >
            Computed at read time, not a stored alert - reuses this existing per-unit carrier
            rather than a new notification mechanism (see that schema's own `blockExpired`).

    PropertyMap:
      type: object
      description: >
        Body of `GET /property-map` - the front desk's visual map: every physical room (placed
        on the map or not), enriched with today's occupancy/housekeeping/debt/block state, plus
        the current background image. A dedicated addition to `TodayBoard`/the booking calendar,
        not a replacement for either.
      required: [imagePath, imageUpdatedAt, units]
      properties:
        imagePath:
          type: string
          nullable: true
          description: Null until a manager uploads one via `POST /property-map/image` - a normal state right after this ships.
        imageUpdatedAt:
          type: string
          format: date-time
          nullable: true
        units:
          type: array
          items:
            $ref: "#/components/schemas/PropertyMapUnit"

    RoomUnitAssignmentInput:
      type: object
      description: >
        Body of `PUT /bookings/{id}/room-unit`. `roomUnitId` must be present in the payload
        (either a string or explicit `null`) - deliberately NOT listed under `required` below
        despite that, because `org.openapitools:jackson-databind-nullable`'s Jakarta Bean
        Validation integration registers an `@UnwrapByDefault` `ValueExtractor` for
        `JsonNullable<T>`: a generated `@NotNull` on a `nullable: true` + `required` property
        would validate the *unwrapped* value, rejecting the exact `null` this field exists to
        accept. Presence is checked manually in `BookingService`, the same way other rules Bean
        Validation can't correctly express are handled elsewhere in this API (see
        `ValidationException`).
      properties:
        roomUnitId:
          type: string
          nullable: true
          description: The room unit to assign, or `null` to clear the current assignment.

    StaffBookingCreateInput:
      type: object
      description: >
        Body of `POST /bookings/staff`. Front-desk booking creation (walk-in guest at the
        counter), distinct from the public `POST /bookings` guest inquiry flow: no
        new-booking notification email is sent (that email exists to tell ADMIN/MANAGER about
        a guest-submitted request, not every reservation staff makes at the counter), and guest
        contact details are optional - a walk-in may not have an email address on hand. If
        `roomUnitId` is given, the physical room is assigned atomically in the same
        `Serializable` transaction as the booking itself: unlike `POST /bookings` followed by
        `PUT /bookings/{id}/room-unit`, there is no window where the booking exists without the
        room that was requested for it - either both succeed or neither does.
      required: [roomId, guestName, checkIn, checkOut, channel, adults]
      properties:
        roomId:
          type: string
          minLength: 1
        guestName:
          type: string
          minLength: 2
          maxLength: 120
        guestEmail:
          type: string
          format: email
          nullable: true
          x-sensitive: true
        guestPhone:
          type: string
          minLength: 5
          maxLength: 40
          nullable: true
          x-sensitive: true
        checkIn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        checkOut:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        roomUnitId:
          type: string
          nullable: true
          description: Physical room to assign immediately, or omit/null to leave the booking unassigned (same as a `POST /bookings` booking today).
        channel:
          $ref: "#/components/schemas/BookingChannel"
          description: Required - front desk always knows how a phone/walk-in booking reached them, so there is no default to fall back to silently.
        purpose:
          $ref: "#/components/schemas/BookingPurpose"
          description: Optional, defaults to `STANDARD` - most staff bookings are ordinary paying stays.
        adults:
          type: integer
          minimum: 1
          description: Number of adults in the party - at least one.
        children:
          type: integer
          minimum: 0
          default: 0
          description: Number of children in the party. Optional, defaults to 0.
        guestId:
          type: string
          nullable: true
          description: >
            An existing `Guest` card picked at the counter. When given, the booking is linked to
            exactly that card (404 if it doesn't exist) instead of the usual find-or-create by
            `guestEmail`. `guestName`/`guestEmail`/`guestPhone` are still the booking's own
            snapshot of what was given - the form prefills them from the card, but whatever is sent
            is what's stored.
      # Cross-field rule enforced server-side, not expressible in JSON Schema: checkIn must be strictly before checkOut.

    StaffBookingQuoteInput:
      type: object
      description: Body of `POST /bookings/staff/quote` - the fields of `StaffBookingCreateInput` that decide price and availability.
      required: [roomId, checkIn, checkOut]
      properties:
        roomId:
          type: string
          minLength: 1
        checkIn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        checkOut:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        roomUnitId:
          type: string
          nullable: true
          description: When given, also checks that this physical room is free, active and of this room type for the stay.

    BookingSortField:
      type: string
      enum: [GUEST_NAME, ROOM, CHECK_IN, CHECK_OUT, TOTAL_PRICE, STATUS, CREATED_AT]
      description: Sort column for `GET /bookings/search`. `ROOM` sorts by the room type's name. Defaults to `CHECK_IN`.

    SortDirection:
      type: string
      enum: [ASC, DESC]
      description: Defaults to `DESC` on `GET /bookings/search` (latest stays first).

    BookingPage:
      type: object
      description: One page of `GET /bookings/search` results.
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
          description: Total number of matching bookings across all pages.

    BookingScheduleInput:
      type: object
      description: >
        Body of `PATCH /bookings/{id}/schedule` and `POST /bookings/{id}/schedule/quote` - the
        booking's full desired schedule (dates and physical room together), not a partial patch.
        Used for extending/shortening a stay, moving a booking to a different physical room, or
        both at once (e.g. dragging a reservation to a different row and different dates on the
        booking calendar grid). The room *type* (`roomId`) cannot be changed this way - only
        `checkIn`/`checkOut`/`roomUnitId`. `roomUnitId: null` leaves (or makes) the booking
        unassigned; a non-null value must belong to the same room type as the booking.
        `roomUnitId` must be present in the payload (string or explicit `null`) but is
        deliberately not listed under `required` - see `RoomUnitAssignmentInput`'s description
        for why a generated `@NotNull` on this field would incorrectly reject `null`; presence is
        checked manually in `BookingService` instead.


        On a booking with more than one segment (see `Booking.segments`), only a change that
        moves exactly one outer edge of the stay is accepted - see the PATCH endpoint's own
        description for exactly which changes that covers and which are rejected.
      required: [checkIn, checkOut]
      properties:
        checkIn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        checkOut:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        roomUnitId:
          type: string
          nullable: true
          description: The room unit to assign, or `null` to leave/make the booking unassigned.

    RelocationInput:
      type: object
      description: >
        Body of `POST /bookings/{id}/relocate` and `POST /bookings/{id}/relocate/quote`. Unlike
        `BookingScheduleInput`, `roomId` (the room *type*) can change here - a relocation is
        exactly the operation that lets a guest move to a different type of room mid-stay, at
        that type's own price. `roomUnitId: null` is legal (relocate to "this type, unit not yet
        chosen").
      required: [effectiveDate, roomId]
      properties:
        effectiveDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: The first night of the new segment. Must fall strictly after the start of the segment currently covering it.
        roomId:
          type: string
        roomUnitId:
          type: string
          nullable: true

    RelocationUndoInput:
      type: object
      description: Body of `POST /bookings/{id}/undo-relocation`.
      required: [splitDate]
      properties:
        splitDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: The boundary date between the two segments to merge - some segment's `checkOut` equal to the next segment's `checkIn`.

    BookingScheduleQuote:
      type: object
      description: >
        Response of `POST /bookings/{id}/schedule/quote` - a non-mutating preview of what
        `PATCH /bookings/{id}/schedule` would do with the same request body - and of
        `POST /bookings/{id}/relocate/quote`, reused as-is rather than duplicated: there,
        `totalPrice` is the whole booking's new total after the relocation and `nights` describes
        the new segment being created. `totalPrice` is always computed (pure arithmetic over
        `RatePlan`/`Room.basePrice` for the requested dates, independent of availability);
        `available`/`reason` report whether applying this exact change would currently succeed.
        This is advisory, not a lock - the apply call re-validates from scratch inside its own
        `Serializable` transaction, so a `true` here can still lose a race to a concurrent change
        made between preview and apply.
      required: [totalPrice, nights, available, reason]
      properties:
        totalPrice:
          type: string
          description: Decimal(10,2) rendered as a string, recomputed for the requested `checkIn`/`checkOut`.
        nights:
          type: integer
        available:
          type: boolean
        reason:
          type: string
          nullable: true
          description: Set when `available` is `false` - the same wording `PATCH /bookings/{id}/schedule` would reject with.

    RepriceInput:
      type: object
      description: Body of `POST /bookings/{id}/reprice` and `POST /bookings/{id}/reprice/quote`.
      required: [segmentId]
      properties:
        segmentId:
          type: string
          description: Which segment to reprice - required rather than inferred, since a relocated booking has more than one and there is no single unambiguous default.

    SwapSegmentRoomUnitInput:
      type: object
      description: >
        Body of `POST /bookings/{id}/segments/{segmentId}/swap-room-unit`. The dragged segment
        is named by the URL (`{id}`/`{segmentId}`); this names the other side - the gesture has a
        direction (someone drags A onto B), so the operation does too.
      required: [withSegmentId]
      properties:
        withSegmentId:
          type: string
          description: The other segment to swap room units with. Must currently be assigned a room unit of the same room type as the URL's own segment.

    RepriceQuote:
      type: object
      description: >
        Response of `POST /bookings/{id}/reprice/quote` - a non-mutating preview of what
        `POST /bookings/{id}/reprice` would do. Only nights from today onward within the segment
        are ever repriced - a night the guest has already stayed keeps whatever price was agreed
        for it, even when this is invoked mid-stay. `nightsRepriced` is `0` (and the totals are
        equal) when the segment has no nights left to reprice (it's entirely in the past).
      required: [oldTotalPrice, newTotalPrice, nightsRepriced]
      properties:
        oldTotalPrice:
          type: string
          description: The segment's current total, decimal(10,2) as a string.
        newTotalPrice:
          type: string
          description: What the segment's total would become at today's rates, decimal(10,2) as a string.
        nightsRepriced:
          type: integer
          description: How many nights (today onward) this would touch.

    RoomTypeDailyAvailability:
      type: object
      description: >
        One day's remaining-unit count for a room type, from the same server-side formula as
        `AvailabilityDay.availableCount` (`activeUnitCount - blockedUnits - bookedUnits` for that
        day) - deliberately **not** clamped at zero. A negative value is a real signal (e.g. more
        bookings/blocks than currently-active units, after a unit was deactivated), not noise -
        clients must render it distinctly, not hide or floor it.
      required: [date, availableCount]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        availableCount:
          type: integer

    RoomTypeCalendar:
      type: object
      description: One room type's rows on the booking calendar grid - its physical units, and its per-day remaining-availability count.
      required: [roomId, roomName, roomUnits, dailyAvailable]
      properties:
        roomId:
          type: string
        roomName:
          type: string
        roomUnits:
          type: array
          items:
            $ref: "#/components/schemas/RoomUnit"
        dailyAvailable:
          type: array
          items:
            $ref: "#/components/schemas/RoomTypeDailyAvailability"

    CalendarBooking:
      type: object
      description: >
        One booking *segment* as rendered on the booking calendar grid - a lighter projection
        than `BookingSegment` (no nested `room`/`roomUnit`; cross-reference against
        `BookingCalendarResponse.roomTypes` instead), returned only for non-`CANCELLED`
        bookings. `segmentId` is the *segment's* id, not the booking's - a relocated booking
        produces more than one `CalendarBooking` entry, sharing the same `bookingId`, rendered as
        separate bars (different rows and/or date ranges) that all open the same booking's card
        on click. Any call that needs to act on the booking itself (open the card panel, quote or
        apply a schedule change, relocate) must use `bookingId`, never `segmentId` - the field is
        named for exactly what it identifies specifically because a same-named-but-different-
        meaning `id` here once caused every drag-to-edit handler to send the wrong id and get a
        silent 404. `roomUnitId: null` means this segment occupies a unit of its room type but has
        no specific physical room assigned yet - the grid renders it in an unassigned row for
        that type. `checkIn`/`checkOut` are plain date-only strings (`YYYY-MM-DD`), the same
        format `Booking.checkIn`/`checkOut` now use too.
      required: [segmentId, bookingId, roomId, roomUnitId, guestName, checkIn, checkOut, status, totalPrice, segmentCount]
      properties:
        segmentId:
          type: string
          description: This segment's own id (`BookingSegment.id`). Not the booking's id - use `bookingId` for anything that acts on the booking.
        bookingId:
          type: string
          description: Groups segments belonging to the same booking, and is what the card panel opens by, and what every schedule/relocate call must be addressed to.
        roomId:
          type: string
        roomUnitId:
          type: string
          nullable: true
        guestName:
          type: string
        checkIn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        checkOut:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        status:
          $ref: "#/components/schemas/BookingStatus"
        totalPrice:
          type: string
          description: Decimal(10,2) rendered as a string - this segment's own price, not the whole booking's total.
        segmentCount:
          type: integer
          description: How many segments the parent booking has in total - `1` for the overwhelmingly common never-relocated case. The grid uses this to decide whether drag-resize/drag-move is offered on this bar at all (see `PATCH /bookings/{id}/schedule`'s description) without a second round trip to fetch the full booking.
        overstayUntil:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: >
            Set only on the last segment of a guest still `CHECKED_IN` past `checkOut` (see
            `OverstayRule`): the exclusive end of the nights they are actually occupying beyond the
            agreed stay - tomorrow, so tonight is covered. Not an agreed date and never priced;
            availability counts the room as taken through it, so it can't be sold over the guest.
            Absent for every other segment.

    BookingCalendarResponse:
      type: object
      description: >
        Everything the booking calendar grid needs for one `[from, to)` date range in a single
        request: room types with their physical units and per-day availability counts, every
        overlapping non-cancelled booking, and every overlapping `RoomUnitBlock` (returned raw -
        overlapping blocks on the same unit are not merged or deduplicated server-side, same as
        `GET /room-units/{id}/blocks`; rendering the overlap is a client concern).
      required: [from, to, roomTypes, bookings, blocks]
      properties:
        from:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        to:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        roomTypes:
          type: array
          items:
            $ref: "#/components/schemas/RoomTypeCalendar"
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/CalendarBooking"
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/RoomUnitBlock"

    BookingSegment:
      type: object
      description: >
        One "room X from date A to date B" leg of a booking's stay. A booking's segments always
        cover `[Booking.checkIn, Booking.checkOut)` with no gap and no overlap - a booking that
        has never been relocated has exactly one segment identical to the booking's own
        roomId/roomUnitId/checkIn/checkOut/totalPrice; that is the common case, not a special
        one. See `POST /bookings/{id}/relocate`'s description for how a second segment appears.
        `checkIn`/`checkOut` are plain date-only strings (`YYYY-MM-DD`), the same format
        `Booking.checkIn`/`checkOut` now use too.
      required: [id, roomId, room, roomUnitId, roomUnit, checkIn, checkOut, totalPrice]
      properties:
        id:
          type: string
        roomId:
          type: string
        room:
          $ref: "#/components/schemas/Room"
        roomUnitId:
          type: string
          nullable: true
        roomUnit:
          $ref: "#/components/schemas/RoomUnit"
          nullable: true
        checkIn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        checkOut:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        totalPrice:
          type: string
          description: Decimal(10,2) rendered as a string - this segment's own share of the booking's total, server-computed from `Room.basePrice`/`RatePlan` for its own dates/room.

    Booking:
      type: object
      description: >
        Raw Prisma `Booking` row with `room` included. `totalPrice` serializes as a **string**
        (Prisma `Decimal`). `createdAt`/`updatedAt` are ISO-8601 datetime strings (real
        timestamps, not calendar days). `checkIn`/`checkOut` are plain `YYYY-MM-DD` dates,
        the same convention as `BookingSegment`/`CalendarBooking`/every other schema below that
        names a stay date - they used to serialize as a datetime with a legacy
        `T00:00:00.000Z` time component (a Prisma `Date`-object artifact), which caused three
        separate incidents (a dashboard revenue bug, and two near-misses while building the
        booking calendar) before the format was unified here. `roomUnitId`/`roomUnit` are null
        until a physical room is assigned via `PUT /bookings/{id}/room-unit`, or after a
        relocation that didn't name a specific unit for the new leg.


        `guestName`/`guestEmail`/`guestPhone` are a frozen snapshot of what was given when the
        booking was made (same "agreed terms are frozen" convention as
        `BookingSegmentNightlyRate`, `OrderItem.unitPrice`, `Order.openedByEmail`) - they never
        change when `guest`/`guestId` is set or changed, and a booking that has never been linked
        to a `Guest` reads and behaves identically to one that has (see `PUT /bookings/{id}/guest`
        and the `Guest` schema for why the two are deliberately independent). `guestId`/`guest`
        are null until reception links one - most bookings, most of the time, especially a
        booking still fresh off the public site (that flow never touches this link at all).


        `roomId`/`room`/`roomUnitId`/`roomUnit`/`checkIn`/`checkOut`/`totalPrice` are all
        derived from `segments` (the *last* segment's room, for roomId/roomUnitId/room/roomUnit;
        the first segment's checkIn and the last segment's checkOut; the sum of every segment's
        totalPrice) - they exist so every reader that only cares about "what room is this guest
        in right now" doesn't need to know segments exist at all. `roomId`/`room` are **not**
        "what was originally booked" - `POST /bookings/{id}/relocate` can move a booking to a
        different room *type* mid-stay (an upgrade, downgrade, or a move off a broken room, all
        ordinary front-desk operations), and once that happens these fields track the guest's
        current/most recent room, not their first one. Anything that needs the room at a
        specific point in the stay - a report broken out by leg, an original-type audit trail -
        must read `segments` directly; nothing else on this object preserves that history. A
        booking that has never been relocated has exactly one segment and these values equal
        that segment's own fields exactly - segments are not a special case that only shows up
        for split bookings.
      required:
        - id
        - roomId
        - room
        - roomUnitId
        - roomUnit
        - guestName
        - guestEmail
        - guestPhone
        - guestId
        - guest
        - checkIn
        - checkOut
        - totalPrice
        - status
        - channel
        - purpose
        - adults
        - children
        - paymentNote
        - segments
        - occupancyStatus
        - checkedInAt
        - checkedOutAt
        - externalReference
        - externalChannel
        - cancellationReason
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        roomId:
          type: string
        room:
          $ref: "#/components/schemas/Room"
        roomUnitId:
          type: string
          nullable: true
        roomUnit:
          $ref: "#/components/schemas/RoomUnit"
          nullable: true
        guestName:
          type: string
        guestEmail:
          type: string
          x-sensitive: true
        guestPhone:
          type: string
          x-sensitive: true
        guestId:
          type: string
          nullable: true
          description: >
            Set automatically at creation when `guestEmail` matches exactly one `Guest` card
            (trimmed, case-insensitive) - or, when it matches none, to a card created from this
            booking's own guest fields. Left null when the email is missing or matches several
            cards. Correctable afterwards with `PUT /bookings/{id}/guest`.
        guest:
          $ref: "#/components/schemas/Guest"
          nullable: true
        checkIn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Plain date, same format as `BookingSegment.checkIn`/`CalendarBooking.checkIn` - see this schema's own description.
        checkOut:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Plain date, same format as `BookingSegment.checkOut`/`CalendarBooking.checkOut` - see this schema's own description.
        totalPrice:
          type: string
          description: >
            Decimal(10,2) rendered as a string, e.g. `"4500.00"`. Server-computed from this
            system's rates, never taken from a staff or public request. The one exception is a
            booking imported from SiteMinder (`externalReference` set), whose price is the total
            the guest agreed on the OTA - see `POST /integrations/siteminder/reservations`.
        status:
          $ref: "#/components/schemas/BookingStatus"
        channel:
          $ref: "#/components/schemas/BookingChannel"
        purpose:
          $ref: "#/components/schemas/BookingPurpose"
        adults:
          type: integer
          description: >
            Adults in the party, at least 1. Bookings made before this field existed read 1 - an
            assumed default, not a recorded count.
        children:
          type: integer
          description: Children in the party. Bookings made before this field existed read 0.
        paymentNote:
          type: string
          nullable: true
          x-sensitive: true
        occupancyStatus:
          $ref: "#/components/schemas/OccupancyStatus"
        checkedInAt:
          type: string
          format: date-time
          nullable: true
        checkedOutAt:
          type: string
          format: date-time
          nullable: true
        externalReference:
          type: string
          nullable: true
          description: SiteMinder's booking reference for a booking imported from SiteMinder; null for every other booking.
        externalChannel:
          type: string
          nullable: true
          description: >
            For a SiteMinder import, the channel name exactly as SiteMinder showed it - what `channel`
            was mapped from, and the only record of which OTA an `OTHER` booking came through. Null
            for every other booking.
        cancellationReason:
          type: string
          nullable: true
          description: >
            The reason staff gave when this booking was cancelled (`BookingStatusInput.cancellationReason`).
            Set only while `status` is `CANCELLED`, and only for the current cancellation: cleared if
            the booking is moved out of `CANCELLED`. Null for a cancellation without a reason (the
            SiteMinder import, the unconfirmed-booking expiry sweep) and for cancellations made before
            this field existed - their reason, if any, is only in the audit log.
        segments:
          type: array
          minItems: 1
          description: The booking's stay broken into room legs, ordered by `checkIn` ascending. See `BookingSegment`'s description.
          items:
            $ref: "#/components/schemas/BookingSegment"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BookingCreateInput:
      type: object
      description: Body of `bookingCreateSchema`.
      required: [roomId, guestName, guestEmail, guestPhone, checkIn, checkOut, adults]
      properties:
        roomId:
          type: string
          minLength: 1
        guestName:
          type: string
          minLength: 2
          maxLength: 120
        guestEmail:
          type: string
          format: email
          x-sensitive: true
        guestPhone:
          type: string
          minLength: 5
          maxLength: 40
          x-sensitive: true
        checkIn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        checkOut:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        adults:
          type: integer
          minimum: 1
          description: Number of adults in the party - at least one. The guest knows their own party size, so unlike `channel`/`purpose` this is collected on the public form too.
        children:
          type: integer
          minimum: 0
          default: 0
          description: Number of children in the party. Optional, defaults to 0.
      # Cross-field rule enforced by Zod .refine(), not expressible in JSON Schema:
      # checkIn must be strictly before checkOut.

    BookingStatusInput:
      type: object
      description: Body of `bookingStatusSchema`.
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/BookingStatus"
        paymentNote:
          type: string
          maxLength: 500
          nullable: true
          x-sensitive: true
        channel:
          $ref: "#/components/schemas/BookingChannel"
          description: >
            Optional. Omitted leaves the booking's channel as it is; present sets it. Not nullable -
            a booking always has a channel, so there is no "clear" case (unlike `paymentNote`).
        purpose:
          $ref: "#/components/schemas/BookingPurpose"
          description: Optional. Omitted leaves the booking's purpose as it is; present sets it. Not nullable.
        adults:
          type: integer
          minimum: 1
          description: Optional. Omitted leaves the adult count as it is; present sets it. Not nullable.
        children:
          type: integer
          minimum: 0
          description: Optional. Omitted leaves the child count as it is; present sets it. Not nullable.
        cancellationReason:
          type: string
          maxLength: 500
          nullable: true
          description: >
            Why the booking is being cancelled. Read only when this request moves the booking into
            `CANCELLED` (ignored otherwise); stored as `Booking.cancellationReason` and repeated in
            that status change's audit entry. Optional at the API so system paths (the SiteMinder import,
            the expiry sweep) keep working; the admin screens require it before they send a cancel.

    Guest:
      type: object
      description: >
        Contact details only - name, email, phone, staff notes, and the stay history that falls
        out of `Booking.guestId` (see `GuestDetail`). No documents, no nationality, no passport;
        adding any of those later is a purely additive migration (new nullable columns on this
        same row), nothing here would need to change. `email`/`phone`/`notes` are free text a
        staff member typed and are marked `x-sensitive` for the same reason
        `Booking.guestEmail`/`guestPhone`/`paymentNote` already are - `notes` in particular is
        exactly the kind of field that ends up carrying incidental PII ("allergic to shellfish",
        a complaint from a past stay), and this project already treats free-text staff
        commentary as sensitive by default. `name` stays unmarked, matching
        `Booking.guestName`'s own precedent - see `ToStringRedactsGuestPiiTests`, which only
        ever asserted on email/phone/paymentNote, never a name.

        Deliberately carries no computed/aggregated field (no stay count, no lifetime total, no
        cached last-stay date) - every fact about a guest is reachable by walking to `Booking` via
        `guestId`, never stored here independently. This is what keeps a future merge (out of
        scope for now - see `PUT /bookings/{id}/guest`) mechanical: repoint every
        `Booking.guestId` from one `Guest` to another and delete the loser, with nothing cached
        anywhere that would need recomputing. The one thing that doesn't merge cleanly even so is
        `notes` itself - two cards for the same person can each accumulate their own free text
        before anyone notices, and reconciling two paragraphs is a job for a person reading both,
        not something a merge operation can do for you.

        `vip`/`dateOfBirth`/`tags` are staff-entered facts about the person, not computed ones -
        the "no computed field" rule above is untouched by them. They live on `Guest`, not only
        on `GuestDetail`, on purpose: every `Booking` that embeds its guest carries them too, so
        the front desk sees a VIP flag without opening the card. `dateOfBirth` is PII on its own
        and `tags` is staff-typed free text exactly like `notes` (a tag can as easily read
        "recovering from surgery" as "honeymoon"), so both are `x-sensitive`.
      required: [id, name, email, phone, notes, vip, dateOfBirth, tags, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true
          x-sensitive: true
        phone:
          type: string
          nullable: true
          x-sensitive: true
        notes:
          type: string
          nullable: true
          x-sensitive: true
        vip:
          type: boolean
        dateOfBirth:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          nullable: true
          x-sensitive: true
        tags:
          type: array
          description: Free-form labels, in the order staff entered them. Empty array, never null, when there are none.
          items:
            type: string
          x-sensitive: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GuestDetail:
      type: object
      description: >
        `GET /guests/{id}` - the full guest card. `bookings` is this guest's entire stay history
        (every booking with this `guestId`, regardless of status - a cancelled stay is still a
        real interaction and hiding it would make the card lie by omission), newest `checkIn`
        first. Deliberately no lifetime-spend or stay-count total here: each booking already
        shows its own `totalPrice`/`status` (the same server-computed figures the booking detail
        page itself shows, not a second computation of them), and a real rolled-up total would
        need to correctly sum room revenue, POS orders, and folio settlements across every
        booking while excluding cancellations - a reporting feature in its own right, with the
        same care the rest of the money logic in this API already gets, not one field bolted onto
        a contact card.

        `account` is the one derived field, and it lives here, not on `Guest` (which `Booking`
        embeds, and which carries no computed fields - see its description): whether this card
        has a linked self-service `GuestAccount`, read live from that table on every call, never
        stored on the card.

        `emailHistory` is the same kind of live read: every automated lifecycle email this guest
        was actually sent (see `LifecycleEmailSettings`), newest first - a row exists only once a
        send succeeded, so this is what went out, not what was scheduled.
      required: [id, name, email, phone, notes, vip, dateOfBirth, tags, createdAt, updatedAt, bookings, account, emailHistory]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true
          x-sensitive: true
        phone:
          type: string
          nullable: true
          x-sensitive: true
        notes:
          type: string
          nullable: true
          x-sensitive: true
        vip:
          type: boolean
        dateOfBirth:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          nullable: true
          x-sensitive: true
        tags:
          type: array
          items:
            type: string
          x-sensitive: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        account:
          $ref: "#/components/schemas/GuestAccountLinkSummary"
          nullable: true
        emailHistory:
          type: array
          items:
            $ref: "#/components/schemas/GuestEmailHistoryEntry"

    GuestEmailHistoryEntry:
      type: object
      description: One automated lifecycle email sent to a guest - see `GuestDetail.emailHistory`.
      required: [type, subject, sentAt, bookingId]
      properties:
        type:
          $ref: "#/components/schemas/LifecycleEmailType"
        subject:
          type: string
        sentAt:
          type: string
          format: date-time
        bookingId:
          type: string
          nullable: true
          description: The stay the email was about. Null for `WIN_BACK`, which isn't about one stay.

    LifecycleEmailType:
      type: string
      description: >
        `PRE_ARRIVAL` - a few days before check-in. `POST_STAY` - a few days after checkout, with a
        review link when one is configured. `WIN_BACK` - a guest who hasn't stayed in a long while.
      enum: [PRE_ARRIVAL, POST_STAY, WIN_BACK]

    LifecycleEmailSettings:
      type: object
      description: >
        Controls the daily sweep that sends automated lifecycle emails. The settings decide
        *whether* and *when* each type is sent; the wording is fixed in the backend.

        Who can receive one: only a guest whose `Guest` card is linked to a `GuestAccount` with a
        verified email that hasn't opted out (`GET /guest-auth/unsubscribe`). A `Guest` card
        without an account never gets one - staff typing a name at the front desk is not the
        guest's consent to automated mail. The email goes to the account's verified address.

        - Pre-arrival: bookings not `CANCELLED` whose `checkIn` is exactly `preArrivalDaysBefore`
          days from today (hotel time), once per booking.
        - Post-stay: bookings not `CANCELLED` and not marked no-show whose `checkOut` was exactly
          `postStayDaysAfter` days ago, once per booking. Without a `postStayReviewUrl` the email
          goes out with no review section.
        - Win-back: a guest whose most recent non-`CANCELLED` booking checked out more than
          `winBackMonthsSinceStay` months ago, and who hasn't had a win-back email within that
          same many months.

        Every type starts disabled. The sweep runs once a day; a day it misses (server down) is
        not caught up, since "exactly N days before" has passed for those bookings.
      required: [preArrivalEnabled, preArrivalDaysBefore, postStayEnabled, postStayDaysAfter, postStayReviewUrl, winBackEnabled, winBackMonthsSinceStay, updatedAt]
      properties:
        preArrivalEnabled:
          type: boolean
        preArrivalDaysBefore:
          type: integer
        postStayEnabled:
          type: boolean
        postStayDaysAfter:
          type: integer
        postStayReviewUrl:
          type: string
          nullable: true
        winBackEnabled:
          type: boolean
        winBackMonthsSinceStay:
          type: integer
        updatedAt:
          type: string
          format: date-time

    LifecycleEmailSettingsUpdateInput:
      type: object
      description: >
        Body of `PUT /settings/lifecycle-emails` - every field, see `LifecycleEmailSettings`.
        `postStayReviewUrl` may be omitted or null for none.
      required: [preArrivalEnabled, preArrivalDaysBefore, postStayEnabled, postStayDaysAfter, winBackEnabled, winBackMonthsSinceStay]
      properties:
        preArrivalEnabled:
          type: boolean
        preArrivalDaysBefore:
          type: integer
          minimum: 0
          maximum: 60
        postStayEnabled:
          type: boolean
        postStayDaysAfter:
          type: integer
          minimum: 0
          maximum: 60
        postStayReviewUrl:
          type: string
          nullable: true
          maxLength: 2000
        winBackEnabled:
          type: boolean
        winBackMonthsSinceStay:
          type: integer
          minimum: 1
          maximum: 120

    VatSettings:
      type: object
      description: >
        The one VAT rate applied to all revenue, room and POS alike, by
        `GET /reports/revenue-statistic`. Stored, not hardcoded, so it can change without a
        deploy; seeded at 7.00 (Thailand's standard rate) as an editable default. All prices in
        this system are VAT-inclusive - see that report for why - so the rate is used to extract
        VAT from a figure, never to add it on top. Nothing else in the system reads it: no price,
        order total or receipt changes when it does.
      required: [vatRate, updatedAt]
      properties:
        vatRate:
          type: string
          description: Percent, two decimals, e.g. "7.00".
        updatedAt:
          type: string
          format: date-time

    VatSettingsUpdateInput:
      type: object
      description: Body of `PUT /settings/vat`.
      required: [vatRate]
      properties:
        vatRate:
          type: number
          minimum: 0
          maximum: 99.99
          description: Percent, at most two decimals. 0 is allowed (VAT not charged).

    GuestAccountLinkSummary:
      type: object
      description: >
        Staff-facing summary of the `GuestAccount` linked to a `Guest` card - presence and
        verification only. Deliberately no id, email, password hash, token version, or
        verification token: staff can see that a guest has an account, never anything that
        would help act as it.
      required: [emailVerified, marketingEmailsOptOut]
      properties:
        emailVerified:
          type: boolean
          description: False while the guest hasn't confirmed their email yet (they can't log in until they do).
        marketingEmailsOptOut:
          type: boolean
          description: True once the guest has unsubscribed from automated lifecycle emails - see `GET /guest-auth/unsubscribe`.

    GuestCreateInput:
      type: object
      description: >
        Body of `POST /guests`. Nothing here is checked against existing guests before creating -
        no automatic merging, see `Guest`'s own description - `GET /guests?q=` is how a caller
        checks for a likely duplicate (by name, email, or phone) *before* submitting this, and is
        expected to be called for exactly that reason; this endpoint itself never blocks on it.

        `vip`/`dateOfBirth`/`tags` are optional here and default to `false`/`null`/`[]`.
        `dateOfBirth` may not be in the future (400). Each tag is trimmed; blank tags and exact
        duplicates are silently dropped, so `["", "vip", "  ", "vip"]` is stored as `["vip"]` -
        the same normalization `GuestUpdateInput` applies.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          nullable: true
          x-sensitive: true
        phone:
          type: string
          nullable: true
          x-sensitive: true
        notes:
          type: string
          nullable: true
          maxLength: 2000
          x-sensitive: true
        vip:
          type: boolean
          default: false
        dateOfBirth:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          nullable: true
          x-sensitive: true
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 50
          x-sensitive: true

    GuestUpdateInput:
      type: object
      description: >
        Body of `PATCH /guests/{id}`. Full replacement of every field below, same convention as
        `TableInput`/`RoomUnitUpdateInput` - no partial update. `vip` and `tags` are required
        (not defaulted, unlike `GuestCreateInput`): a caller that doesn't know about them must get
        a 400, not silently unmark a VIP or wipe their tags. Only `vip`'s requirement is actually
        enforced - the generated model initializes `tags` to an empty list, so an omitted `tags`
        is indistinguishable from `[]` - but that is enough: any caller unaware of these fields
        also omits `vip` and is rejected before its missing `tags` could clear anything.
        `dateOfBirth` follows `email`/`phone`/`notes` - omitted clears it. Same
        `dateOfBirth`/`tags` rules as `GuestCreateInput`.
      required: [name, vip, tags]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          nullable: true
          x-sensitive: true
        phone:
          type: string
          nullable: true
          x-sensitive: true
        notes:
          type: string
          nullable: true
          maxLength: 2000
          x-sensitive: true
        vip:
          type: boolean
        dateOfBirth:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          nullable: true
          x-sensitive: true
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 50
          x-sensitive: true

    BookingGuestLinkInput:
      type: object
      description: >
        Body of `PUT /bookings/{id}/guest`. `guestId` must be present in the payload (either a
        string or explicit `null`, which clears the link) - deliberately NOT listed under
        `required` below despite that, same reasoning as `RoomUnitAssignmentInput.roomUnitId`: a
        generated `@NotNull` on a `nullable: true` + `required` property would validate the
        *unwrapped* value, rejecting the exact `null` this field exists to accept. Presence is
        checked manually in `BookingService`. Relinking to a different guest needs no
        confirmation and no state check - see `PUT /bookings/{id}/guest` for what the link
        decides (including which guest account lists the booking).
      properties:
        guestId:
          type: string
          nullable: true

    User:
      type: object
      description: Safe projection returned by the API — `passwordHash` is never included.
      required: [id, name, role, active, functions, overtimeEligible, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
          description: >
            The person's name - always present, unlike `email`. This is the only durable
            identifier for a `POST /users` account created without login credentials (see
            `UserCreateInput`), so it exists independently of whether the account can authenticate.
            Renamable via `PATCH /users/{id}/name`, and a rename is retroactive: nothing freezes
            a copy of it, so punch logs, the roster grid and every other screen that shows a
            person's name reads this field live and relabels past records too. The one exception
            is audit log `summary` text, which is a sentence written at the time of the action.
        fullName:
          type: string
          nullable: true
          description: >
            The person's full legal name, for admin reference only - optional, and separate from
            `name`, which stays the short display name every other screen (POS headers, punch
            logs, audit entries) shows. Nothing else in this API reads it. Absent until set,
            either at creation (see `UserCreateInput`) or later via `PATCH /users/{id}/full-name`.
        email:
          type: string
          description: >
            Absent for an account created without login credentials - see `UserCreateInput`. Such
            an account can be given credentials later via `PATCH /users/{id}/credentials` without
            being recreated.
        role:
          $ref: "#/components/schemas/Role"
        active:
          type: boolean
          description: >
            Whether this account can currently authenticate. A disabled account's already-issued
            tokens are rejected on their very next request regardless of remaining validity -
            see `PATCH /users/{id}/active`.
        functions:
          type: array
          items:
            $ref: "#/components/schemas/JobFunction"
          description: >
            This user's job functions (see `JobFunction`) - zero or more, independent of `role`.
            Set via `PATCH /users/{id}/functions`. Does not affect authentication - unlike a role
            change, changing this does not invalidate existing tokens (see that operation's own
            description for why).
        overtimeEligible:
          type: boolean
          description: >
            Whether this person is eligible for overtime - a fact about the person, not something
            derived from their current shift code: the hotel's own rule ("everyone is eligible
            except staff on the `OP` code, plus one individual exception on an ordinary code") has
            an exception that doesn't correlate with any code group, so it can't be computed on
            the fly. Defaults to `true` at creation (see `UserCreateInput`) and is set per person
            via `PATCH /users/{id}/overtime-eligibility` - nothing in this API computes or accrues
            overtime pay from this flag today; it only records the fact so it doesn't have to be
            reconstructed later.
        enrollmentNumber:
          type: integer
          description: >
            The fingerprint terminal's own numeric PIN for this person, not this system's id - a
            device attendance punch is attributed by this number alone (see `AttendanceDevice`),
            so without one, nothing that terminal reports can ever be linked to this person.
            Absent for staff who never punch a terminal. Unique when set - two people can't share
            one number - and settable at creation (see `UserCreateInput`) or later via
            `PATCH /users/{id}/enrollment-number`.
        staffArea:
          allOf:
            - $ref: "#/components/schemas/StaffArea"
          nullable: true
          description: >
            What department this person belongs to - a fact about the person, independent of
            whether they have a full `EmployeePattern` (which also needs `workDaysPerWeek`/
            `weeklyDayOff`, neither of which one month of attendance reliably establishes). Absent
            until set, either at creation (see `UserCreateInput`) or later via
            `PATCH /users/{id}/staff-area`. `GET /roster` groups by this field, so an account
            without one sits in "no area set" and can never be counted toward a coverage minimum.
        createdAt:
          type: string
          format: date-time

    UserUpdateResult:
      type: object
      description: >
        Response of `PATCH /users/{id}/active` and `PATCH /users/{id}/functions`. `warning` is
        set (the change still succeeds) when the user being disabled, or having `THERAPIST`
        removed, holds one or more future `BOOKED` spa appointments - warn, don't block, same
        shape as `CheckInResult`/`RoomUnitBlockResult`; nothing here cancels those appointments
        automatically.
      required: [user, warning]
      properties:
        user:
          $ref: "#/components/schemas/User"
        warning:
          type: string
          nullable: true

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: "JWT to send as `Authorization: Bearer <token>` on subsequent requests."
        user:
          $ref: "#/components/schemas/User"

    GuestAccountRegisterInput:
      type: object
      description: Body of `POST /guest-auth/register`.
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          x-sensitive: true
        password:
          type: string
          minLength: 8
          maxLength: 200
        name:
          type: string
          nullable: true
          description: Optional - purely a display name, never used to look up or merge anything.

    GuestAccountVerifyInput:
      type: object
      description: Body of `POST /guest-auth/verify`.
      required: [token]
      properties:
        token:
          type: string

    GuestAccountResendVerificationInput:
      type: object
      description: Body of `POST /guest-auth/resend-verification`.
      required: [email]
      properties:
        email:
          type: string
          format: email
          x-sensitive: true

    GuestAccountForgotPasswordInput:
      type: object
      description: Body of `POST /guest-auth/forgot-password`.
      required: [email]
      properties:
        email:
          type: string
          format: email
          x-sensitive: true

    GuestAccountResetPasswordInput:
      type: object
      description: Body of `POST /guest-auth/reset-password`.
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 1
          x-sensitive: true
        newPassword:
          type: string
          minLength: 8
          maxLength: 200
          x-sensitive: true

    GuestAccountLoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    GuestAccountAuthResponse:
      type: object
      required: [token, account]
      properties:
        token:
          type: string
          description: "JWT to send as `Authorization: Bearer <token>` on subsequent GuestAccount-tagged requests."
        account:
          $ref: "#/components/schemas/GuestAccount"

    GuestAccountMessage:
      type: object
      description: >
        Generic success shape shared by `GuestAccountAuth` operations that deliberately reveal
        nothing about the target email's actual state (registered/verified/pending) - see
        `POST /guest-auth/register`'s own description.
      required: [message]
      properties:
        message:
          type: string

    GuestAccount:
      type: object
      description: >
        A guest's own persistent, self-service login - a separate identity from the CRM `Guest`
        schema, with its own credentials (see the `GuestAccountAuth` tag's own description for
        why), linked to the `Guest` card with the same email when exactly one exists (see
        `GuestDetail.account`). Usable only once `emailVerifiedAt` is set.
      required: [id, email, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
          x-sensitive: true
        name:
          type: string
          nullable: true
        emailVerifiedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    GuestBookingView:
      type: object
      description: >
        The guest-facing projection of `Booking` returned by `GET /guest/bookings` - deliberately
        not `Booking` itself, the same "narrow, guest-facing DTO" discipline as `GuestOrderView`.
        Never carries `paymentNote`, `source`, `expiryReminderSent`, `guestId`/`guest`,
        `roomUnitId`/`roomUnit`, or occupancy timestamps - none of that is this guest's business
        or safe to hand back to their own phone. `occupancyStatus` is the one exception - exposed
        specifically so the frontend can show "order room service" only on a `CHECKED_IN` booking;
        this is a UI convenience only, never the actual gate (every `GuestOrder` write re-checks
        `Booking.occupancyStatus` itself - see that tag's own description).
      required: [id, roomName, roomLabel, checkIn, checkOut, totalPrice, status, occupancyStatus, createdAt]
      properties:
        id:
          type: string
        roomName:
          type: string
          description: "`Room.name` (the room *type*) at read time - denormalized, not frozen (same convention as `SpaAppointmentTreatment.currentPrice`), since a room type's name is cosmetic, not an agreed term."
        roomLabel:
          type: string
          nullable: true
          description: >
            The assigned physical room's own `RoomUnit.label` (e.g. `"204"`) at read time, same
            denormalized-not-frozen convention as `roomName` - distinct from it, since `roomName`
            is the room *type*. `null` if this booking has no room unit assigned yet.
        checkIn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        checkOut:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        totalPrice:
          type: string
          description: Decimal(10,2) rendered as a string, e.g. `"4500.00"` - same server-computed total as `Booking.totalPrice`.
        status:
          $ref: "#/components/schemas/BookingStatus"
        occupancyStatus:
          $ref: "#/components/schemas/OccupancyStatus"
        createdAt:
          type: string
          format: date-time

    GuestPasswordChangeInput:
      type: object
      description: Body of `PATCH /guest/password`.
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          description: Verified against the caller's own `GuestAccount.passwordHash` before the change is accepted.
        newPassword:
          type: string
          minLength: 8
          maxLength: 200

    UserCreateInput:
      type: object
      description: >
        Body of `userCreateSchema`. `email`/`password` are optional together - send both to
        create a login-capable account, or neither to create one that cannot authenticate at all
        (for staff who exist so the roster/attendance/pay-rate records have someone to point at,
        but never sign in - a cook or a housekeeper, say). Sending exactly one of the two is a 400
        (`UserService` validates the pairing manually - see its own comment for why this can't be
        expressed as `required` in this schema). `name` is required either way.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        fullName:
          type: string
          nullable: true
          maxLength: 200
          description: See `User`'s own description. Omit (or send blank) to leave unset; set later via `PATCH /users/{id}/full-name`.
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 200
          description: Hashed with bcrypt (cost 10) before storage; never stored or returned in plaintext.
        role:
          $ref: "#/components/schemas/Role"
          default: MANAGER
        overtimeEligible:
          type: boolean
          default: true
          description: See `User`'s own description. Defaults to `true` - the known exceptions are set individually, at creation or later via `PATCH /users/{id}/overtime-eligibility`.
        enrollmentNumber:
          type: integer
          description: See `User`'s own description. Omit for staff who don't punch a terminal; set later via `PATCH /users/{id}/enrollment-number` once known.
        staffArea:
          $ref: "#/components/schemas/StaffArea"
          description: See `User`'s own description. Omit to leave unset; set later via `PATCH /users/{id}/staff-area` once known.

    UserRoleUpdateInput:
      type: object
      description: Body of `userRoleUpdateSchema`.
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"

    UserFunctionsUpdateInput:
      type: object
      description: >
        Body of `PATCH /users/{id}/functions`. Replaces the full set of job functions - send
        every function this user should have, not just the one being added or removed. An empty
        array clears every function.
      required: [functions]
      properties:
        functions:
          type: array
          items:
            $ref: "#/components/schemas/JobFunction"

    ChangePasswordInput:
      type: object
      description: Body of `PATCH /auth/password`.
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          description: Verified against the caller's own `passwordHash` before the change is accepted.
        newPassword:
          type: string
          minLength: 8
          maxLength: 200

    ResetPasswordInput:
      type: object
      description: Body of `PATCH /users/{id}/password` - an administrative reset, no current password required.
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 8
          maxLength: 200

    UserActiveUpdateInput:
      type: object
      description: Body of `PATCH /users/{id}/active`.
      required: [active]
      properties:
        active:
          type: boolean

    UserOvertimeEligibilityUpdateInput:
      type: object
      description: Body of `PATCH /users/{id}/overtime-eligibility`. See `User.overtimeEligible`'s own description.
      required: [overtimeEligible]
      properties:
        overtimeEligible:
          type: boolean

    UserNameUpdateInput:
      type: object
      description: >
        Body of `PATCH /users/{id}/name`. See `User.name`'s own description. Unlike
        `UserFullNameUpdateInput`, `name` is a plain required string - it cannot be cleared, so
        there is no null case. The service also trims it and rejects a blank result, so a
        whitespace-only value that passes `minLength` is still a 400.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    UserFullNameUpdateInput:
      type: object
      description: >
        Body of `PATCH /users/{id}/full-name`. See `User.fullName`'s own description. `fullName`
        is deliberately not in `required` - same nullable-plus-required `@NotNull` trap as
        `UserEnrollmentNumberUpdateInput`; the service validates its presence manually.
      properties:
        fullName:
          type: string
          nullable: true
          maxLength: 200
          description: Send a string to assign it, or explicit `null` (or blank) to clear it - omitting the field entirely is rejected.

    UserEnrollmentNumberUpdateInput:
      type: object
      description: >
        Body of `PATCH /users/{id}/enrollment-number`. See `User.enrollmentNumber`'s own
        description. `enrollmentNumber` itself is deliberately not in `required` here even though
        the field is always expected - marking a nullable field both `required` and `nullable`
        generates a `@NotNull` that would reject the very null this endpoint exists to send (see
        CLAUDE.md's Code generation section); the service validates its presence manually instead,
        the same way `PUT /bookings/{id}/guest` does for its own nullable `guestId`.
      properties:
        enrollmentNumber:
          type: integer
          nullable: true
          description: Send a number to assign it, or explicit `null` to clear it - omitting the field entirely is rejected.

    UserStaffAreaUpdateInput:
      type: object
      description: >
        Body of `PATCH /users/{id}/staff-area`. Same nullable-but-required-presence shape as
        `UserEnrollmentNumberUpdateInput`, for the same reason (see CLAUDE.md's Code generation
        section) - `staffArea` is deliberately not in `required` even though it's always expected,
        so the service validates its presence manually instead of generating a `@NotNull` that
        would reject the very null this endpoint exists to send.
      properties:
        staffArea:
          allOf:
            - $ref: "#/components/schemas/StaffArea"
          nullable: true
          description: Send an area to assign it, or explicit `null` to clear it - omitting the field entirely is rejected.

    UserCredentialsInput:
      type: object
      description: >
        Body of `PATCH /users/{id}/credentials` - turns a no-login account (see `UserCreateInput`)
        into one that can authenticate. Both fields are required: unlike `PATCH /users/{id}/password`,
        there is no existing password to reset, and unlike a plain email change, this account has
        no email to begin with. Only valid while the target account has no email yet - see that
        operation's own description for why changing an *existing* login email is deliberately not
        this endpoint's job.
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 200
          description: Hashed with bcrypt (cost 10) before storage; never stored or returned in plaintext.

    PriceRangeInput:
      type: object
      description: Body of `priceRangeSchema`. Upserts one `RatePlan` row per day in `[from, to]`.
      required: [from, to, price]
      properties:
        from:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        to:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Coerced to a number server-side (`z.coerce.number()`); a numeric string is also accepted.
      # Cross-field rule enforced by Zod .refine(): from <= to.

    PricingDay:
      type: object
      required: [date, price, isOverride]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        price:
          type: number
          description: Explicitly converted with `Number(...)` server-side — a real JSON number, unlike `Room.basePrice`.
        isOverride:
          type: boolean
          description: 'True if this day has an explicit `RatePlan` row; false if it fell back to `Room.basePrice`.'

    PricingResponse:
      type: object
      required: [basePrice, days]
      properties:
        basePrice:
          type: number
          description: 'Room.basePrice explicitly converted with `Number(...)`.'
        days:
          type: array
          items:
            $ref: "#/components/schemas/PricingDay"

    RoomUnitAvailability:
      type: object
      description: Per-day status of one physical room - the data the booking calendar grid renders per cell.
      required: [roomUnitId, label, isBlocked, isBooked, isAvailable, bookingId, blockReason]
      properties:
        roomUnitId:
          type: string
        label:
          type: string
        isBlocked:
          type: boolean
          description: True if a `RoomUnitBlock` covers this day.
        isBooked:
          type: boolean
          description: True if a non-CANCELLED booking has this unit assigned and covers this day.
        isAvailable:
          type: boolean
          description: '`!isBlocked && !isBooked`.'
        bookingId:
          type: string
          nullable: true
          description: Set when `isBooked` is true.
        blockReason:
          type: string
          nullable: true
          description: Set when `isBlocked` is true (`RoomUnitBlock.reason`).

    AvailabilityDay:
      type: object
      description: >
        Per-day inventory breakdown for staff, at both the room-type level (`unitCount`,
        `blockedCount`, `bookedCount`, `availableCount`) and the physical-room level (`units[]`).
        `availableCount` is the derived remainder (`unitCount - blockedCount - bookedCount`) and
        can go negative - that's not clamped away, since a negative remainder (e.g. after room
        units are deactivated) is exactly the thing staff need to see, not hide. `blockedCount`
        counts *distinct* blocked active units for the day (an overlapping second block on the
        same unit doesn't double-count); `bookedCount` counts bookings covering the day
        regardless of whether they have an assigned unit - an unassigned booking still occupies
        one unit of the type.
      required: [date, unitCount, blockedCount, bookedCount, availableCount, units]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        unitCount:
          type: integer
          description: Number of active `RoomUnit`s of this type at query time.
        blockedCount:
          type: integer
          description: Distinct active units with a `RoomUnitBlock` covering this day.
        bookedCount:
          type: integer
          description: Units covered by a non-CANCELLED booking for this day (assigned or not).
        availableCount:
          type: integer
          description: 'unitCount - blockedCount - bookedCount. Not clamped at 0.'
        units:
          type: array
          items:
            $ref: "#/components/schemas/RoomUnitAvailability"
          description: One entry per active `RoomUnit` of this type.

    AvailabilityResponse:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilityDay"

    PublicAvailabilityDay:
      type: object
      description: >
        Like `AvailabilityDay` but collapsed to a yes/no signal - guests get
        neither the block/booking split nor the exact remaining count
        (revealing occupancy load to competitors), just whether at least one
        unit is still sellable.
      required: [date, isBlocked]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        isBlocked:
          type: boolean
          description: 'True when availableCount <= 0 for this day.'

    PublicAvailabilityResponse:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/PublicAvailabilityDay"

    MenuItem:
      type: object
      required: [id, name, description, category, department, price, isAvailable, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        department:
          $ref: "#/components/schemas/MenuDepartment"
        price:
          type: string
          description: Decimal(10,2) rendered as a string, e.g. `"250.00"` — same convention as `Room.basePrice`.
        isAvailable:
          type: boolean
        durationMinutes:
          type: integer
          nullable: true
          minimum: 1
          description: >
            Minutes a scheduled treatment takes - null for every ordinary food/drink item.
            Copied onto `SpaAppointment.durationMinutes` at the moment an appointment is
            created, not read live afterward - the same "agreed terms are frozen" precedent as
            `BookingSegmentNightlyRate`, so editing this later never reflows an appointment
            already on the grid. Not listed under `required`: the codegen's `JsonNullable<T>`
            unwrapping makes a generated `@NotNull` on a `nullable: true` + `required` property
            reject the very null most rows need - see `RoomUnitPositionInput`'s own comment.
        createdAt:
          type: string
          format: date-time

    MenuItemInput:
      type: object
      description: >
        Full replacement on PATCH — no partial update (same convention as `RoomInput`).
        `department` defaults to `KITCHEN` (most menu items are food) - existing rows migrated
        the same way; staff reassign drinks to `BAR` explicitly, or a treatment to `SPA`.
      required: [name, category, price]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          maxLength: 2000
          description: Optional - the POS never shows it. Omitted or blank is stored as an empty string, so `MenuItem.description` is always a string.
        category:
          type: string
          minLength: 1
          maxLength: 60
          description: >
            Trimmed, with inner runs of whitespace collapsed to one space. Must not differ only in
            letter case or spacing from a category already in use (400 on `category`, naming the
            existing spelling) - "cocktails" next to "Cocktails" would otherwise become a second
            menu tab. The exact existing spelling is always accepted.
        department:
          $ref: "#/components/schemas/MenuDepartment"
          default: KITCHEN
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
        isAvailable:
          type: boolean
          default: true
        durationMinutes:
          type: integer
          nullable: true
          minimum: 1
          description: Set only for a `SPA`-department item - see `MenuItem.durationMinutes`.

    Table:
      type: object
      description: >
        A physical POS table/spot a guest tab can be opened against. Mapped to a
        `PosTable` database table (not `Table`) to sidestep the SQL keyword collision — the
        API schema name is unaffected.
      required: [id, zone, label, capacity, shape, isActive]
      properties:
        id:
          type: string
        zone:
          $ref: "#/components/schemas/Zone"
        label:
          type: string
        capacity:
          type: integer
        shape:
          $ref: "#/components/schemas/TableShape"
        isActive:
          type: boolean
        positionX:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: >
            Normalized (0..1) horizontal position on a floor-plan image, set via
            `PATCH /tables/positions` - same convention as `RoomUnit.positionX`. Null (always
            paired with a null `positionY`) means this table hasn't been placed yet. Which floor
            plan it is a position on follows from `zone`: a SPA-zone table is placed on the spa
            map (`GET /spa-map`), every other zone on the restaurant map (`GET /restaurant-map`).
            One table is only ever on one of the two, so one pair of columns serves both. Not tied
            to the front desk's property map, which only places `RoomUnit`s.
        positionY:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: Normalized (0..1) vertical position - see `positionX`.

    TableInput:
      type: object
      description: Full replacement on PATCH — no partial update.
      required: [zone, label, capacity]
      properties:
        zone:
          $ref: "#/components/schemas/Zone"
        label:
          type: string
          minLength: 1
          maxLength: 60
        capacity:
          type: integer
          minimum: 1
          maximum: 50
        shape:
          $ref: "#/components/schemas/TableShape"
          description: Omitted means `ROUND` (full replacement, like every other field here).
        isActive:
          type: boolean
          default: true

    TablePositionInput:
      type: object
      description: >
        One entry of the array body of `PATCH /tables/positions` - mirrors
        `RoomUnitPositionInput` exactly, see that schema's own comment for why `positionX`/
        `positionY` aren't under `required` despite conceptually needing to be present.
      required: [tableId]
      properties:
        tableId:
          type: string
        positionX:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        positionY:
          type: number
          nullable: true
          minimum: 0
          maximum: 1

    OrderItem:
      type: object
      description: >
        A single line of an Order. `unitPrice` is a snapshot of `MenuItem.price` at the moment
        the item was added — later menu price changes never retroactively affect it. `sentAt`
        is set the moment this line is included in a kitchen/bar ticket print (the original
        send, or a later re-order print — see `POST /orders/{id}/items`); it's set regardless
        of whether that print actually reached the printer, same "dispatched, not delivered"
        contract as `Order.status` transitioning to `SENT`. Two lines are candidates for
        merging (see `POST /orders/{id}/items`) only when both have `sentAt: null`.
      required: [id, orderId, menuItemId, quantity, unitPrice, note, createdAt, sentAt]
      properties:
        id:
          type: string
        orderId:
          type: string
        menuItemId:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: string
          description: Decimal(10,2) rendered as a string, snapshotted at insert time.
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
          nullable: true

    Order:
      type: object
      description: >
        `total` is always server-computed from `items` — never taken from the client (same
        rule as `Booking.totalPrice`). `paymentMethod` is a convenience denormalization of the
        `Payment` this order settled with (there's at most one - see `Payment_unique_per_order`);
        it's `null` for anything still `OPEN`/`SENT`/`CANCELLED`, and set once and never changed
        once the order is `PAID`. Exists so a closed-order list/detail view can show how it was
        paid without a second round trip - there's no `GET /payments/{id}` or `?orderId=` filter
        on `Payment` to fetch it separately. `openedByEmail` is the same kind of denormalization
        of `openedByUserId` that `ShiftListItem.openedByEmail` is of `Shift.openedByUserId` - a
        MANAGER building the staff filter on `GET /orders` can't fall back to `GET /users`
        (ADMIN-only) the way a CASHIER+ page elsewhere in this API can. `openedByUserId` is `null`
        exactly for a room-service order (see the `GuestOrder` tag) - a guest has no `User` row to
        point at; `openedByEmail` still reads a non-null, human label in that case (see
        `OrderService#resolveEmail`'s own comment), never `null`.
      required:
        [
          id,
          tableId,
          bookingId,
          guestName,
          status,
          openedByUserId,
          openedByEmail,
          total,
          note,
          items,
          createdAt,
          updatedAt,
          paymentMethod,
          guestAccessToken,
          number,
          closedAt,
          spaAppointmentId,
          voids,
        ]
      properties:
        id:
          type: string
        number:
          type: integer
          format: int64
          description: >
            Human-readable receipt number - one global, monotonically increasing sequence assigned
            by the database at insert (orders that existed before it were numbered in the order
            they were opened). Printed on every ticket/pre-bill/receipt and shown next to `id`,
            never instead of it: `id` stays the key every reference uses.
        closedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When the order left the floor - the `Payment`'s time for `PAID`, the last update (the
            cancellation itself) for `CANCELLED`, `null` while `OPEN`/`SENT`. What
            `GET /orders?dateBasis=CLOSED` filters on.
        spaAppointmentId:
          type: string
          nullable: true
          description: >
            The spa appointment this order bills (`SpaAppointment.orderId` read back the other
            way), or `null`. Read-only here - the link is made on `POST /orders` or by the
            auto-link, see `OrderCreateInput.spaAppointmentId`. Lets a list of open tickets mark a
            spa order without a lookup per row.
        voids:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemVoid"
          description: Lines (or parts of lines) voided after being sent - see `POST /orders/{id}/items/{itemId}/void`. Never part of `items` or `total`.
        tableId:
          type: string
          nullable: true
        bookingId:
          type: string
          nullable: true
          description: >
            Settable only via `OrderCreateInput.bookingId` at creation. The spa billing door
            (`billSpaAppointment`, `lib/spaOrderClient.ts`) sends it as a pre-fill convenience -
            "which guest is this treatment for"; room-service ordering (`GuestOrder`) always sends
            it, since it's how a room-service order is defined - see that tag's own description.
            Most other order creation paths never send it, so it reads null everywhere else. Either
            way, it is
            *not* the record of what a closed order was charged to - that's `Payment.bookingId`
            (see that field's own description), set independently at `POST /orders/{id}/close`
            and never mirrored back here. Money reads (a booking's folio, its room-charges list)
            and the spa auto-link's booking axis both go through `Payment.bookingId` for exactly
            this reason - never this field. The one live reader of this field is the "Linked
            booking" link on the admin order ticket, a plain navigation convenience back to the
            booking a spa-billed order was opened for; it is not a billing signal.
        guestName:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/OrderStatus"
        openedByUserId:
          type: string
          nullable: true
          description: "`null` for a room-service order opened by a guest, not a staff member - see this schema's own description."
        openedByEmail:
          type: string
        total:
          type: string
          description: Decimal(10,2) rendered as a string, e.g. `"1250.00"`.
        note:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        paymentMethod:
          allOf:
            - $ref: "#/components/schemas/PaymentMethod"
          nullable: true
        guestAccessToken:
          type: string
          nullable: true
          readOnly: true
          x-sensitive: true
          description: >
            Generated once, automatically, by `OrderService#create` for every order (24 random
            bytes, URL-safe Base64, no padding) - not just orders opened on a table, even though
            only dine-in QR ordering (`PublicOrderingApi`) reads it today; cheap to generate
            unconditionally and room-service ordering will likely want the same mechanism later.
            Never regenerated or rotated - an order that leaves `OPEN`/`SENT` (paid or cancelled)
            simply stops being an accepted token anywhere (see
            `OrderService#requireGuestAccess`), and a new table sitting is a new `Order` with its
            own fresh token, not a reused one. `null` only for orders created before this field
            existed. This is a bearer credential, not guest PII, but the same "never let it leak
            into a stray log line" reasoning applies - marked `x-sensitive` so it renders
            `[REDACTED]` in this model's generated `toString()`, same mechanism as
            `guestEmail`/`guestPhone`/`paymentNote` elsewhere in this spec.

    OrderItemVoid:
      type: object
      description: >
        A quantity taken off a sent line (`POST /orders/{id}/items/{itemId}/void`). Immutable once
        written. `unitPrice`/`note`/`sentAt` are copied from the line as it was, so what was voided
        can be read without the line (which is deleted once fully voided).
      required: [id, menuItemId, quantity, unitPrice, note, sentAt, reason, voidedByUserId, voidedByEmail, voidedAt]
      properties:
        id:
          type: string
        menuItemId:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: string
          description: Decimal(10,2) rendered as a string.
        note:
          type: string
          nullable: true
        sentAt:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
        voidedByUserId:
          type: string
        voidedByEmail:
          type: string
          description: Same denormalization as `Order.openedByEmail`; falls back to the raw id for a deleted user.
        voidedAt:
          type: string
          format: date-time

    OrderItemVoidInput:
      type: object
      required: [reason]
      properties:
        quantity:
          type: integer
          minimum: 1
          nullable: true
          description: How many units of the line to void; omitted or null voids the whole line.
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Required - recorded on the void and in the audit log.

    OrderCreateInput:
      type: object
      description: At least one of `tableId`/`bookingId`/`guestName` is expected in practice (an order with none of them is a valid but untraceable tab), but this isn't enforced server-side — same "trust the caller on shape, not on price" spirit as elsewhere.
      properties:
        tableId:
          type: string
          nullable: true
        bookingId:
          type: string
          nullable: true
          description: >
            Becomes `Order.bookingId` - see that field's own description for why sending this is
            not how a booking ends up billed for the order. Charging an order to a room happens
            at `POST /orders/{id}/close` with `method: ROOM_CHARGE` and a `bookingId` in that
            body, independently of whatever (if anything) was sent here at creation.
        guestName:
          type: string
          nullable: true
          maxLength: 120
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"
          description: >
            Lines to add in the same transaction, exactly as `POST /orders/{id}/items` would add
            them. The POS screens send the first line here instead of creating the order when a
            table is tapped: an order only comes into existence with something on it, so opening a
            free table and walking away leaves no empty order behind and the table stays free.
            Optional - the spa billing door and room service still create first and add after.
        spaAppointmentId:
          type: string
          nullable: true
          description: >
            When set, this order becomes `SpaAppointment.orderId` for that appointment (see that
            field's own description; the appointment itself never computes or stores an amount).
            An id that doesn't resolve to a real appointment is silently ignored, same "don't let
            a side link fail the write it rides on" spirit as printing/audit - order creation is
            never blocked by this. Unconditional: sending this always links, regardless of the
            order's table/booking/items - it's the override for when auto-resolution below can't
            or shouldn't guess.

            Usually left unset - auto-resolution covers the ordinary case without it, and only
            once the order actually contains a `SPA`-department item - true of every order that
            genuinely bills a treatment, false of everything else, so a table-less order or a
            spa-table order for something else can never link just because its table/booking
            happens to coincide with a real appointment. Gated the same way on both of the two
            axes below, tried at two different moments because each needs a fact that doesn't
            exist at the other's call site:

            By `tableId`, attempted whenever items are added (`POST /orders/{id}/items`, see
            `OrderService#autoLinkSpaAppointmentByTable`) - the table is known from the moment the
            order opens, but the SPA-content gate needs items, which don't exist until one has
            been rung in. Matched by *time*, not count - the appointment on that table whose slot
            contains the moment the order was opened, or (covering the ordinary case of items
            being rung in a few minutes after the treatment actually ends) one that ended within
            the last `app.spa.order-link-grace-minutes`.

            By the booking a `ROOM_CHARGE` close names, attempted at `POST /orders/{id}/close`
            (see `OrderService#autoLinkSpaAppointmentByBooking`) - a room-charge order often
            carries no `tableId` at all, and closing is the one moment a booking is actually known
            for one: `Order.bookingId` (settable only via an optional field on this schema) is
            never populated by any real caller today, so this axis never used the field this
            schema exposes - it reads the id the close body itself names instead. Count-based, not
            time-based (no slot to match against at close): exactly one of the booking's unlinked
            appointments today is unambiguous, two or more decline. A resolution failure here
            never affects the close it rides on, same as it never affects `addItems` above.

            Either axis declines rather than guesses when it finds more than one candidate, and
            neither re-resolves an order the other has already linked. Send `spaAppointmentId`
            explicitly to override auto-resolution on either axis, or when both declined and staff
            need to link by hand.

    OrderUpdateInput:
      type: object
      description: >
        Partial update (unlike `RoomInput`/`MenuItemInput`/`TableInput`): an omitted field
        leaves the existing value alone, an explicit `null` on `note`/`tableId` clears it.
        The only legal `status` transition through this endpoint is `OPEN` -> `SENT`; any
        other value (including trying to set `PAID`/`CANCELLED` here instead of through
        `/close` or `/cancel`) is rejected with 400.
      properties:
        note:
          type: string
          nullable: true
          maxLength: 1000
        tableId:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/OrderStatus"

    OrderItemInput:
      type: object
      description: >
        Used both as the array body of `POST /orders/{id}/items` (create) and the single-object
        body of `PATCH /orders/{id}/items/{itemId}` (full replacement of `quantity`/`note` for
        that line — `menuItemId` is immutable after creation but still required in the body for
        symmetry with the create shape; the server ignores it on PATCH).
      required: [menuItemId, quantity]
      properties:
        menuItemId:
          type: string
        quantity:
          type: integer
          minimum: 1
        note:
          type: string
          nullable: true
          maxLength: 500

    CloseOrderInput:
      type: object
      description: >
        Body of `POST /orders/{id}/close`. No `amount` field: there's no partial-payment
        model (an `Order` goes straight to the terminal `PAID` status on the first close, it
        can't accumulate multiple payments), so the amount charged is never a client-supplied
        number - the server always charges `Order.total` exactly, the same "never trust the
        client on money" rule as `Booking.totalPrice`/`Order.total` itself. `bookingId` is
        required when `method` is `ROOM_CHARGE` — a cross-field rule enforced server-side, not
        expressible in JSON Schema (same pattern as `BookingCreateInput`'s `checkIn < checkOut`).
        An order with no lines can't be closed at all (409) - there is nothing to charge, and a
        ฿0 `PAID` order is noise in the history and the cash report; cancel it instead.
      required: [method]
      properties:
        method:
          $ref: "#/components/schemas/PaymentMethod"
        bookingId:
          type: string
        amountTendered:
          type: string
          pattern: '^\d{1,8}(\.\d{1,2})?$'
          description: >
            `CASH` only, optional: the cash the guest handed over, as the cashier counted it in the
            close dialog. Never what is charged - the payment is still exactly `Order.total`. The
            server rejects it (400) when it's less than the total, or sent with any other method,
            and records it with the change due in the audit entry.

    GuestOrderItem:
      type: object
      description: >
        One line of a `GuestOrderView` - the guest-facing projection of `OrderItem`. Carries the
        menu item's name (a guest has no way to resolve `menuItemId` on their own) instead of the
        id itself, and deliberately nothing about `sentAt` - whether a line has already gone to
        the kitchen is staff information, not something a guest's phone needs to render.
      required: [name, quantity, note, unitPrice]
      properties:
        name:
          type: string
        quantity:
          type: integer
        note:
          type: string
          nullable: true
        unitPrice:
          type: string
          description: Decimal(10,2) rendered as a string - same snapshot-at-add-time value as `OrderItem.unitPrice`.

    GuestOrderSubmitInput:
      type: object
      description: Body of `POST /guest/orders` - see that operation's own description.
      required: [bookingId, items]
      properties:
        bookingId:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"

    GuestOrderView:
      type: object
      description: >
        The guest-facing projection of `Order`, returned by both `PublicOrderingApi` operations
        and `GuestOrderApi` (see that tag's own description for the room-service case - the
        `locationLabel` below is the same identifier either way, whatever
        `OrderPrintingService#describeLocation` resolves for the order).
        Deliberately not `Order` itself - never carries `openedByUserId`/`openedByEmail`,
        `guestName`, `bookingId`, `paymentMethod`, or `guestAccessToken` (the token that gated
        the request that produced this response is never echoed back in it). `locationLabel` is
        the same "zone – table label" text `OrderPrintingService#describeLocation` puts on a
        printed ticket, so a guest looking at their phone sees the same identifier staff do.
      required: [id, status, locationLabel, items, total]
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        locationLabel:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/GuestOrderItem"
        total:
          type: string
          description: Decimal(10,2) rendered as a string, e.g. `"1250.00"` — same server-computed total as `Order.total`.

    Payment:
      type: object
      required: [id, orderId, method, amount, bookingId, recordedByUserId, shiftId, createdAt]
      properties:
        id:
          type: string
        orderId:
          type: string
        method:
          $ref: "#/components/schemas/PaymentMethod"
        amount:
          type: string
          description: Decimal(10,2) rendered as a string.
        bookingId:
          type: string
          nullable: true
          description: Set only when `method` is `ROOM_CHARGE`.
        recordedByUserId:
          type: string
        shiftId:
          type: string
        createdAt:
          type: string
          format: date-time

    Shift:
      type: object
      required: [id, openedByUserId, openedAt, closedByUserId, closedAt, openingCashFloat, closingCashCounted, status, notes]
      properties:
        id:
          type: string
        openedByUserId:
          type: string
        openedAt:
          type: string
          format: date-time
        closedByUserId:
          type: string
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        openingCashFloat:
          type: string
          nullable: true
          description: Decimal(10,2) rendered as a string.
        closingCashCounted:
          type: string
          nullable: true
          description: Decimal(10,2) rendered as a string.
        status:
          $ref: "#/components/schemas/ShiftStatus"
        notes:
          type: string
          nullable: true

    ShiftOpenInput:
      type: object
      properties:
        openingCashFloat:
          type: number
          minimum: 0

    ShiftCloseInput:
      type: object
      properties:
        closingCashCounted:
          type: number
          minimum: 0
        notes:
          type: string
          nullable: true
          maxLength: 1000

    ShiftTotals:
      type: object
      description: Sum of this shift's `Payment.amount`, broken out by method — CASH/CARD/OTHER only; ROOM_CHARGE payments settle against the room folio, not this shift's cash/card reconciliation, so they're reported separately as `roomCharge`.
      required: [cash, card, roomCharge, other, paymentCount]
      properties:
        cash:
          type: string
          description: Decimal(10,2) rendered as a string.
        card:
          type: string
          description: Decimal(10,2) rendered as a string.
        roomCharge:
          type: string
          description: Decimal(10,2) rendered as a string.
        other:
          type: string
          description: Decimal(10,2) rendered as a string.
        paymentCount:
          type: integer

    ShiftSummary:
      type: object
      required: [id, openedByUserId, openedAt, closedByUserId, closedAt, openingCashFloat, closingCashCounted, status, notes, totals]
      properties:
        id:
          type: string
        openedByUserId:
          type: string
        openedAt:
          type: string
          format: date-time
        closedByUserId:
          type: string
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        openingCashFloat:
          type: string
          nullable: true
          description: Decimal(10,2) rendered as a string.
        closingCashCounted:
          type: string
          nullable: true
          description: Decimal(10,2) rendered as a string.
        status:
          $ref: "#/components/schemas/ShiftStatus"
        notes:
          type: string
          nullable: true
        totals:
          $ref: "#/components/schemas/ShiftTotals"
        openedByEmail:
          type: string
          description: >
            Who opened the shift, same lookup as `ShiftListItem.openedByEmail` - so the shift
            screen can say who opened the drawer without a second call to `GET /users` (which a
            CASHIER can't make). Absent only if that account has no email any more.
        closedByEmail:
          type: string
          description: Who closed the shift; absent while it is still open.

    ShiftListItem:
      type: object
      description: >
        One row of `GET /shifts` - the same fields as `ShiftSummary` plus what a manager
        reviewing a period actually needs and would otherwise have to look up separately:
        `openedByEmail`/`closedByEmail` (so this list doesn't require cross-referencing user
        ids against `GET /users`) and the reconciliation numbers themselves,
        `expectedCash`/`discrepancy` - the same arithmetic as the printed Z-report and the CSV
        export (`ShiftService`): `expectedCash` = `openingCashFloat` (0 if unset) + this shift's
        cash payments; `discrepancy` = `closingCashCounted` - `expectedCash`, positive meaning
        more cash counted than expected, negative meaning less. `discrepancy` is `null` exactly
        when `closingCashCounted` is - an open or never-recounted shift has nothing to compare.
      required:
        - id
        - openedByUserId
        - openedByEmail
        - openedAt
        - closedByUserId
        - closedByEmail
        - closedAt
        - openingCashFloat
        - closingCashCounted
        - status
        - totals
        - expectedCash
        - discrepancy
      properties:
        id:
          type: string
        openedByUserId:
          type: string
        openedByEmail:
          type: string
        openedAt:
          type: string
          format: date-time
        closedByUserId:
          type: string
          nullable: true
        closedByEmail:
          type: string
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        openingCashFloat:
          type: string
          nullable: true
          description: Decimal(10,2) rendered as a string.
        closingCashCounted:
          type: string
          nullable: true
          description: Decimal(10,2) rendered as a string.
        status:
          $ref: "#/components/schemas/ShiftStatus"
        totals:
          $ref: "#/components/schemas/ShiftTotals"
        expectedCash:
          type: string
          description: Decimal(10,2) rendered as a string.
        discrepancy:
          type: string
          nullable: true
          description: Decimal(10,2) rendered as a string, or null if closingCashCounted is null.

    BookingPosOrderItem:
      type: object
      description: Compact line-item summary - menu item name (not id) and quantity, nothing else.
      required: [name, quantity]
      properties:
        name:
          type: string
        quantity:
          type: integer

    BookingPosOrder:
      type: object
      description: One `Order` that was closed with `method=ROOM_CHARGE` against this booking.
      required: [orderId, amount, paidAt, items]
      properties:
        orderId:
          type: string
        amount:
          type: string
          description: The `Payment.amount` recorded when this order was closed - decimal(10,2) rendered as a string.
        paidAt:
          type: string
          format: date-time
          description: '`Payment.createdAt` - when the order was closed, not when the order was opened.'
        items:
          type: array
          items:
            $ref: "#/components/schemas/BookingPosOrderItem"

    BookingFolio:
      type: object
      description: >
        `folioTotal` = `roomTotal` + `roomChargesTotal`, computed on the fly by
        `BookingService.computeFolio`/`getFolio` - see that method's Javadoc. Never stored.
        `roomChargesTotal` is *net of settlement* - what's actually still owed, not the raw sum
        of every ROOM_CHARGE `Payment` this stay ever generated. See `FolioPayment`'s own
        description for how a charge gets marked collected; `GET /bookings/{id}/folio-payments`
        lists the settlement history behind this number.
      required: [roomTotal, roomChargesTotal, folioTotal, roomChargeCount]
      properties:
        roomTotal:
          type: string
          description: >
            `Booking.totalPrice` - decimal(10,2) rendered as a string. Always the full room
            total regardless of `status` - unlike `CheckOutResult`/`TodayBoardEntry`'s
            `outstandingBalance` (see `BookingService.computeOutstandingBalance`), which drops
            this once `status` is `PAID`. `folioTotal` here is "what this stay adds up to," not
            "what's still owed" - use `outstandingBalance` for that.
        roomChargesTotal:
          type: string
          description: >
            Sum of this booking's ROOM_CHARGE `Payment.amount` rows, minus every `FolioPayment`
            recorded against it (floored at zero) - decimal(10,2) rendered as a string.
        folioTotal:
          type: string
          description: >
            `roomTotal` + `roomChargesTotal` - decimal(10,2) rendered as a string. Not the same
            question as `outstandingBalance` (see `roomTotal`'s own description) - this always
            includes the full room total, `outstandingBalance` drops it once `status` is `PAID`.
        roomChargeCount:
          type: integer
          description: >
            Number of ROOM_CHARGE payments this stay has ever generated (a raw historical count,
            not "how many are still unsettled" - individual charges aren't tracked as
            settled/unsettled, only the running total is) - same count as
            `GET /bookings/{id}/pos-orders` would return entries.

    FolioPaymentMethod:
      type: string
      description: Deliberately excludes ROOM_CHARGE - a room charge can't be settled by charging it to the room.
      enum:
        - CASH
        - CARD
        - OTHER

    FolioPayment:
      type: object
      description: >
        Money actually collected against a booking's folio - the record that makes a
        `ROOM_CHARGE` payment's amount stop counting as owed in `BookingFolio.roomChargesTotal`/
        `CheckOutResult.outstandingBalance`/`TodayBoardEntry.outstandingBalance`. Deliberately
        not tied to a shift - unlike `Payment`, cash collected this way is not counted in
        end-of-shift cash-drawer reconciliation, the same gap `Booking.status = PAID` already
        has for the room portion of a stay. Rows accumulate (a guest can pay part now, the rest
        later) and are never edited or deleted - to correct a mistake, staff record another
        entry, the same append-only convention the audit log uses.
      required: [id, bookingId, method, amount, recordedByUserId, createdAt]
      properties:
        id:
          type: string
        bookingId:
          type: string
        method:
          $ref: "#/components/schemas/FolioPaymentMethod"
        amount:
          type: string
          description: Decimal(10,2) rendered as a string.
        recordedByUserId:
          type: string
        createdAt:
          type: string
          format: date-time

    FolioPaymentInput:
      type: object
      description: Body of `POST /bookings/{id}/folio-payments`.
      required: [method, amount]
      properties:
        method:
          $ref: "#/components/schemas/FolioPaymentMethod"
        amount:
          type: string
          description: >
            Decimal(10,2) as a string, greater than zero. Rejected with 409 if it would exceed
            what's currently outstanding on this booking's folio - a fat-finger guard, not a
            restriction on partial payment (a smaller amount than what's owed is always fine).

    PaymentsSummary:
      type: object
      description: >
        Response of `GET /payments/summary`. See that operation's description for why
        `totals.roomCharge` is excluded from `grandTotal` - do not sum `totals.*` yourself on
        the client, use `grandTotal` as-is for received revenue.
      required: [from, to, totals, grandTotal]
      properties:
        from:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        to:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        totals:
          $ref: "#/components/schemas/ShiftTotals"
        grandTotal:
          type: string
          description: '`totals.cash + totals.card + totals.other` - decimal(10,2) rendered as a string. Deliberately excludes `totals.roomCharge`.'

    AuditAction:
      type: string
      description: >
        The fixed vocabulary of significant staff actions this system records. Deliberately not
        open-ended (a free-text action name) - a closed set is what makes "filter by action
        type" on `GET /audit-log` and a fixed dropdown in the admin UI possible at all. Adding a
        new kind of audited action means adding a value here (a plain `ALTER TYPE ... ADD VALUE`
        migration, same pattern already used for `Role`/`PrintDocumentType`), not widening this
        into a string.
      enum:
        - BOOKING_CREATED
        - BOOKING_STATUS_CHANGED
        - BOOKING_PAYMENT_NOTE_CHANGED
        - BOOKING_SCHEDULE_CHANGED
        - BOOKING_ROOM_ASSIGNED
        - BOOKING_RELOCATED
        - BOOKING_RELOCATION_UNDONE
        - BOOKING_REPRICED
        - BOOKING_CHECKED_IN
        - BOOKING_CHECKED_OUT
        - BOOKING_NO_SHOW_MARKED
        - BOOKING_FOLIO_PAYMENT_RECORDED
        - BOOKINGS_EXPORTED
        - ROOM_PRICE_CHANGED
        - RATE_OVERRIDE_CHANGED
        - ORDER_CLOSED
        - ORDER_CANCELLED
        - ROOM_CHARGE_POSTED
        - SHIFT_OPENED
        - SHIFT_CLOSED
        - SHIFT_EXPORTED
        - USER_CREATED
        - USER_ROLE_CHANGED
        - USER_ACTIVE_CHANGED
        - USER_PASSWORD_RESET
        - USER_FUNCTIONS_CHANGED
        - USER_CREDENTIALS_GRANTED
        - USER_OVERTIME_ELIGIBILITY_CHANGED
        - USER_ENROLLMENT_NUMBER_CHANGED
        - USER_STAFF_AREA_CHANGED
        - USER_FULL_NAME_CHANGED
        - USER_NAME_CHANGED
        - ROOM_UNIT_CREATED
        - ROOM_UNIT_UPDATED
        - ROOM_UNIT_DELETED
        - ROOM_UNIT_BLOCK_CREATED
        - ROOM_UNIT_BLOCK_DELETED
        - ROOM_UNIT_HOUSEKEEPING_CHANGED
        - ROOM_UNIT_POSITION_UPDATED
        - PROPERTY_MAP_IMAGE_UPDATED
        - PRINT_JOB_DISMISSED
        - SPA_APPOINTMENT_CREATED
        - SPA_APPOINTMENT_STATUS_CHANGED
        - POS_TABLE_POSITION_UPDATED
        - MAINTENANCE_TASK_CREATED
        - MAINTENANCE_TASK_STATUS_CHANGED
        - MAINTENANCE_TASK_BLOCKED
        - MAINTENANCE_TASK_BLOCK_LIFTED
        - GUEST_CREATED
        - GUEST_UPDATED
        - GUEST_DELETED
        - BOOKING_GUEST_LINKED
        - SPA_MAP_IMAGE_UPDATED
        - BOOKING_SEGMENT_ROOM_CHANGED
        - BOOKING_ROOMS_SWAPPED
        - SPA_APPOINTMENT_RESCHEDULED
        - SPA_APPOINTMENT_TREATMENT_ADDED
        - SPA_APPOINTMENT_TREATMENT_REMOVED
        - SPA_APPOINTMENT_TABLES_SWAPPED
        - SHIFT_CODE_CREATED
        - SHIFT_CODE_KIND_CHANGED
        - SHIFT_CODE_DISPLAY_COLOR_CHANGED
        - SHIFT_CODE_VERSIONED
        - EMPLOYEE_PATTERN_CHANGED
        - ROSTER_ENTRY_CREATED
        - ROSTER_ENTRY_MOVED
        - ROSTER_ENTRY_REASSIGNED
        - ROSTER_ENTRIES_SWAPPED
        - ROSTER_ENTRY_DELETED
        - ROSTER_ENTRY_LOCKED_CHANGED
        - ROSTER_MONTH_GENERATED
        - ROSTER_MONTH_COPIED
        - STAFF_AREA_COVERAGE_RULE_CHANGED
        - ATTENDANCE_PUNCH_RECORDED
        - ATTENDANCE_PUNCH_CORRECTED
        - EMPLOYEE_PAY_RATE_CHANGED
        - ROSTER_ACTUALS_EXPORTED
        - ROSTER_MONTH_IMPORTED
        - ROSTER_GRID_EXPORTED
        - ROSTER_GRID_IMPORTED
        - ATTENDANCE_DEVICE_CREATED
        - ATTENDANCE_DEVICE_UPDATED
        - ATTENDANCE_DEVICE_DELETED
        - MENU_ITEM_CREATED
        - MENU_ITEM_UPDATED
        - MENU_ITEM_DELETED
        - REVENUE_EXPORTED
        - LIFECYCLE_EMAIL_SETTINGS_UPDATED
        - NIGHT_AUDIT_CLOSED
        - VAT_SETTINGS_UPDATED
        - LEDGER_ENTRY_POSTED
        - LEDGER_ENTRY_REVERSED
        - LEDGER_ACCOUNT_CREATED
        - SITEMINDER_ROOM_TYPE_MAPPING_CREATED
        - SITEMINDER_ROOM_TYPE_MAPPING_UPDATED
        - SITEMINDER_ROOM_TYPE_MAPPING_DELETED
        - RESTAURANT_MAP_IMAGE_UPDATED
        - ORDER_ITEM_VOIDED

    AuditEntityType:
      type: string
      description: >
        Which kind of record `AuditLogEntry.entityId` refers to. Paired with `entityId` to look
        up one record's own history (e.g. a booking's). Values are SCREAMING_SNAKE_CASE, not the
        PascalCase entity class names, deliberately: Spring MVC's default `@RequestParam` enum
        conversion for a query parameter (unlike Jackson's JSON body deserialization) uses the
        enum constant's own `name()`, not a custom `@JsonValue` - a PascalCase value here would
        deserialize correctly in a JSON response body but fail to bind as a query parameter
        (`entityType=Booking` 400s while `entityType=BOOKING` works), which is exactly the
        asymmetry every other enum in this API avoids by keeping its JSON value identical to its
        Java constant name.
      enum: [BOOKING, ROOM, ORDER, SHIFT, USER, ROOM_UNIT, PROPERTY_MAP, PRINT_JOB, MAINTENANCE_TASK, TABLE, SPA_APPOINTMENT, GUEST, SPA_MAP, SHIFT_CODE, ROSTER_ENTRY, STAFF_AREA_COVERAGE_RULE, ATTENDANCE_PUNCH, EMPLOYEE_PAY_RATE, ATTENDANCE_DEVICE, MENU_ITEM, PAYMENT, SETTINGS, NIGHT_AUDIT, LEDGER_ENTRY, LEDGER_ACCOUNT, SITEMINDER_ROOM_TYPE_MAPPING, RESTAURANT_MAP]

    AuditLogEntry:
      type: object
      description: >
        One row from the append-only audit log - see the AuditLog tag description for what gets
        recorded and why. `summary` is written in plain language by the service action that
        triggered it, meant to be read directly by a hotel manager, not reconstructed by the
        client from raw before/after field values - deliberately not a generic entity diff (see
        the backend's `AuditLogService` for the reasoning: a diff of every field is both harder
        to read and, for the fields that actually matter here, no more precise than a sentence
        written at the one point in the code that already knows what changed and why it
        matters).
      required: [id, actorUserId, actorEmail, action, entityType, summary, createdAt]
      properties:
        id:
          type: string
        actorUserId:
          type: string
          description: >
            The acting user's id at the time of the action. Not guaranteed to still resolve via
            `GET /users/{id}` - see `actorEmail`. For a system-initiated action with no
            authenticated staff principal (e.g. `BookingExpiryService`'s scheduled sweep), this is
            the fixed literal `"SYSTEM"`, not a real user id - see `actorRole`. For a change made by
            the SiteMinder reservation import it is `"SITEMINDER"`.
        actorEmail:
          type: string
          description: >
            The acting user's email *as it was at the time of the action* - a snapshot, not a
            live join to the current `User` row. This is deliberate: the acting user's account
            may since have had its email changed, or (if account deletion is ever added - today
            accounts are only disabled, never deleted) no longer exist at all, and this row must
            still say who did it. For a system-initiated action (see `actorUserId`), this is the
            fixed literal `"system@sunsetbeach.internal"`, not a real address (for the SiteMinder
            import, `"siteminder@sunsetbeach.internal"`).
        actorRole:
          allOf:
            - $ref: "#/components/schemas/Role"
          nullable: true
          description: >
            The acting user's role at the time of the action - also a snapshot, for the same
            reason as `actorEmail`. Null only for a system-initiated action with no authenticated
            staff principal (see `actorUserId` - the scheduled sweeps and the SiteMinder import) -
            never null for anything a real staff member did.
        action:
          $ref: "#/components/schemas/AuditAction"
        entityType:
          $ref: "#/components/schemas/AuditEntityType"
        entityId:
          type: string
          nullable: true
          description: 'Absent for an action with no single-record target (e.g. `BOOKINGS_EXPORTED`, a query over many bookings at once).'
        summary:
          type: string
          description: Human-readable description of what happened, written by the code that performed the action. Never contains a guest's email, phone, or payment note - see the tag description.
        createdAt:
          type: string
          format: date-time

    AuditLogPage:
      type: object
      description: One page of `GET /audit-log` results, newest first.
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
          description: Total number of matching entries across all pages, for rendering pagination controls - not just `items.length`.

    SiteMinderReservationStatus:
      type: string
      enum: [BOOKED, MODIFIED, CANCELLED]
      description: The reservation's status as SiteMinder shows it (Booked / Modified / Cancelled).

    SiteMinderReservationInput:
      type: object
      description: >
        One reservation as read off SiteMinder's reservation list/card, sent by the polling
        script. No guest email or phone - SiteMinder masks them until trusted-device access is set
        up; a later enrichment pass will find the booking by `reference` and fill them in on its
        `Guest` card.
      required: [reference, status, lastName, checkIn, checkOut, roomTypeName, adults, totalPrice, channel, bookedAt]
      properties:
        reference:
          type: string
          minLength: 1
          maxLength: 100
          description: >
            SiteMinder's own booking reference - the one shown on both the list and the card view,
            not the per-OTA reference. The idempotency key.
        status:
          $ref: "#/components/schemas/SiteMinderReservationStatus"
        firstName:
          type: string
          maxLength: 120
        lastName:
          type: string
          minLength: 1
          maxLength: 120
        checkIn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        checkOut:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        roomTypeName:
          type: string
          minLength: 1
          maxLength: 200
          description: SiteMinder's room type name exactly as displayed, e.g. "Garden Jacuzzi Villa ABF". Must be mapped - see `SiteMinderRoomTypeMapping`.
        adults:
          type: integer
          minimum: 1
        children:
          type: integer
          minimum: 0
          default: 0
        infants:
          type: integer
          minimum: 0
          default: 0
          description: >
            Accepted but not stored - `Booking` has no infants count, and folding infants into
            `children` would change the party size every report counts. Named in the creation
            audit entry so it isn't lost entirely.
        totalPrice:
          type: string
          pattern: '^\d{1,8}(\.\d{1,2})?$'
          description: SiteMinder's total for the stay as a decimal string in THB, e.g. `"12500.00"`. Becomes the booking's agreed price - see the operation description.
        currency:
          type: string
          description: Optional. If sent, must be `THB` - anything else is rejected, so a price in another currency can't be booked as baht.
        channel:
          type: string
          minLength: 1
          maxLength: 100
          description: >
            The channel name as SiteMinder displays it. Mapped to `BookingChannel`: names starting
            with Booking.com, Expedia, Agoda or Airbnb map to those values; "Direct" and
            SiteMinder's own booking engine (the hotel's website) map to `DIRECT`; anything else
            maps to `OTHER`. The raw name is kept as `Booking.externalChannel` either way.
        bookedAt:
          type: string
          format: date-time
          description: SiteMinder's "Booked on" time, with its UTC offset.
        modifiedAt:
          type: string
          format: date-time
          description: SiteMinder's "Modified on" time, if shown.
        cancelledAt:
          type: string
          format: date-time
          description: SiteMinder's "Cancelled on" time, if shown.

    SiteMinderImportAction:
      type: string
      enum: [CREATED, UPDATED, CANCELLED, UNCHANGED, SKIPPED]
      description: >
        What an import did. `UNCHANGED` - already up to date, nothing written. `SKIPPED` - nothing
        written on purpose (a stale update, a modification or cancellation of a reservation never
        imported, or a booking already cancelled in this system); `message` says which.

    SiteMinderImportResult:
      type: object
      required: [action, bookingId, changes, warnings, message]
      properties:
        action:
          $ref: "#/components/schemas/SiteMinderImportAction"
        bookingId:
          type: string
          nullable: true
          description: The booking created or matched. Null only for a `SKIPPED` reservation that was never imported.
        changes:
          type: array
          items:
            type: string
          description: What was changed, one entry per change, for the script's log. Empty unless `UPDATED`.
        warnings:
          type: array
          items:
            type: string
          description: >
            Changes applied with a caveat a person should know about - e.g. the assigned room
            wasn't free for the new dates and was unassigned, or the price of a `PAID` booking
            changed (which posts nothing to the ledger).
        message:
          type: string
          nullable: true
          description: Why a reservation was `SKIPPED`. Null otherwise.

    SiteMinderRoomTypeMapping:
      type: object
      required: [id, siteMinderRoomType, roomId, roomName, createdAt, updatedAt]
      properties:
        id:
          type: string
        siteMinderRoomType:
          type: string
        roomId:
          type: string
        roomName:
          type: string
          description: The mapped room type's current name, for display.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SiteMinderRoomTypeMappingInput:
      type: object
      required: [siteMinderRoomType, roomId]
      properties:
        siteMinderRoomType:
          type: string
          minLength: 1
          maxLength: 200
        roomId:
          type: string
          minLength: 1

    StaffArea:
      type: string
      description: >
        Which part of the hotel an employee normally works in - Admin, Front Office,
        Maintenance, Housekeeping, Restaurant, Kitchen, matching the source spreadsheet's own
        grouping exactly. Deliberately not named `Department`: `PrinterDepartment` and
        `MenuDepartment` already exist in this API and mean something unrelated (print/ticket
        routing) - reusing the word here would be the same naming collision CLAUDE.md's Naming
        section already warns against for "Shift".
      enum: [ADMIN, FRONT_OFFICE, MAINTENANCE, HOUSEKEEPING, RESTAURANT, KITCHEN]

    Weekday:
      type: string
      description: A day of the week, used for an employee's fixed weekly day off.
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]

    PunchDirection:
      type: string
      description: Whether an `AttendancePunch` is a clock-in or a clock-out.
      enum: [IN, OUT]

    FillColor:
      type: string
      description: >
        The one place a cell's own fill colour is read in the Excel schedule import, rather than
        just its text - the source spreadsheet writes two different shifts both as the bare text
        "9", told apart only by whether the cell is filled yellow (a single 09:00-18:00 shift) or
        light blue (a split one). See `RosterImportShiftColorMapping`'s own description for how a
        colour actually resolves to a `ShiftCode`.
      enum: [YELLOW, BLUE]

    PunchSource:
      type: string
      description: >
        Who produced an `AttendancePunch` - `MANUAL` (typed in by a manager) today, `SCANNER`
        once a real punch clock exists. The attendance model doesn't change when that arrives,
        only who's writing rows - see `AttendancePunch`'s own description.
      enum: [MANUAL, SCANNER]

    ShiftCodeKind:
      type: string
      description: >
        What a shift code actually is, named rather than inferred from `countsAsWorked`/`isPaid`/
        interval shape every time something needs to know (the roster grid's own daily totals used
        to match `code == "PH"` literally to count absences - fragile, since codes are versioned
        and the text can be retyped, and a silently-zero count reads exactly like an ordinary day
        rather than a broken counter). `MORNING`/`EVENING` both mean an ordinary single-interval
        shift - the distinction is which half of the day it falls in, not a difference in how
        either renders (the roster grid's own colour choice is a continuous scale by actual start
        time, not this field - see the frontend's own design notes). `SPLIT` is a two-interval
        shift (`startTime2`/`endTime2` set). `OPEN_SCHEDULE` is `OP` - `countsAsWorked` true, no
        fixed interval. `ABSENCE` is `PH` and anything like it - `countsAsWorked` false, no fixed
        interval; not further split into holiday/annual-leave/kept-day-off, matching how `PH`
        itself has always stayed one code for exactly that reason. Chosen by a person at creation
        (see `ShiftCodeCreateInput`) - not inferred, though `ShiftCode.suggestedKind` offers a
        default guessed from the code's own shape for confirming one that predates this field.
      enum: [MORNING, SPLIT, EVENING, OPEN_SCHEDULE, ABSENCE]

    ShiftCode:
      type: object
      description: >
        One version of one shift code, optionally scoped to one `StaffArea` - never edited once
        any `RosterEntry` references it. `startTime1`/`endTime1` is the first (or only) interval;
        `startTime2`/`endTime2` is present only for a split shift (both null together, never one
        without the other). Zero intervals (all four null) means `OP` - worked, with no fixed
        hours. `countsAsWorked` and `isPaid` are independent: an ordinary shift is both true; `OP`
        is `countsAsWorked` true with no intervals; `PH` is `isPaid` true, `countsAsWorked` false -
        this is what removes the ambiguity of "holiday, annual leave, or a kept day off" being
        one label on the grid without splitting them on screen. A null `staffArea` means this code
        is shared: available to every area, one row instead of one per area. A non-null
        `staffArea` means this code means something different there than it does anywhere else -
        a shared and an area-scoped row may share the same `code` string at once, and where they
        do, the area-scoped one wins for that area (see `GET /shift-codes`'s own description).
        Area-scoping stays fully supported (correct, tested, cheaper to keep than remove), but
        every code at this hotel is in fact shared today - the accountant confirmed nothing here
        actually varies by department; an earlier revision of this schema assumed otherwise for
        "9" specifically, and was wrong (see below). `active=false` means retired: no longer
        offered for a *new* entry, but every entry already pointing at this row is untouched.


        **"9" is two distinct codes, not one code with two meanings.** The source spreadsheet used
        one label, "9", for two genuinely different shifts and told them apart by cell fill
        colour, not by department: yellow "9" is a single 09:00-18:00 shift, light blue "9" is a
        split 09:00-13:00/16:00-21:00 shift. Colour carries no meaning of its own anywhere else in
        the legend - it exists solely so staff can tell these two shifts apart on paper. This
        hotel defines two distinct codes instead of one ambiguous "9": `"9"` for the single
        09:00-18:00 shift (was yellow), `"9S"` for the split 09:00-13:00/16:00-21:00 shift (was
        light blue) - `S` for split, chosen to stay recognisable as "the other 9" to anyone who
        worked from the old paper legend. A future spreadsheet importer should read cell fill
        colour only when a cell's text is "9" (ignore fill everywhere else) and translate yellow
        to `"9"`, light blue to `"9S"` - and reject, not guess, a "9" cell whose fill matches
        neither known colour. A wrongly-guessed shift is a person turning up at the wrong hour.
      required: [id, code, countsAsWorked, isPaid, effectiveFrom, active, createdByEmail, createdAt]
      properties:
        id:
          type: string
        staffArea:
          allOf: [{ $ref: "#/components/schemas/StaffArea" }]
          nullable: true
          description: Null means shared - available to every area. See this schema's own description.
        code:
          type: string
          description: The short label as staff already know it - "9", "8.3", "OP", "PH".
        startTime1:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        endTime1:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        startTime2:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        endTime2:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        countsAsWorked:
          type: boolean
        isPaid:
          type: boolean
        effectiveFrom:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        active:
          type: boolean
        createdByEmail:
          type: string
        createdAt:
          type: string
          format: date-time
        kind:
          allOf: [{ $ref: "#/components/schemas/ShiftCodeKind" }]
          nullable: true
          description: >
            Null only for a code created before this field existed and not yet confirmed - see
            `suggestedKind` and `PATCH /shift-codes/{id}/kind`. Every code created from here on
            has one (see `ShiftCodeCreateInput`).
        suggestedKind:
          allOf: [{ $ref: "#/components/schemas/ShiftCodeKind" }]
          nullable: true
          description: >
            A default guessed from this code's own interval shape and `countsAsWorked` - set only
            when `kind` is null, for `PATCH /shift-codes/{id}/kind` to offer as a starting point,
            never applied on its own. Same "suggest, don't silently apply" shape as
            `RosterImportNameEntry.suggestedStaffArea`.
        displayColor:
          type: string
          nullable: true
          pattern: '^#[0-9a-fA-F]{6}$'
          description: >
            A hex colour an admin has explicitly chosen for this code's chip on the roster grid,
            via `PATCH /shift-codes/{id}/display-color` - null (the default for every code,
            including every one that existed before this field) means nothing has been chosen yet,
            and the grid falls back to its own neutral lightness-by-start-time scheme. Like `kind`,
            this is a presentation attribute, not an agreed term `RosterEntry`s depend on staying
            frozen (see this schema's own description on why a `ShiftCode` row is otherwise never
            edited), so it's the second deliberate exception to that rule, mutated in place rather
            than versioned.
        suggestedColor:
          type: string
          nullable: true
          pattern: '^#[0-9a-fA-F]{6}$'
          description: >
            A default guessed for `"9"`/`"9S"` specifically, set only when `displayColor` is null -
            same "suggest, don't silently apply" shape as `suggestedKind`. Computed from whichever
            `RosterImportShiftColorMapping` row is already on file resolving that code (the
            accountant's own yellow/light-blue distinction for the two "9" shifts - see this
            schema's own description) if one exists yet; every other code gets no suggestion here,
            since nothing else was ever told apart by cell colour in the source spreadsheet.

    ShiftCodeDisplayColorUpdateInput:
      type: object
      description: >
        Body of `PATCH /shift-codes/{id}/display-color`. `displayColor` may be omitted or sent
        explicitly `null` to clear a code back to unset - the grid's neutral fallback applies again
        - so, unlike `ShiftCodeKindUpdateInput.kind`, it is deliberately left out of `required`:
        a `nullable: true` property that's also `required` generates a `@NotNull` that rejects the
        very null this endpoint needs to accept (the codegen's `JsonNullable<T>` wrapper unwraps
        before Bean Validation sees it - see CLAUDE.md's Code generation section).
      properties:
        displayColor:
          type: string
          nullable: true
          pattern: '^#[0-9a-fA-F]{6}$'

    ShiftCodeCreateInput:
      type: object
      description: >
        Body of `POST /shift-codes`. `staffArea` is optional - omit it (or send it explicitly
        `null`) to define a code shared across every area; a code scoped to a real `StaffArea`
        takes precedence over a shared one of the same `code` string for that area only, without
        retiring the shared row (see `ShiftCode`'s own description). Unlike every other field
        here, `kind` (required) is never versioned by creating a new row for it alone - see
        `PATCH /shift-codes/{id}/kind` for correcting one in place.
      required: [code, countsAsWorked, isPaid, effectiveFrom, kind]
      properties:
        staffArea:
          $ref: "#/components/schemas/StaffArea"
        code:
          type: string
        kind:
          $ref: "#/components/schemas/ShiftCodeKind"
        startTime1:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        endTime1:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        startTime2:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        endTime2:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        countsAsWorked:
          type: boolean
        isPaid:
          type: boolean
        effectiveFrom:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'

    ShiftCodeVersionInput:
      type: object
      description: >
        Body of `POST /shift-codes/{id}/versions`. No `staffArea`, `code` or `effectiveFrom` - the
        first two are the edited code's own, the last is always today. The interval fields and
        `displayColor` are nullable and so left out of `required` (see CLAUDE.md's Code generation
        section); omitting one means "none" (an OP/PH-style code with no hours, or no colour), not
        "keep the old value" - the form sends every field.
      required: [kind, countsAsWorked, isPaid]
      properties:
        kind:
          $ref: "#/components/schemas/ShiftCodeKind"
        startTime1:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        endTime1:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        startTime2:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        endTime2:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        countsAsWorked:
          type: boolean
        isPaid:
          type: boolean
        displayColor:
          type: string
          nullable: true
          pattern: '^#[0-9a-fA-F]{6}$'

    ShiftCodeKindUpdateInput:
      type: object
      description: Body of `PATCH /shift-codes/{id}/kind`.
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/ShiftCodeKind"

    RosterEmployee:
      type: object
      description: >
        `GET /roster/employees` - deliberately narrower than `User`/`GET /users`, see that
        endpoint's own description. `name` is the field the roster grid displays and sorts by -
        unlike `email`, it's never absent, including for a no-login account (see
        `UserCreateInput`).
      required: [id, name, active]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        active:
          type: boolean
        staffArea:
          allOf: [{ $ref: "#/components/schemas/StaffArea" }]
          nullable: true
          description: From this employee's `EmployeePattern`, if one has been set.

    EmployeePattern:
      type: object
      description: >
        An employee's normal roster shape - what `POST /roster/generate` reads. `defaultShiftCodeId`
        is nullable: some employees genuinely have no single "usual" code (several rows in the
        source spreadsheet had none), so generation simply leaves their dates blank for the
        manager to fill by hand in that case. `staffArea` here is a read-through of `User.staffArea`
        (see that field's own description) - the area is a fact about the person, stored once,
        not duplicated onto every pattern; `PUT /employee-patterns/{employeeUserId}` writes it to
        the `User` row, not to a column of its own here.
      required: [employeeUserId, employeeName, staffArea, workDaysPerWeek, weeklyDayOff, updatedByEmail, updatedAt]
      properties:
        employeeUserId:
          type: string
        employeeName:
          type: string
        employeeEmail:
          type: string
        staffArea:
          $ref: "#/components/schemas/StaffArea"
        defaultShiftCodeId:
          type: string
          nullable: true
        workDaysPerWeek:
          type: integer
          minimum: 0
          maximum: 7
        weeklyDayOff:
          $ref: "#/components/schemas/Weekday"
        updatedByEmail:
          type: string
        updatedAt:
          type: string
          format: date-time

    EmployeePatternInput:
      type: object
      description: Body of `PUT /employee-patterns/{employeeUserId}`. Full replacement.
      required: [staffArea, workDaysPerWeek, weeklyDayOff]
      properties:
        staffArea:
          $ref: "#/components/schemas/StaffArea"
        defaultShiftCodeId:
          type: string
          nullable: true
        workDaysPerWeek:
          type: integer
          minimum: 0
          maximum: 7
        weeklyDayOff:
          $ref: "#/components/schemas/Weekday"

    RosterEntry:
      type: object
      description: >
        One employee's shift on one date. A day off is the *absence* of a row here, never a row
        of its own - see this schema's own module description for why that's deliberate.
      required: [id, employeeUserId, employeeName, date, shiftCode, locked, createdAt, updatedAt]
      properties:
        id:
          type: string
        employeeUserId:
          type: string
        employeeName:
          type: string
        employeeEmail:
          type: string
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        shiftCode:
          $ref: "#/components/schemas/ShiftCode"
        note:
          type: string
          nullable: true
        locked:
          type: boolean
          description: '"Do not move" - see `PATCH /roster/entries/{id}/lock`.'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RosterEntryCreateInput:
      type: object
      description: Body of `POST /roster/entries`.
      required: [employeeUserId, date, shiftCodeId]
      properties:
        employeeUserId:
          type: string
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        shiftCodeId:
          type: string
        note:
          type: string
          nullable: true

    RosterMoveInput:
      type: object
      description: Body of `PATCH /roster/entries/{id}/date`.
      required: [date]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'

    RosterReassignInput:
      type: object
      description: Body of `PATCH /roster/entries/{id}/employee`.
      required: [employeeUserId]
      properties:
        employeeUserId:
          type: string

    RosterSwapInput:
      type: object
      description: Body of `POST /roster/entries/{id}/swap`. The dragged entry is named by the URL; this names the other side.
      required: [otherEntryId]
      properties:
        otherEntryId:
          type: string

    RosterLockInput:
      type: object
      description: Body of `PATCH /roster/entries/{id}/lock`.
      required: [locked]
      properties:
        locked:
          type: boolean

    RosterCoverageWarning:
      type: object
      description: >
        One `(staffArea, date)` below its `StaffAreaCoverageRule.minimumWorking` - a warning, never a
        reason a roster can't be saved. `workingCount` counts active employees whose own
        `User.staffArea` is this area and who have a `countsAsWorked` entry that day - the area of
        the person, not of the shift code (a shared code has none).
      required: [staffArea, date, workingCount, minimumWorking]
      properties:
        staffArea:
          $ref: "#/components/schemas/StaffArea"
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        workingCount:
          type: integer
        minimumWorking:
          type: integer

    RosterCopyInput:
      type: object
      description: Body of `POST /roster/copy`. Leave both source dates out to copy the whole previous month.
      required: [year, month]
      properties:
        year:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
        sourceFrom:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: First source date (inclusive). Give both or neither.
        sourceTo:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Last source date (inclusive).

    RosterCopyResult:
      type: object
      required: [month, sourceFrom, sourceTo, created, skippedExisting, skippedNoCurrentCode]
      properties:
        month:
          $ref: "#/components/schemas/RosterMonth"
        sourceFrom:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        sourceTo:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: The last source date actually used - the range cut down to whole weeks.
        created:
          type: integer
        skippedExisting:
          type: integer
          description: Target cells that already had an entry and were left alone.
        skippedNoCurrentCode:
          type: integer
          description: Cells whose shift code has no version in force on the target date.

    RosterMonth:
      type: object
      description: Response of `GET /roster` and `POST /roster/generate`.
      required: [year, month, entries, employees, coverageWarnings]
      properties:
        year:
          type: integer
        month:
          type: integer
        entries:
          type: array
          items:
            $ref: "#/components/schemas/RosterEntry"
        employees:
          type: array
          items:
            $ref: "#/components/schemas/RosterEmployee"
        coverageWarnings:
          type: array
          items:
            $ref: "#/components/schemas/RosterCoverageWarning"

    StaffAreaCoverageRule:
      type: object
      required: [staffArea, minimumWorking, updatedByEmail, updatedAt]
      properties:
        staffArea:
          $ref: "#/components/schemas/StaffArea"
        minimumWorking:
          type: integer
        updatedByEmail:
          type: string
        updatedAt:
          type: string
          format: date-time

    StaffAreaCoverageRuleInput:
      type: object
      description: Body of `PUT /staff-area-coverage-rules/{staffArea}`.
      required: [minimumWorking]
      properties:
        minimumWorking:
          type: integer
          minimum: 0

    RosterImportNameEntry:
      type: object
      description: >
        One distinct name found in the sheet (trimmed, internal whitespace collapsed - nothing
        more) and how it currently resolves. Names are never matched automatically - `mapped:
        false` means a person must map this one, via `POST /roster/import/name-mappings`, before
        `POST /roster/import/commit` can succeed.
      required: [rawName, occurrences, mapped]
      properties:
        rawName:
          type: string
        occurrences:
          type: integer
          description: How many day-cells in the sheet belong to this name - context for how much a wrong mapping would affect.
        mapped:
          type: boolean
        employeeUserId:
          type: string
          nullable: true
          description: Set when `mapped` is true - either a previously-remembered mapping, or one already given in this session.
        employeeName:
          type: string
          nullable: true
        suggestedStaffArea:
          allOf:
            - $ref: "#/components/schemas/StaffArea"
          nullable: true
          description: >
            The department this name's row sits under. Shown for context on every name, and - for
            a name resolved by creating a new account (`POST /roster/import/name-mappings` with
            `newEmployeeName`) - sent back as that same call's own `staffArea`, becoming
            `User.staffArea`. Still never fabricates an `EmployeePattern` (see that schema's own
            description): the area is a fact about the person, not part of a generation pattern,
            so it needs none of a pattern's other fields to be set. Null only if the department
            header above this row couldn't itself be recognised, in which case this row also
            carries an entry in `issues`.

    RosterImportCodeEntry:
      type: object
      description: >
        One distinct code found in the sheet, and how it currently resolves to a `ShiftCode`.
        Grouped by text alone (plus `fillColor` for the ambiguous "9") - never by area. Which
        `ShiftCode` a code text actually means for a given cell is resolved separately, per area,
        at commit time (`ShiftCodeService#resolveActive`); what this entry reports is the one fact
        that's the same everywhere in the file - "9" means exactly two things, told apart by
        colour, not one pair per department.
      required: [rawCode, occurrences, resolved]
      properties:
        rawCode:
          type: string
        fillColor:
          allOf:
            - $ref: "#/components/schemas/FillColor"
          nullable: true
          description: Set only for the ambiguous "9" - see `FillColor`'s own description. Every other code is read by text alone.
        occurrences:
          type: integer
        resolved:
          type: boolean
        shiftCodeDescription:
          type: string
          nullable: true
          description: The resolved `ShiftCode`'s own hours (e.g. "07:00-16:00", "Open Schedule") - set only when `resolved` is true.

    RosterImportIssue:
      type: object
      description: A cell (or, with `cellRef` absent, the sheet as a whole) that could not be read, and why. Blocks commit while any exist.
      required: [message]
      properties:
        cellRef:
          type: string
          nullable: true
        message:
          type: string

    RosterImportCollision:
      type: object
      description: >
        A cell whose date already has a `RosterEntry` for that employee. Never overwritten - the
        import always skips these and reports them here, the same way `POST /roster/entries`
        itself refuses a second entry on an occupied date rather than replacing it. Resolving a
        collision, if the new value should actually win, means clearing or editing the existing
        entry by hand (in the ordinary roster grid) and re-running the import.
      required: [employeeName, date, existingShiftCodeDescription, newShiftCodeDescription]
      properties:
        employeeName:
          type: string
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        existingShiftCodeDescription:
          type: string
        newShiftCodeDescription:
          type: string

    RosterImportPreview:
      type: object
      description: >
        Response of `POST /roster/import/preview` - a dry run. Nothing is written by this call,
        not even a remembered mapping; it only reports what parsing the file, as it stands right
        now, would do. `canCommit` is true only once every name is mapped, every ambiguous "9" is
        resolved, and `issues` is empty.
      required: [importId, year, month, names, codes, issues, collisions, entriesToCreate, canCommit]
      properties:
        importId:
          type: string
          description: Opaque reference to this file, held server-side - pass back to `POST /roster/import/commit` once `canCommit` is true.
        year:
          type: integer
        month:
          type: integer
        names:
          type: array
          items:
            $ref: "#/components/schemas/RosterImportNameEntry"
        codes:
          type: array
          items:
            $ref: "#/components/schemas/RosterImportCodeEntry"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/RosterImportIssue"
        collisions:
          type: array
          items:
            $ref: "#/components/schemas/RosterImportCollision"
        entriesToCreate:
          type: integer
          description: How many `RosterEntry` rows committing right now would actually create - excludes collisions and anything still unresolved.
        canCommit:
          type: boolean

    RosterImportNameMappingInput:
      type: object
      description: >
        Body of `POST /roster/import/name-mappings`. Exactly one of `employeeUserId` (map to an
        existing account) or `newEmployeeName` (create a no-login account on the spot) must be
        given - never both, never neither.
      required: [rawName]
      properties:
        rawName:
          type: string
        employeeUserId:
          type: string
        newEmployeeName:
          type: string
        staffArea:
          $ref: "#/components/schemas/StaffArea"
          description: >
            Meaningful only with `newEmployeeName` - the new account's `User.staffArea` (see that
            field's own description). Send `RosterImportNameEntry.suggestedStaffArea` back here;
            ignored when mapping to an existing account, which already has (or lacks) its own.

    RosterImportNameMappingResult:
      type: object
      required: [rawName, employeeUserId, employeeName]
      properties:
        rawName:
          type: string
        employeeUserId:
          type: string
        employeeName:
          type: string

    RosterImportColorMappingInput:
      type: object
      description: >
        Body of `POST /roster/import/color-mappings`. Not scoped to an area - which code text a
        colour means is the same fact everywhere in the file (see `RosterImportShiftColorMapping`'s
        own description on the backend); `shiftCodeId` just needs to be an already-existing,
        active `ShiftCode` whose own shape (single interval or two) actually matches `fillColor`.
      required: [rawCode, fillColor, shiftCodeId]
      properties:
        rawCode:
          type: string
        fillColor:
          $ref: "#/components/schemas/FillColor"
        shiftCodeId:
          type: string

    RosterImportColorMappingResult:
      type: object
      required: [rawCode, fillColor, resolvedCode]
      properties:
        rawCode:
          type: string
        fillColor:
          $ref: "#/components/schemas/FillColor"
        resolvedCode:
          type: string

    RosterImportCommitInput:
      type: object
      description: Body of `POST /roster/import/commit`.
      required: [importId]
      properties:
        importId:
          type: string

    RosterImportResult:
      type: object
      description: Response of `POST /roster/import/commit`.
      required: [year, month, created, skippedCollisions]
      properties:
        year:
          type: integer
        month:
          type: integer
        created:
          type: integer
        skippedCollisions:
          type: integer

    RosterGridImportDiffRow:
      type: object
      description: >
        One `(employeeUserId, date)` cell where the uploaded file disagrees with the current
        `RosterEntry` state. Unchanged cells are never listed here, only counted
        (`RosterGridImportPreview.unchangedCount`) - see that schema's own description for why a
        full re-sync, not a wholesale replace, is how this import behaves.
      required: [employeeUserId, employeeName, date, changeType, resolution, lockedConflict, staleSinceExport]
      properties:
        employeeUserId:
          type: string
        employeeName:
          type: string
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        changeType:
          type: string
          enum: [ADD, REMOVE, CHANGE]
          description: "ADD: blank in the DB, coded in the file. REMOVE: coded in the DB, blank in the file. CHANGE: coded differently in each."
        previousCode:
          type: string
          nullable: true
          description: The current `RosterEntry`'s own `ShiftCode.code` - set for REMOVE and CHANGE, absent for ADD.
        newCode:
          type: string
          nullable: true
          description: The file cell's code text - set for ADD and CHANGE, absent for REMOVE.
        resolution:
          type: string
          enum: [POSITIONAL, FALLBACK_NAME, FALLBACK_CODE, FALLBACK_BOTH]
          description: >
            POSITIONAL: both the employee row and this exact cell matched the export's own hidden
            metadata - no name or code text was ever compared. FALLBACK_NAME/FALLBACK_CODE/
            FALLBACK_BOTH: the row and/or this cell has no matching metadata (added or retyped by
            hand since export), so that side resolved the ordinary way instead - by name against
            `/roster/import/name-mappings`, and/or by matching `newCode` against an active
            `ShiftCode` for this employee's area.
        lockedConflict:
          type: boolean
          description: >
            True when this is a REMOVE or CHANGE and the existing `RosterEntry` has `locked: true`
            - `POST /roster/grid-import/commit` never touches this row regardless of the file, and
            counts it in `skippedLocked`. Never true for ADD (nothing existing to lock).
        staleSinceExport:
          type: boolean
          description: >
            True when the existing `RosterEntry` (for REMOVE/CHANGE) was created or modified after
            this file's own `RosterGridImportPreview.exportedAt` - the file may not know about a
            change made through the ordinary roster grid after it was exported. Never blocks
            commit on its own; list it in `RosterGridImportCommitInput.excludeCells` to skip it.
            Never true for ADD.
        pendingRetiredCodeId:
          type: string
          nullable: true
          description: Set when `newCode` resolves, by metadata, to a `ShiftCode` id listed in `RosterGridImportPreview.retiredCodes` - resolve that entry before this row can be applied.
        pendingUnknownCode:
          type: boolean
          description: True when `newCode` has no metadata and matches no active `ShiftCode` - listed in `RosterGridImportPreview.unknownCodes`, needs a definition before this row can be applied.

    RosterGridImportRetiredCode:
      type: object
      description: >
        A `ShiftCode` id named by the file's own metadata that no longer resolves to an *active*
        row - superseded by a later `POST /shift-codes` call for the same `(staffArea, code)` since
        this file was exported (see `ShiftCode`'s own "never updated, editing = a new row"
        description). Every field here is read straight from the metadata the export wrote for
        that id at export time, verbatim - nothing here is a guess. Resolve by sending back a
        `RosterGridImportRetiredCodeResolution` with the same `shiftCodeId`, editing any field
        first if the world has genuinely moved on since export.
      required: [shiftCodeId, code, kind, countsAsWorked, isPaid, effectiveFrom, occurrences]
      properties:
        shiftCodeId:
          type: string
          description: The old, no-longer-active id - echo this back in `RosterGridImportRetiredCodeResolution.shiftCodeId` to resolve it.
        staffArea:
          $ref: "#/components/schemas/StaffArea"
        code:
          type: string
        kind:
          $ref: "#/components/schemas/ShiftCodeKind"
        startTime1:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        endTime1:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        startTime2:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        endTime2:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        countsAsWorked:
          type: boolean
        isPaid:
          type: boolean
        effectiveFrom:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: The retired row's own original effectiveFrom - informational only, since recreating it always uses today's date instead.
        displayColor:
          type: string
          nullable: true
        occurrences:
          type: integer
          description: How many rows in `RosterGridImportPreview.diffRows` are waiting on this one resolution.

    RosterGridImportUnknownCode:
      type: object
      description: >
        A code found in the file with no export metadata at all for this cell - the row and/or
        the code text were added or retyped by hand after export, and this exact text has no
        active `ShiftCode` for this area either. There is nothing to prefill from - resolve with a
        `RosterGridImportUnknownCodeResolution` carrying a full new definition, the same fields
        `POST /shift-codes` itself takes.
      required: [rawCode, occurrences]
      properties:
        rawCode:
          type: string
        staffArea:
          allOf:
            - $ref: "#/components/schemas/StaffArea"
          nullable: true
          description: The area of the row(s) this code text was found on - null only if that row's own department couldn't be determined.
        occurrences:
          type: integer

    RosterGridImportRetiredCodeResolution:
      type: object
      description: >
        One item of `RosterGridImportCommitInput.retiredCodeResolutions`, resolving one
        `RosterGridImportRetiredCode` by recreating it (`POST /shift-codes`, under the hood) with
        these fields - normally an unedited copy of that entry, but every field is editable before
        confirming, in case the reason it needed recreating is that something about it was wrong.
      required: [shiftCodeId, code, kind, countsAsWorked, isPaid, effectiveFrom]
      properties:
        shiftCodeId:
          type: string
          description: The old id from `RosterGridImportRetiredCode.shiftCodeId` this resolves.
        staffArea:
          $ref: "#/components/schemas/StaffArea"
        code:
          type: string
        kind:
          $ref: "#/components/schemas/ShiftCodeKind"
        startTime1:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        endTime1:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        startTime2:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        endTime2:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        countsAsWorked:
          type: boolean
        isPaid:
          type: boolean
        effectiveFrom:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        displayColor:
          type: string
          nullable: true

    RosterGridImportUnknownCodeResolution:
      type: object
      description: One item of `RosterGridImportCommitInput.unknownCodeResolutions`, resolving one `RosterGridImportUnknownCode` by defining it from scratch (`POST /shift-codes`, under the hood).
      required: [rawCode, code, kind, countsAsWorked, isPaid, effectiveFrom]
      properties:
        rawCode:
          type: string
          description: The `RosterGridImportUnknownCode.rawCode` this resolves.
        staffArea:
          $ref: "#/components/schemas/StaffArea"
        code:
          type: string
          description: The `ShiftCode.code` to create - normally the same text as `rawCode`, but editable.
        kind:
          $ref: "#/components/schemas/ShiftCodeKind"
        startTime1:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        endTime1:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        startTime2:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        endTime2:
          type: string
          nullable: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        countsAsWorked:
          type: boolean
        isPaid:
          type: boolean
        effectiveFrom:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        displayColor:
          type: string
          nullable: true
          description: Left null starts the code with no display color, same as `POST /shift-codes` - set later via `PATCH /shift-codes/{id}/display-color` if wanted.

    RosterGridImportExcludedCell:
      type: object
      required: [employeeUserId, date]
      properties:
        employeeUserId:
          type: string
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'

    RosterGridImportPreview:
      type: object
      description: >
        Response of `POST /roster/grid-import/preview` - a dry run, nothing written. Sync
        semantics, not wholesale replace: `diffRows` lists only the `(employeeUserId, date)` cells
        where the file disagrees with the current `RosterEntry` state, classified ADD/REMOVE/
        CHANGE; `unchangedCount` is everything else in the file's own date range, confirmed
        identical. `canCommit` is true only once `unmatchedEmployees`, `retiredCodes`, and
        `unknownCodes` are all empty - a `lockedConflict` or `staleSinceExport` diff row never
        blocks it (see `RosterGridImportDiffRow`'s own description of each).
      required: [importId, year, month, exportedAt, diffRows, addCount, removeCount, changeCount, unchangedCount, staleCount, lockedConflictCount, unmatchedEmployees, retiredCodes, unknownCodes, canCommit]
      properties:
        importId:
          type: string
          description: Opaque reference to this file, held server-side - pass back to `POST /roster/grid-import/commit`.
        year:
          type: integer
        month:
          type: integer
        exportedAt:
          type: string
          format: date-time
          description: This file's own export timestamp, read from its hidden metadata sheet - shown so the admin can judge how stale it might be.
        diffRows:
          type: array
          items:
            $ref: "#/components/schemas/RosterGridImportDiffRow"
        addCount:
          type: integer
        removeCount:
          type: integer
        changeCount:
          type: integer
        unchangedCount:
          type: integer
        staleCount:
          type: integer
          description: 'How many rows in `diffRows` have `staleSinceExport: true`.'
        lockedConflictCount:
          type: integer
          description: 'How many rows in `diffRows` have `lockedConflict: true`.'
        unmatchedEmployees:
          type: array
          items:
            $ref: "#/components/schemas/RosterImportNameEntry"
          description: A row in the file with no matching employee in the metadata sheet, and no exact-name match either - resolve exactly like the hand-built importer's own name entries, via `POST /roster/import/name-mappings`.
        retiredCodes:
          type: array
          items:
            $ref: "#/components/schemas/RosterGridImportRetiredCode"
        unknownCodes:
          type: array
          items:
            $ref: "#/components/schemas/RosterGridImportUnknownCode"
        canCommit:
          type: boolean

    RosterGridImportCommitInput:
      type: object
      description: Body of `POST /roster/grid-import/commit`.
      required: [importId]
      properties:
        importId:
          type: string
        retiredCodeResolutions:
          type: array
          items:
            $ref: "#/components/schemas/RosterGridImportRetiredCodeResolution"
        unknownCodeResolutions:
          type: array
          items:
            $ref: "#/components/schemas/RosterGridImportUnknownCodeResolution"
        excludeCells:
          type: array
          items:
            $ref: "#/components/schemas/RosterGridImportExcludedCell"
          description: Non-locked cells to leave untouched even though the file's diff would otherwise apply them - typically ones flagged `staleSinceExport`. A locked cell is already always excluded and never needs to be listed here.

    RosterGridImportResult:
      type: object
      description: Response of `POST /roster/grid-import/commit`.
      required: [year, month, created, removed, changed, skippedLocked, skippedExcluded, createdShiftCodes]
      properties:
        year:
          type: integer
        month:
          type: integer
        created:
          type: integer
        removed:
          type: integer
        changed:
          type: integer
        skippedLocked:
          type: integer
        skippedExcluded:
          type: integer
        createdShiftCodes:
          type: integer
          description: New `ShiftCode` rows created via `retiredCodeResolutions`/`unknownCodeResolutions` during this commit.

    AttendancePunch:
      type: object
      description: >
        One raw clock-in or clock-out - not a paired session. A split shift's four punches are
        simply four rows; pairing consecutive `IN`/`OUT` punches into worked intervals happens
        at read time (`GET /attendance/summary`), never at write time, so nothing here needs to
        know in advance whether a day is a single shift, a split, or `OP`. `employeeEmail` is
        null for a no-login account (see `UserCreateInput`) - attendance exists specifically for
        staff who punch in and out without ever signing into this system, so `employeeName` is
        the field to display, never absent.
      required: [id, employeeUserId, employeeName, punchAt, direction, source, createdAt]
      properties:
        id:
          type: string
        employeeUserId:
          type: string
        employeeName:
          type: string
        employeeEmail:
          type: string
        punchAt:
          type: string
          format: date-time
        direction:
          $ref: "#/components/schemas/PunchDirection"
        source:
          $ref: "#/components/schemas/PunchSource"
        recordedByEmail:
          type: string
          nullable: true
          description: Who typed this in, for a `MANUAL` punch. Null for `SCANNER`.
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    AttendancePunchCreateInput:
      type: object
      description: Body of `POST /attendance`.
      required: [employeeUserId, punchAt, direction]
      properties:
        employeeUserId:
          type: string
        punchAt:
          type: string
          format: date-time
        direction:
          $ref: "#/components/schemas/PunchDirection"
        note:
          type: string
          nullable: true

    AttendanceDevice:
      type: object
      description: >
        A fingerprint terminal (ZKTeco K60, TCP/IP port 4370) the server polls for its attendance
        log - the device never calls us. That direction is deliberate: there is no inbound
        endpoint this API exposes for a device to push to, so nothing on the internet, or even
        elsewhere on the hotel's own network, can reach the terminal or masquerade as it. The
        server needs only outbound reachability to `address:port` on the local network; deploying
        this feature adds no new attack surface to defend, unlike a push design, which would need
        an authenticated inbound listener. `lastSeenAt` is set on every successful poll and is not
        merely informational - a terminal that quietly stopped reporting looks, in the punch data
        alone, exactly like a month in which nobody worked, so a long gap here is the one signal
        that tells the difference.
      required: [id, name, serial, address, port, timezone, active, createdAt, windowedReadUnsupported]
      properties:
        id:
          type: string
        name:
          type: string
        serial:
          type: string
          description: The device's own serial number - unique, so the same physical unit can't be registered twice.
        address:
          type: string
          description: IP address or hostname on the hotel's local network.
        port:
          type: integer
          description: Almost always 4370 on real hardware.
        timezone:
          type: string
          description: >
            IANA zone id (e.g. `Asia/Bangkok`) for the device's own clock - not necessarily this
            server's. Set on every successful poll to match this server's clock, so drift never
            accumulates, but read here in the device's own zone for any punch read before that
            write lands.
        active:
          type: boolean
          description: Whether this device is currently polled. A retired or replaced device is deactivated, not deleted, once it has ever produced a punch.
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
          description: When this device was last successfully polled. Null if it has never been reached.
        windowedReadUnsupported:
          type: boolean
          description: >
            True if the most recent poll that actually tried a windowed read found this device
            rejecting it, so every poll since has been reading the entire log instead of a window
            - set from what the device answered, never a configuration guess, and cleared the
            moment a later poll succeeds with a window. False both when the device supports
            windowed reads and when no poll has tested it yet (a brand new device's first poll is
            always a full read regardless of support).
        createdAt:
          type: string
          format: date-time

    AttendanceDeviceInput:
      type: object
      description: Full replacement on PATCH — no partial update (same convention as `PrinterInput`).
      required: [name, serial, address, timezone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        serial:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: string
          minLength: 1
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 4370
        timezone:
          type: string
          minLength: 1
          maxLength: 100
        active:
          type: boolean
          default: true

    ShiftInterval:
      type: object
      required: [startTime, endTime]
      properties:
        startTime:
          type: string
        endTime:
          type: string

    AttendanceDaySummary:
      type: object
      description: >
        One day of `GET /attendance/summary`. `shiftCode` is null on a day with no `RosterEntry`
        (a day off) - distinct from `OP`, which has a `shiftCode` but an empty `plannedIntervals`,
        so a day genuinely without a plan is never shown as "0 minutes planned" next to one that
        was deliberately left open. `incomplete` is true when this day's punches don't pair off
        evenly (an odd count) - closed only by recording another punch with a note through
        `POST /attendance`, never inferred.
      required: [date, plannedIntervals, punches, incomplete]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        shiftCode:
          allOf: [{ $ref: "#/components/schemas/ShiftCode" }]
          nullable: true
        plannedIntervals:
          type: array
          items:
            $ref: "#/components/schemas/ShiftInterval"
        punches:
          type: array
          items:
            $ref: "#/components/schemas/AttendancePunch"
        workedMinutes:
          type: integer
          nullable: true
          description: Null when there are no punches yet for this day, not zero.
        incomplete:
          type: boolean

    TodayShiftState:
      type: string
      description: >
        Where one employee stands against their own shift, right now - `GET /attendance/today`.
        Computed live from today's `ShiftCode` interval(s) plus the same punch pairing
        `GET /attendance/summary` and the roster actuals export already use
        (`AttendancePunchPairing`) - never precomputed or cached, since every value here is only
        true as of this instant.


        `OPEN_SCHEDULE` (`OP`) has no fixed interval, so it only ever takes three of these values
        - `NOT_YET_ARRIVED`, `ON_SHIFT`, `FINISHED` - the rest apply only to a fixed-interval code.
        `NOT_YET_ARRIVED`: no punches yet today. `ON_SHIFT`: a trailing unmatched `IN` punch -
        currently clocked in, for either shape. `FINISHED`: every applicable interval satisfied by
        a complete pair (or, for `OP`, at least one complete pair), no trailing unmatched `IN`.
        `SCHEDULED`: more than the configured upcoming-window away from the current interval's own
        start, not yet arrived. `ARRIVING_SOON`: inside that window, not yet arrived. `LATE`: at
        or past the interval's own start but still at or before its own end, not yet arrived -
        could still show up. `MISSED`: past the interval's own end with zero punches matched to
        it - the same fact the actuals export's "Late & anomalies" sheet already calls `MISSED`,
        just observed live instead of at month-end. `BETWEEN_SHIFTS`: a split shift only -
        interval 1 already complete, well before interval 2's own upcoming-window opens; kept
        distinct from `SCHEDULED` so someone who has already shown up once today never reads as
        indistinguishable from someone who hasn't shown up at all.
      enum: [NOT_YET_ARRIVED, ON_SHIFT, FINISHED, SCHEDULED, ARRIVING_SOON, LATE, BETWEEN_SHIFTS, MISSED]

    TodayShiftStatus:
      type: object
      description: >
        One employee's live status on `GET /attendance/today` - "who's on shift right now", not
        "who's scheduled this month" (`GET /attendance/summary`) or "what actually happened last
        month" (`GET /roster/actuals-export`). Employees with a `countsAsWorked` `RosterEntry` for
        today appear; an `ABSENCE`-kind entry (`PH` and the like) is absent from this list, the
        same "a day off is the absence of a row" convention `RosterEntry` itself already uses for
        the roster grid. The one addition: an employee with no `RosterEntry` at all today who has
        nevertheless punched today appears as if rostered on the active `OP` code for their staff
        area (`unscheduled: true`) - they are demonstrably working, and an open schedule is the one
        code that claims nothing about when. Display-time only: no `RosterEntry` is written, so the
        roster, its coverage counts and the planned side of every attendance report stay exactly
        what a manager planned. If no active `OP` code exists for their area (or area-less), they
        are left out rather than shown under an invented code.

        `referenceTime` is deliberately one raw timestamp whose meaning switches with `state`, not
        a pre-formatted "in 23 minutes" string - the frontend derives (and re-derives, every poll
        tick) the relative time itself, so it never goes stale between polls on its own:
        `SCHEDULED`/`ARRIVING_SOON`/`LATE`/`BETWEEN_SHIFTS`/`MISSED` carry the current interval's
        own expected start time, today; `ON_SHIFT` carries the actual punch time of the trailing
        unmatched `IN`; `FINISHED` carries the punch time of the last completed pair's `OUT`;
        `NOT_YET_ARRIVED` carries nothing - there is genuinely nothing to report yet.
      required: [employeeUserId, employeeName, shiftCode, state]
      properties:
        employeeUserId:
          type: string
        employeeName:
          type: string
        staffArea:
          allOf: [{ $ref: "#/components/schemas/StaffArea" }]
          nullable: true
        shiftCode:
          $ref: "#/components/schemas/ShiftCode"
        state:
          $ref: "#/components/schemas/TodayShiftState"
        referenceTime:
          type: string
          format: date-time
          nullable: true
        unscheduled:
          type: boolean
          description: >
            True when this row has no `RosterEntry` behind it - the employee punched today without
            being rostered, and `shiftCode` is the `OP` fallback described above, not a plan.
            Always present; false for every rostered row.

    ServerTime:
      type: object
      description: >
        `GET /attendance/server-time` - the server's own idea of "now", read straight off the
        injected `Clock` bean (`ClockConfig`). A diagnostic snapshot, not a ticking clock: the
        frontend fetches this once per page load and renders it statically.
      required: [now, zone]
      properties:
        now:
          type: string
          format: date-time
          description: The clock's current instant, rendered in its own zone's offset.
        zone:
          type: string
          description: The clock's zone id, e.g. "Asia/Bangkok".

    EmployeePayRate:
      type: object
      description: >
        One version of an employee's daily rate - never edited, only superseded, the same
        "agreed terms are frozen" shape as `ShiftCode` and `BookingSegmentNightlyRate`, so a
        rate change partway through a month prices each day correctly against whichever rate
        was actually in effect that day.
      required: [id, employeeUserId, employeeName, dailyRate, effectiveFrom, createdByEmail, createdAt]
      properties:
        id:
          type: string
        employeeUserId:
          type: string
        employeeName:
          type: string
        employeeEmail:
          type: string
        dailyRate:
          type: string
          description: Decimal(10,2) rendered as a string.
        effectiveFrom:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        createdByEmail:
          type: string
        createdAt:
          type: string
          format: date-time

    EmployeePayRateCreateInput:
      type: object
      description: Body of `POST /employee-pay-rates`.
      required: [employeeUserId, dailyRate, effectiveFrom]
      properties:
        employeeUserId:
          type: string
        dailyRate:
          type: string
        effectiveFrom:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'

    NightAudit:
      type: object
      description: '`GET /night-audit` - see that operation for what each list contains.'
      required: [date, missedArrivals, missedDepartures, snapshot, closure]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        missedArrivals:
          type: array
          description: Sorted by `checkIn`, oldest first.
          items:
            $ref: "#/components/schemas/NightAuditBooking"
        missedDepartures:
          type: array
          description: Sorted by `checkOut`, oldest first.
          items:
            $ref: "#/components/schemas/NightAuditBooking"
        snapshot:
          $ref: "#/components/schemas/OccupancyReportRow"
        closure:
          nullable: true
          description: This date's closure, or null if nobody has closed it yet.
          allOf:
            - $ref: "#/components/schemas/NightAuditClosure"

    NightAuditBooking:
      type: object
      description: One booking on a night-audit list - just enough to recognise it and open it.
      required: [id, guestName, roomName, roomUnitLabel, checkIn, checkOut, status, occupancyStatus]
      properties:
        id:
          type: string
        guestName:
          type: string
          x-sensitive: true
        roomName:
          type: string
          description: The room type's name.
        roomUnitLabel:
          type: string
          nullable: true
          description: The assigned physical room's label, or null if none is assigned.
        checkIn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        checkOut:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        status:
          $ref: "#/components/schemas/BookingStatus"
        occupancyStatus:
          $ref: "#/components/schemas/OccupancyStatus"

    NightAuditClosure:
      type: object
      description: The record that one hotel-local date was reviewed and closed.
      required: [date, closedByUserId, closedByName, closedAt, notes]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        closedByUserId:
          type: string
        closedByName:
          type: string
          description: The closing user's current `User.name`, read live - a rename relabels past closures too.
        closedAt:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true

    NightAuditCloseInput:
      type: object
      description: Body of `POST /night-audit/close`.
      required: [date]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        notes:
          type: string
          nullable: true
          maxLength: 2000
          description: Optional free text. Blank is stored as null.

    OccupancyReport:
      type: object
      description: '`GET /reports/occupancy` - see that operation for how each figure is computed.'
      required: [from, to, nights, rooms, total]
      properties:
        from:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        to:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        nights:
          type: integer
          description: Number of nights in the range (`to` - `from` + 1).
        rooms:
          type: array
          description: One row per room type, sorted by name.
          items:
            $ref: "#/components/schemas/OccupancyReportRow"
        total:
          $ref: "#/components/schemas/OccupancyReportRow"

    OccupancyReportRow:
      type: object
      description: >
        One room type's figures, or the property total (where `roomId`/`roomName` are null).
        Money is a decimal string with two decimals.
      required: [roomId, roomName, activeUnits, roomNightsAvailable, roomNightsSold, occupancyPercent, roomRevenue, adr, revpar]
      properties:
        roomId:
          type: string
          nullable: true
        roomName:
          type: string
          nullable: true
        activeUnits:
          type: integer
          description: Physical units of this type active today - see the operation's note on why this is today's count.
        roomNightsAvailable:
          type: integer
        roomNightsSold:
          type: integer
        occupancyPercent:
          type: string
          nullable: true
          description: sold / available × 100, two decimals (e.g. "66.67"). Null when nothing was available.
        roomRevenue:
          type: string
        adr:
          type: string
          nullable: true
          description: Room revenue / room-nights sold. Null when nothing was sold.
        revpar:
          type: string
          nullable: true
          description: Room revenue / room-nights available. Null when nothing was available.

    PosSalesMixReport:
      type: object
      description: '`GET /reports/pos-sales-mix` - see that operation for what counts.'
      required: [from, to, totalQuantity, totalRevenue, items, categories, departments]
      properties:
        from:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        to:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        totalQuantity:
          type: integer
        totalRevenue:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PosSalesMixItem"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/PosSalesMixCategory"
        departments:
          type: array
          items:
            $ref: "#/components/schemas/PosSalesMixDepartment"

    PosSalesMixItem:
      type: object
      required: [menuItemId, name, category, department, quantity, revenue]
      properties:
        menuItemId:
          type: string
        name:
          type: string
        category:
          type: string
        department:
          $ref: "#/components/schemas/MenuDepartment"
        quantity:
          type: integer
        revenue:
          type: string

    PosSalesMixCategory:
      type: object
      required: [category, quantity, revenue]
      properties:
        category:
          type: string
        quantity:
          type: integer
        revenue:
          type: string

    PosSalesMixDepartment:
      type: object
      required: [department, quantity, revenue]
      properties:
        department:
          $ref: "#/components/schemas/MenuDepartment"
        quantity:
          type: integer
        revenue:
          type: string

    TopProductionReport:
      type: object
      description: '`GET /reports/top-production` - see that operation for what counts.'
      required: [from, to, producers, total]
      properties:
        from:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        to:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        producers:
          type: array
          description: One row per producer with at least one room-night in the range, most room-nights first.
          items:
            $ref: "#/components/schemas/TopProductionRow"
        total:
          $ref: "#/components/schemas/TopProductionRow"

    TopProductionRow:
      type: object
      description: >
        One producer's figures, or the total (where `producer`/`label` are null). Money is a
        decimal string with two decimals.
      required: [producer, label, roomNights, roomNightsPercent, revenue, revenuePercent, adr]
      properties:
        producer:
          type: string
          nullable: true
          description: >
            A `BookingChannel` value, or `COMPLIMENTARY` / `HOUSE_USE` for a booking with that
            `purpose` (whatever its channel). Null on the total row.
        label:
          type: string
          nullable: true
          description: Display name, e.g. "Booking.com", "Complimentary". Null on the total row.
        roomNights:
          type: integer
        roomNightsPercent:
          type: string
          nullable: true
          description: Share of the total's room-nights × 100, two decimals. Null when the total is zero.
        revenue:
          type: string
        revenuePercent:
          type: string
          nullable: true
          description: Share of the total's revenue × 100, two decimals. Null when the total is zero.
        adr:
          type: string
          nullable: true
          description: Revenue / room-nights. Null when no room-night was sold.

    MarketSegment:
      type: string
      enum: [COM, DIR, HFO, OTA, OTH, WLK]
      description: >
        `COM` complimentary, `DIR` direct (`DIRECT`/`PHONE`), `HFO` house use, `OTA` online
        travel agents (including a SiteMinder-imported `OTHER`), `OTH` other / not recorded (a
        staff-entered `OTHER` booking), `WLK` walk-in. Derived from a booking's
        `purpose` and `channel`, never stored - see `GET /reports/market-segment`.

    MarketSegmentReport:
      type: object
      description: '`GET /reports/market-segment` - see that operation for what counts.'
      required: [from, to, segments, total]
      properties:
        from:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        to:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        segments:
          type: array
          description: Always all six segments, in the order COM, DIR, HFO, OTA, OTH, WLK.
          items:
            $ref: "#/components/schemas/MarketSegmentRow"
        total:
          $ref: "#/components/schemas/MarketSegmentRow"

    MarketSegmentRow:
      type: object
      description: One segment's figures, or the total (where `segment` is null). Money is a decimal string with two decimals.
      required: [segment, roomNights, roomNightsPercent, guests, guestsPercent, revenue, revenuePercent, averageRate]
      properties:
        segment:
          $ref: "#/components/schemas/MarketSegment"
          nullable: true
        roomNights:
          type: integer
        roomNightsPercent:
          type: string
          nullable: true
          description: Share of the total's room-nights × 100, two decimals. Null when the total is zero.
        guests:
          type: integer
          description: '`adults + children` over the distinct bookings with a night in the range.'
        guestsPercent:
          type: string
          nullable: true
          description: Share of the total's guests × 100, two decimals. Null when the total is zero.
        revenue:
          type: string
        revenuePercent:
          type: string
          nullable: true
          description: Share of the total's revenue × 100, two decimals. Null when the total is zero.
        averageRate:
          type: string
          nullable: true
          description: Revenue / room-nights. Null when no room-night was sold.

    InHouseReport:
      type: object
      description: '`GET /reports/in-house` - see that operation for who is listed.'
      required: [date, rooms, total]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        rooms:
          type: array
          description: One row per occupied room, sorted by room label, unassigned last.
          items:
            $ref: "#/components/schemas/InHouseRow"
        total:
          $ref: "#/components/schemas/InHouseTotal"

    InHouseRow:
      type: object
      description: One occupied room on the in-house list.
      required: [bookingId, roomName, roomUnitLabel, adults, children, guestName, marketSegment, arrival, departure]
      properties:
        bookingId:
          type: string
          description: The reservation reference.
        roomName:
          type: string
          description: The room type's name.
        roomUnitLabel:
          type: string
          nullable: true
          description: The physical room's label, or null if none is assigned to tonight's segment.
        adults:
          type: integer
        children:
          type: integer
        guestName:
          type: string
          x-sensitive: true
        marketSegment:
          $ref: "#/components/schemas/MarketSegment"
        arrival:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: The booking's `checkIn`.
        departure:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: The booking's `checkOut`.
        overdueDays:
          type: integer
          description: >
            How many days past `checkOut` a still-`CHECKED_IN` guest is (`0` when not overdue).
            The one rule for this lives in `OverstayRule` - an overdue guest is still in the house
            and still occupies their room tonight, on every screen. Same figure the night audit's
            missed departures show.

    InHouseTotal:
      type: object
      required: [rooms, adults, children]
      properties:
        rooms:
          type: integer
        adults:
          type: integer
        children:
          type: integer

    ManagerReport:
      type: object
      description: '`GET /reports/manager` - see that operation for how each figure is computed.'
      required: [date, lastYearDate, today, lastYear]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        lastYearDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        today:
          $ref: "#/components/schemas/ManagerReportDay"
        lastYear:
          $ref: "#/components/schemas/ManagerReportDay"

    ManagerReportDay:
      type: object
      description: Every figure of the manager report for one night.
      required: [rooms, guests, accounts, revenue, tomorrow]
      properties:
        rooms:
          $ref: "#/components/schemas/ManagerRoomStatistic"
        guests:
          $ref: "#/components/schemas/ManagerGuestStatistic"
        accounts:
          $ref: "#/components/schemas/ManagerAccountCount"
        revenue:
          $ref: "#/components/schemas/ManagerRevenue"
        tomorrow:
          $ref: "#/components/schemas/ManagerForecast"

    ManagerRoomStatistic:
      type: object
      required:
        - totalRooms
        - outOfOrder
        - availableForSale
        - occupied
        - complimentary
        - houseUse
        - occupiedExcludingCompAndHouseUse
        - occupancyPercent
        - averageRatePerOccupiedRoom
        - averageRevenuePerAvailableRoom
      properties:
        totalRooms:
          type: integer
        outOfOrder:
          type: integer
        availableForSale:
          type: integer
        occupied:
          type: integer
        complimentary:
          type: integer
        houseUse:
          type: integer
        occupiedExcludingCompAndHouseUse:
          type: integer
        occupancyPercent:
          type: string
          nullable: true
          description: occupied / availableForSale × 100.
        averageRatePerOccupiedRoom:
          type: string
          nullable: true
          description: Room revenue / occupied (ADR-like).
        averageRevenuePerAvailableRoom:
          type: string
          nullable: true
          description: Room revenue / availableForSale (RevPAR-like).

    ManagerGuestStatistic:
      type: object
      required:
        - adultsInHouse
        - childrenInHouse
        - guestsInHouse
        - averageGuestsPerRoom
        - averageRatePerGuest
        - averageLengthOfStay
        - complimentaryGuests
        - houseUseGuests
      properties:
        adultsInHouse:
          type: integer
        childrenInHouse:
          type: integer
        guestsInHouse:
          type: integer
        averageGuestsPerRoom:
          type: string
          nullable: true
          description: In-house guests / in-house rooms.
        averageRatePerGuest:
          type: string
          nullable: true
          description: Room revenue of the in-house rooms / in-house guests.
        averageLengthOfStay:
          type: string
          nullable: true
          description: Nights, averaged over the in-house bookings' whole stays.
        complimentaryGuests:
          type: integer
        houseUseGuests:
          type: integer

    ManagerAccountCount:
      type: object
      required: [arrivals, departures, cancellations, noShows, walkInRooms]
      properties:
        arrivals:
          type: integer
        departures:
          type: integer
        cancellations:
          type: integer
          description: Approximate - see the operation's note on `updatedAt`.
        noShows:
          type: integer
          description: Approximate - see the operation's note on `updatedAt`.
        walkInRooms:
          type: integer

    ManagerRevenue:
      type: object
      description: Room revenue only - see the operation for what is left out.
      required: [roomRevenue, averageRevenuePerInHouseGuest]
      properties:
        roomRevenue:
          type: string
        averageRevenuePerInHouseGuest:
          type: string
          nullable: true
          description: roomRevenue / in-house guests.

    ManagerForecast:
      type: object
      description: The next night's figures.
      required: [date, arrivals, departures, occupied, availableForSale, occupancyPercent]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        arrivals:
          type: integer
        departures:
          type: integer
        occupied:
          type: integer
        availableForSale:
          type: integer
        occupancyPercent:
          type: string
          nullable: true
          description: occupied / availableForSale × 100.

    RevenueCode:
      type: string
      enum: [ROOM, FNB, SPA]
      description: >
        Which revenue source a `GET /reports/revenue-statistic` figure comes from - see that
        operation. Derived at report time from the source (booking segments vs. POS lines by menu
        department), never stored on a transaction.

    RevenueStatisticReport:
      type: object
      description: '`GET /reports/revenue-statistic` - see that operation for what counts and how VAT is computed.'
      required: [from, to, vatRate, rows, total]
      properties:
        from:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        to:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        vatRate:
          type: string
          description: The VAT rate (percent, two decimals, e.g. "7.00") every figure in this response was computed with - the stored rate at the moment of the request.
        rows:
          type: array
          description: Always ROOM, FNB, SPA, in that order.
          items:
            $ref: "#/components/schemas/RevenueStatisticRow"
        total:
          $ref: "#/components/schemas/RevenueStatisticRow"

    RevenueStatisticRow:
      type: object
      description: One revenue code's figures, or the total (where `code` is null). Money is a decimal string with two decimals; `net + vat = gross` exactly.
      required: [code, gross, vat, net]
      properties:
        code:
          $ref: "#/components/schemas/RevenueCode"
          nullable: true
        gross:
          type: string
          description: Revenue as charged, VAT included.
        vat:
          type: string
          description: The VAT inside `gross` - `gross × vatRate / (100 + vatRate)`.
        net:
          type: string
          description: '`gross - vat`.'

    TrialBalanceReport:
      type: object
      description: '`GET /reports/trial-balance` - see that operation, including why it does not reconcile with Z410 for pre-ledger periods.'
      required: [asOf, rows, totalDebit, totalCredit, balanced]
      properties:
        asOf:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        rows:
          type: array
          description: One row per account in the chart, ordered by code.
          items:
            $ref: "#/components/schemas/TrialBalanceRow"
        totalDebit:
          type: string
          description: Sum of every row's `totalDebit`.
        totalCredit:
          type: string
          description: Sum of every row's `totalCredit`. Equal to `totalDebit` unless the posting logic has a bug.
        balanced:
          type: boolean
          description: '`totalDebit == totalCredit`.'

    TrialBalanceRow:
      type: object
      description: One account's totals up to and including `asOf`. Money is a decimal string with two decimals.
      required: [accountCode, accountName, accountType, normalBalance, totalDebit, totalCredit, balance]
      properties:
        accountCode:
          type: string
        accountName:
          type: string
        accountType:
          $ref: "#/components/schemas/LedgerAccountType"
        normalBalance:
          $ref: "#/components/schemas/LedgerNormalBalance"
        totalDebit:
          type: string
        totalCredit:
          type: string
        balance:
          type: string
          description: On the normal side - `totalDebit - totalCredit` for DEBIT-normal accounts, the reverse for CREDIT-normal ones. Negative is an abnormal balance.

    LedgerAccountType:
      type: string
      enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE]
      description: Decides the account's normal balance side (`LedgerNormalBalance`) - ASSET and EXPENSE are DEBIT-normal, the rest CREDIT-normal.

    LedgerNormalBalance:
      type: string
      enum: [DEBIT, CREDIT]
      description: Derived from `LedgerAccountType`, never stored.

    LedgerAccount:
      type: object
      description: >
        One account in the chart. Seeded: `1000` Cash/Bank, `1100` Guest Ledger (room charges not
        yet collected), `2100` VAT Payable, `3000` Owner Equity, `4000` Room Revenue, `4100` F&B
        Revenue, `4200` SPA Revenue, `6000` General Expense. Cash/Bank is one account, not split by
        method: POS and folio payments record CASH/CARD/OTHER, but a booking's room settlement
        (`status = PAID`) records no method at all, so a split could not be kept for room revenue.
      required: [code, name, type, normalBalance]
      properties:
        code:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/LedgerAccountType"
        normalBalance:
          $ref: "#/components/schemas/LedgerNormalBalance"

    LedgerAccountCreateInput:
      type: object
      description: Body of `POST /ledger/accounts`.
      required: [code, name, type]
      properties:
        code:
          type: string
          pattern: '^[0-9A-Z][0-9A-Z-]{0,19}$'
          description: Unique; digits, capital letters and hyphens, at most 20 characters (e.g. "6100").
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: "#/components/schemas/LedgerAccountType"

    JournalSourceType:
      type: string
      enum: [BOOKING, POS_ORDER, FOLIO_PAYMENT, MANUAL]
      description: >
        What posted an entry. `BOOKING` - a booking became `PAID`, or left it (the mirror);
        `sourceId` is the booking id. `POS_ORDER` - a POS order was closed; `sourceId` is the
        order id. `FOLIO_PAYMENT` - money collected against a booking's room charges; `sourceId`
        is the folio payment id. `MANUAL` - `POST /ledger/entries` or
        `POST /ledger/entries/{id}/reverse`; `sourceId` is null.

    JournalEntry:
      type: object
      description: >
        One balanced, immutable posting. `totalDebit` always equals `totalCredit` - the server
        rejects anything else before saving.
      required: [id, entryDate, description, sourceType, sourceId, reversesEntryId, reversedByEntryId, createdByUserId, createdAt, lines, totalDebit, totalCredit]
      properties:
        id:
          type: string
        entryDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: The accounting date (Asia/Bangkok). Automatic entries are dated the day they were posted.
        description:
          type: string
        sourceType:
          $ref: "#/components/schemas/JournalSourceType"
        sourceId:
          type: string
          nullable: true
        reversesEntryId:
          type: string
          nullable: true
          description: Set on a reversing entry - the entry it mirrors.
        reversedByEntryId:
          type: string
          nullable: true
          description: Set once this entry has been reversed - the reversing entry.
        createdByUserId:
          type: string
          nullable: true
          description: The staff member whose action posted it; null only if none was signed in.
        createdAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: "#/components/schemas/JournalLine"
        totalDebit:
          type: string
        totalCredit:
          type: string

    JournalLine:
      type: object
      description: One side of an entry - exactly one of `debit`/`credit` is non-zero. Money is a decimal string with two decimals.
      required: [accountCode, accountName, debit, credit]
      properties:
        accountCode:
          type: string
        accountName:
          type: string
        debit:
          type: string
        credit:
          type: string

    JournalEntryCreateInput:
      type: object
      description: Body of `POST /ledger/entries`.
      required: [entryDate, description, lines]
      properties:
        entryDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: The accounting date, not in the future.
        description:
          type: string
          maxLength: 500
        lines:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/JournalLineInput"

    JournalLineInput:
      type: object
      description: Give exactly one of `debit`/`credit`, a decimal string greater than zero with at most two decimals.
      required: [accountCode]
      properties:
        accountCode:
          type: string
        debit:
          type: string
        credit:
          type: string

    JournalEntryReverseInput:
      type: object
      description: Body of `POST /ledger/entries/{id}/reverse`.
      required: [description]
      properties:
        description:
          type: string
          maxLength: 500
          description: Why it is being reversed - becomes the reversing entry's description.

    ForecastReport:
      type: object
      description: '`GET /reports/forecast` - see that operation for how each figure is computed.'
      required: [from, to, days]
      properties:
        from:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        to:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        days:
          type: array
          description: One entry per date in the range, in date order.
          items:
            $ref: "#/components/schemas/ForecastDay"

    ForecastDay:
      type: object
      description: One date of the forecast.
      required: [date, rooms, total]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        rooms:
          type: array
          description: One row per room type, sorted by name.
          items:
            $ref: "#/components/schemas/ForecastRow"
        total:
          $ref: "#/components/schemas/ForecastRow"

    ForecastRow:
      type: object
      description: >
        One room type's figures for a date, or the property total (where `roomId`/`roomName` are
        null).
      required: [roomId, roomName, arrivals, departures, totalRooms, outOfOrder, occupied, vacant, occupancyPercent]
      properties:
        roomId:
          type: string
          nullable: true
        roomName:
          type: string
          nullable: true
        arrivals:
          type: integer
        departures:
          type: integer
        totalRooms:
          type: integer
          description: Physical units active today - see the operation's note on why this is today's count.
        outOfOrder:
          type: integer
        occupied:
          type: integer
        vacant:
          type: integer
          description: totalRooms - occupied - outOfOrder. Can be negative (overbooked).
        occupancyPercent:
          type: string
          nullable: true
          description: occupied / (totalRooms - outOfOrder) × 100. Null when nothing is sellable.

    GuestLtvReport:
      type: object
      description: '`GET /reports/guest-ltv` - see that operation for what counts.'
      required: [guests]
      properties:
        guests:
          type: array
          items:
            $ref: "#/components/schemas/GuestLtvRow"

    GuestLtvRow:
      type: object
      required: [guestId, name, email, bookingCount, totalNights, roomRevenue, roomChargesTotal, firstCheckIn, lastCheckIn]
      properties:
        guestId:
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true
          x-sensitive: true
        bookingCount:
          type: integer
          description: Bookings linked to this guest that are not `CANCELLED`.
        totalNights:
          type: integer
          description: Nights across those bookings' segments.
        roomRevenue:
          type: string
          description: Sum of those bookings' `totalPrice` - room price only. The ranking key.
        roomChargesTotal:
          type: string
          description: >
            Sum of `ROOM_CHARGE` payments posted to those bookings - POS orders charged to the
            room. Gross of any later folio settlement: it is what was spent, not what is still owed.
        firstCheckIn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Earliest `checkIn` among those bookings.
        lastCheckIn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Latest `checkIn` among those bookings - can be in the future.
