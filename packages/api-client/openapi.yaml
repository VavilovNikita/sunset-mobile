  /spa-appointments:
    get:
      operationId: getSpaSchedule
      tags: [Spa]
      summary: Get the spa's half-hour grid for one day
      description: Requires CASHIER or above. `tables` (SPA-zone) and `appointments` for `date`, plus the backend's own opening hours - see `SpaSchedule`.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: The spa's schedule for the day.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaSchedule"
        "400":
          description: '`date` missing or not `YYYY-MM-DD`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
    post:
      operationId: createSpaAppointment
      tags: [Spa]
      summary: Book a spa appointment
      description: >
        Requires CASHIER or above. Both the table and the therapist must be free for the whole
        slot - enforced by a database exclusion constraint on each axis, not a check-then-write;
        a genuine race (two receptionists booking the same therapist at once) surfaces as 409 on
        whichever request loses, not a 500 or a silent double-booking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaAppointmentCreateInput"
      responses:
        "201":
          description: Appointment created (possibly with a warning - see `SpaAppointmentResult`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaAppointmentResult"
        "400":
          description: Body failed validation, `treatmentMenuItemId` isn't a `SPA`-department item with a duration, or `startTime` falls outside opening hours / off the half-hour grid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: bookingId, tableId, therapistUserId, or treatmentMenuItemId does not reference an existing row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: The table or the therapist already has an overlapping BOOKED appointment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: This therapist already has an appointment overlapping this time.

  /spa-appointments/therapists:
    get:
      operationId: listSpaTherapists
      tags: [Spa]
      summary: List active staff holding the THERAPIST job function
      description: Requires CASHIER or above - see `SpaTherapist` for why this is narrower than `GET /users`.
      responses:
        "200":
          description: Active therapists.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpaTherapist"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"

  /spa-appointments/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateSpaAppointmentStatus
      tags: [Spa]
      summary: Cancel, mark no-show, or complete a spa appointment
      description: >
        Requires CASHIER or above. No therapist self-service in v1 - no therapist is signing
        into this system yet, see `JobFunction.THERAPIST`. `COMPLETED` is never set
        automatically by an order closing - the two lifecycles are deliberately independent, see
        `SpaAppointment.orderId`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaAppointmentStatusUpdateInput"
      responses:
        "200":
          description: Updated appointment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaAppointment"
        "400":
          description: '`status` is `BOOKED`, or the appointment is already in an end state.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Appointment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /spa-appointments/{id}/schedule:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateSpaAppointmentSchedule
      tags: [Spa]
      summary: Move a spa appointment to another table, time, and/or therapist
      description: >
        Requires CASHIER or above. The operation a drag on the spa schedule grid needs. Full
        replacement of all four fields, not a partial update - a drag always knows all four, and
        this project's own convention is full replacement wherever the caller has no reason not
        to send everything.

        Only legal while `status` is `BOOKED` - the same lifecycle boundary
        `PATCH /spa-appointments/{id}/status` already enforces (an appointment past that point is
        an end state). Never touches the treatment or its frozen `durationMinutes`, so the
        interval this checks is unchanged in length, just moved.

        No pre-check query - same "let the database settle it" philosophy
        `POST /spa-appointments` already documents: this writes the four fields directly and lets
        the two GiST exclusion constraints (`spa_appointment_no_table_overlap`,
        `spa_appointment_no_therapist_overlap` - see `V41__spa_appointment.sql`) decide, exactly
        as they do for a fresh booking. Both apply to this update exactly as they apply to an
        insert; the 409 on a lost race is the same message `POST /spa-appointments` already
        gives, not a new one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaAppointmentScheduleInput"
      responses:
        "200":
          description: Updated appointment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaAppointment"
        "400":
          description: '`startTime` isn''t on a slot boundary, the treatment would run past closing, or the appointment isn''t `BOOKED`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Appointment, table, or therapist not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: This table or this therapist already has an appointment overlapping the requested time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                table:
                  value: { error: "This table already has an appointment overlapping this time." }
                therapist:
                  value: { error: "This therapist already has an appointment overlapping this time." }

  /spa-appointments/{id}/swap-table:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: swapSpaAppointmentTable
      tags: [Spa]
      summary: Swap this appointment's table with another appointment's, atomically
      description: >
        Requires CASHIER or above. Table only - `date`, `startTime`, `therapistUserId`, and
        `durationMinutes` are untouched on both sides, which is what makes this well-defined
        regardless of how long either treatment runs: a 30-minute treatment and a 90-minute one
        trade tables exactly the same way two 90-minute ones would, because nothing about "how
        long" or "when" ever moves. A full slot exchange (time included) only stays coherent
        between equal-length treatments, and isn't offered here - see `SwapSpaAppointmentTableInput`.

        Both appointments must already be `BOOKED` - the same lifecycle boundary
        `PATCH /spa-appointments/{id}/schedule` already enforces.

        Moves both rows in one native `UPDATE`, not two sequential saves: PostgreSQL checks a
        `NOT DEFERRABLE` exclusion constraint at the end of the *statement*, not per row and not
        per transaction, so a single statement that sets both `tableId` values at once is checked
        exactly once, against both rows' final state - never against the transient moment where
        one side has already moved into a table the other hasn't vacated yet, which is the trap
        two separate `UPDATE`s (even inside one transaction) would fall into. No deferred
        constraints, no migration to make `spa_appointment_no_table_overlap` `DEFERRABLE` - see
        `SpaAppointmentTableSwapConstraintTimingTests`, which exists specifically to fail loudly
        if a future Postgres/JDBC/Hibernate change ever makes that assumption false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwapSpaAppointmentTableInput"
      responses:
        "200":
          description: >
            This appointment's own updated record. The other appointment named in the request
            also changed (its own `tableId` swapped the other way) - fetch it separately or
            refetch the day's schedule to see it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaAppointment"
        "400":
          description: The other appointment is the same as this one, or either appointment isn't BOOKED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                self:
                  value: { error: "Can't swap an appointment with itself" }
                notBooked:
                  value: { error: "Both appointments must be BOOKED to swap tables" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: This appointment not found, or the other appointment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: The table this appointment would move into already has an overlapping appointment on it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                table:
                  value: { error: "This table already has an appointment overlapping this time." }

  /spa-appointments/{id}/treatments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: addSpaAppointmentTreatment
      tags: [Spa]
      summary: Add a treatment to a spa appointment
      description: >
        Requires CASHIER or above, same floor as the rest of the spa-appointments surface. Only
        legal while `status` is `BOOKED` - adding to a `COMPLETED` appointment is refused (400):
        a `COMPLETED` row is a record of what happened, not a plan still being negotiated, see
        CLAUDE.md's Naming section on why this project keeps "what was planned" and "what
        actually happened" apart. Grows the appointment's maintained `durationMinutes`, widening
        the interval the two GiST exclusion constraints check - same "let the database settle
        it" philosophy as `POST /spa-appointments`, no pre-check, a lost race surfaces as 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaAppointmentTreatmentCreateInput"
      responses:
        "201":
          description: Updated appointment, including the new treatment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaAppointment"
        "400":
          description: Body failed validation, `treatmentMenuItemId` isn't a `SPA`-department item with a duration, the appointment isn't `BOOKED`, or the new total would run past closing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Appointment or treatmentMenuItemId not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: The table or the therapist already has an overlapping BOOKED appointment once this treatment is added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /spa-appointments/{id}/treatments/{treatmentId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: treatmentId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: removeSpaAppointmentTreatment
      tags: [Spa]
      summary: Remove a treatment from a spa appointment
      description: >
        Requires CASHIER or above. Legal while `status` is `BOOKED` or `COMPLETED` - removing
        (unlike adding) can only shrink the appointment's maintained `durationMinutes`, which can
        never create a new overlap, so this never risks a 409 and is allowed even on a
        `COMPLETED` row to correct an over-count. Refused (400) if this is the appointment's only
        remaining treatment - an appointment cannot exist with zero; cancel it instead.
      responses:
        "200":
          description: Updated appointment, with the treatment removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaAppointment"
        "400":
          description: This is the appointment's only treatment, or the appointment is CANCELLED/NO_SHOW.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Appointment not found, or treatmentId does not belong to this appointment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /spa-map:
    get:
      operationId: getSpaMap
      tags: [Spa]
      summary: Get the spa map's background image and its tables' today-state
      description: >
        Requires CASHIER or above, same floor as `GET /spa-appointments` - a receptionist reading
        which table is free right now is exactly the reader this level serves; only placing
        tables and replacing the image stay MANAGER+ (`PATCH /tables/positions`,
        `POST /spa-map/image`). Mirrors `GET /property-map` in shape and purpose: every SPA-zone
        table (placed or not, active or not), enriched with today's occupancy - see `SpaMapTable`.
        The enrichment costs one call to `SpaAppointmentService#getSchedule` for today (itself
        already batched, not one query per table - see that method's own doc) plus the table list
        itself; nothing here queries per-table.
      responses:
        "200":
          description: The spa map's image metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaMap"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"

  /spa-map/image:
    get:
      operationId: getSpaMapImage
      tags: [Spa]
      summary: Serve the spa map's background image
      description: >
        Requires CASHIER or above. Mirrors `GET /property-map/image` exactly - staff-only, not
        under the public `/uploads/**`, no filename in the path (there is exactly one current
        image, resolved from the `SpaMap` row itself).
      responses:
        "200":
          description: The image file.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: No spa map image has been uploaded yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      operationId: uploadSpaMapImage
      tags: [Spa]
      summary: Upload (or replace) the spa map's background image
      description: >
        Requires MANAGER or above. Same validation as `POST /property-map/image`/
        `POST /rooms/{id}/images` (content-sniffed type, 8MB cap, randomized filename) - see
        `ImageUploadValidator`. Replacing the image does not touch any `Table.positionX`/
        `positionY` - those live in a separate table and are addressed only by
        `PATCH /tables/positions`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "201":
          description: The updated spa map metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaMap"
        "400":
          description: No file provided, an unsupported MIME type, or a file over 8MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /restaurant-map:
    get:
      operationId: getRestaurantMap
      tags: [RestaurantMap]
      summary: Get the restaurant map's background image and its tables' open orders
      description: >
        Requires any authenticated staff session, same floor as `GET /tables` and the POS board
        it sits next to - a waiter finding a table is exactly who reads this. Only replacing the
        image is MANAGER+ (`POST /restaurant-map/image`), and placing tables stays the existing
        MANAGER+ `PATCH /tables/positions`. Mirrors `GET /spa-map` in shape: every non-SPA table
        (placed or not, active or not), each with the ids of its open (`OPEN`/`SENT`) orders - one
        query for those orders across all tables, never one per table.
      responses:
        "200":
          description: The restaurant map.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantMap"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /restaurant-map/image:
    get:
      operationId: getRestaurantMapImage
      tags: [RestaurantMap]
      summary: Serve the restaurant map's background image
      description: >
        Requires any authenticated staff session. Mirrors `GET /spa-map/image` exactly -
        staff-only, not under the public `/uploads/**`, no filename in the path.
      responses:
        "200":
          description: The image file.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No restaurant map image has been uploaded yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      operationId: uploadRestaurantMapImage
      tags: [RestaurantMap]
      summary: Upload (or replace) the restaurant map's background image
      description: >
        Requires MANAGER or above. Same validation as `POST /spa-map/image` (content-sniffed
        type, 8MB cap, randomized filename - see `ImageUploadValidator`). Replacing the image
        does not touch any `Table.positionX`/`positionY`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "201":
          description: The updated restaurant map.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantMap"
        "400":
          description: No file provided, an unsupported MIME type, or a file over 8MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /printers:
    get:
      operationId: listPrinters
      tags: [Printers]
      summary: List all printers
      description: Requires role `MANAGER` or above.
      responses:
        "200":
          description: All printers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Printer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
    post:
      operationId: createPrinter
      tags: [Printers]
      summary: Register a printer
      description: >
        Requires role `MANAGER` or above. Activating a printer (`isActive: true`, the default)
        for a `department` that already has an active printer is rejected with 409 - deactivate
        the old one first. Use `POST /printers/{id}/test` after creating one to confirm it's
        actually reachable before relying on it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrinterInput"
      responses:
        "201":
          description: Printer created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Printer"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "409":
          description: Another printer is already the active one for this `department`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: "Another printer is already active for department KITCHEN"

  /printers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updatePrinter
      tags: [Printers]
      summary: Update a printer
      description: >
        Requires role `MANAGER` or above. Full replacement of all `PrinterInput` fields - no
        partial update. Same 409-on-active-department-conflict rule as create.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrinterInput"
      responses:
        "200":
          description: Updated printer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Printer"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Printer not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Printer not found
        "409":
          description: Another printer is already the active one for this `department`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: "Another printer is already active for department KITCHEN"
    delete:
      operationId: deletePrinter
      tags: [Printers]
      summary: Delete a printer
      description: >
        Requires role `MANAGER` or above. A printer that has ever printed anything (has
        `PrintJob` rows) can't be deleted - deactivate it (`isActive: false`) instead.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkTrue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Printer not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Printer not found
        "409":
          description: This printer has existing print jobs and can't be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: This printer has existing print jobs and can't be deleted.

  /printers/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: testPrinter
      tags: [Printers]
      summary: Print a test page
      description: >
        Requires role `MANAGER` or above. Attempts delivery immediately (bounded by a short
        socket timeout) and returns the resulting `PrintJob` either way - `status: SENT` means
        it printed, `status: PENDING`/`FAILED` means it didn't and `lastError` says why. This is
        the only way to actually confirm a printer's host/port/codepage are right; without it,
        setting one up is guesswork.
      responses:
        "201":
          description: Test print job created and attempted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Printer not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Printer not found

  /print-jobs:
    get:
      operationId: listPrintJobs
      tags: [Printers]
      summary: List print jobs
      description: >
        Requires role `WAITER` or above (i.e. any staff role) - but what comes back depends on
        who's asking. `ADMIN`/`MANAGER` see every document type. `CASHIER`/`WAITER` only see
        `KITCHEN_TICKET`/`BAR_TICKET`/`PREBILL` jobs - `Z_REPORT` (shift cash reconciliation) and
        `GUEST_RECEIPT` (booking/payment detail) are cashier/management information, filtered
        out rather than 403'd so line staff still get the one thing they actually need this
        endpoint for: seeing that their own kitchen/bar ticket or pre-bill didn't go through.
        Ordered by `createdAt` descending (most recent first). Filter by `status=FAILED` to see
        what needs manual attention - a silently lost kitchen ticket is a dish that never gets
        served - and/or by `documentType` to narrow to one kind of document (e.g.
        `documentType=Z_REPORT` for a manager auditing shift closes). Both filters apply
        server-side; an unrecognized value for either is a 400, not a silently-ignored no-op.
        Dismissed jobs (see `POST /print-jobs/dismiss`) are excluded by default, from this list
        and from the count anything (a badge, a banner) derives from it, regardless of the
        `status` filter used - pass `includeDismissed=true` to see them (e.g. reviewing history
        on a `GUEST_RECEIPT`/`Z_REPORT` job).
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PrintJobStatus"
        - name: documentType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PrintDocumentType"
        - name: includeDismissed
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Matching print jobs, filtered to the document types the caller's role may see.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrintJob"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /print-jobs/dismiss:
    post:
      operationId: dismissPrintJobs
      tags: [Printers]
      summary: Close one or more failed print jobs as not-actionable
      description: >
        Requires role `WAITER` or above - the same floor as `POST /print-jobs/{id}/retry`, not a
        higher one. A dismissal can only ever affect a document type the caller could already see
        and retry (Z-reports/guest receipts stay invisible to `WAITER`/`CASHIER` here exactly as
        everywhere else on this queue), so the practical risk of a wrong dismissal is bounded to
        the same kitchen/bar/pre-bill tickets that role can already act on - and the person best
        placed to know a kitchen ticket is safe to close (the kitchen was told by voice, the
        printer was swapped, the order already reached the guest) is routinely the front-line
        staff working the floor, not a manager who wasn't there. Doesn't delete the row or change
        `status` - `dismissedAt`/`dismissedByUserId`/`dismissNote` are set and the job stops
        counting toward the default list/badge/banner. Rejects the whole call (no partial
        effect) if any id doesn't exist, isn't visible to the caller's role (404), isn't
        currently `FAILED`, or is already dismissed (409) - close several at once from one
        filtered view without wondering which ones silently didn't take.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DismissPrintJobsInput"
      responses:
        "200":
          description: The dismissed jobs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrintJob"
        "400":
          description: Empty `ids` array.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: No print job ids provided
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: A job id doesn't exist, or its document type isn't visible to the caller's role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Print job not found
        "409":
          description: A job isn't currently FAILED, or is already dismissed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /print-jobs/{id}/retry:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: retryPrintJob
      tags: [Printers]
      summary: Manually retry a print job
      description: >
        Requires role `WAITER` or above, subject to the same per-role document-type visibility
        as `GET /print-jobs`. Attempts delivery immediately regardless of the job's current
        `status` or `attempts` count (a human asking for a retry overrides the automatic-retry
        attempt ceiling). The original `payload` is replayed byte-for-byte - this re-sends
        exactly what was originally queued, it does not regenerate the document from current
        data. A job whose document type the caller's role can't see (e.g. a `WAITER` targeting a
        `Z_REPORT` job id) returns 404, not 403 - the id must not be usable to confirm the job
        exists, let alone force a reprint of it.
      responses:
        "200":
          description: 'The job after the retry attempt (`status: SENT` or `FAILED`).'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Print job not found, or its document type isn't visible to the caller's role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Print job not found

  /orders:
    get:
      operationId: listOrders
      tags: [Orders]
      summary: List orders
      description: >
        Requires any authenticated staff session - same as `GET /orders/{id}`, order visibility
        has no ownership boundary between staff (the whole floor already needs to see every
        table). Filters combine with AND; this is the one endpoint that covers both the live
        floor board (`status=OPEN`/`SENT`) and looking up a closed order (`status=PAID`/
        `CANCELLED`) for a dispute or a till reconciliation - there's no separate "history"
        endpoint.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: tableId
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Inclusive lower bound (whole day, local to the server) on the date `dateBasis` names.
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Inclusive upper bound (whole day, local to the server) on the date `dateBasis` names.
        - name: dateBasis
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderDateBasis"
          description: >
            Which date `from`/`to` filter on. `OPENED` (the default, and the only behaviour before
            this parameter existed) is `Order.createdAt`. `CLOSED` is `Order.closedAt` - when the
            order was paid or cancelled - so an order opened a month ago and paid today shows up
            in today's history; an order still `OPEN`/`SENT` has no close date and never matches.
            Ignored when neither `from` nor `to` is given.
        - name: shiftId
          in: query
          required: false
          schema:
            type: string
          description: >
            Orders paid during the given `Shift` - joins through `Payment.shiftId`, since `Order`
            itself carries no `shiftId` (see `ShiftsApi`). An order still `OPEN`/`SENT` (no
            `Payment` yet) never matches, even if opened during that shift.
      responses:
        "200":
          description: Matching orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createOrder
      tags: [Orders]
      summary: Open a new order
      description: Requires role `WAITER` or above (i.e. any staff role — WAITER is the floor of the hierarchy).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateInput"
      responses:
        "201":
          description: Order created with status `OPEN` and no items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: '`tableId` or `bookingId` given but not found.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getOrder
      tags: [Orders]
      summary: Get an order by id, with its line items
      description: Requires any authenticated staff session.
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Order not found
    patch:
      operationId: updateOrder
      tags: [Orders]
      summary: Update an order's note/table, or send it (OPEN -> SENT)
      description: Requires role `WAITER` or above.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdateInput"
      responses:
        "200":
          description: Updated order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Body failed validation, or `status` requested a transition other than `OPEN` -> `SENT`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Order not found

  /orders/{id}/items:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: addOrderItems
      tags: [Orders]
      summary: Add one or more line items to an order
      description: >
        Requires role `WAITER` or above. Legal while the order is `OPEN` or `SENT` - a guest
        adding a round of drinks after the order was already sent to the kitchen is normal, and
        appending new lines doesn't retroactively change anything about the lines already sent.
        `unitPrice` is snapshotted from the current `MenuItem.price` server-side — never taken
        from the client. Unlike this endpoint, `PATCH`/`DELETE` on an individual existing line
        (`/orders/{id}/items/{itemId}`) still require the order to be `OPEN` - editing or
        removing a line that may already be in progress in the kitchen is not offered here.


        **Merging**: an input line is merged into an existing line (quantity added, no new row)
        when both `menuItemId` and the (trimmed, blank-as-null) `note` match an existing line
        that has `OrderItem.sentAt: null` - i.e. a line still waiting to be dispatched. A line
        that already has `sentAt` set is never merged into, even on an exact match: the kitchen
        already has a physical ticket for that quantity, and silently bumping it on-screen would
        leave the two out of sync with no way to tell. The new input becomes its own (unsent)
        line instead, to go out on the next ticket.


        **Re-order printing**: if the order is already `SENT` when this call adds line(s), every
        currently-unsent line on the order (not just the ones just added - covers any earlier
        line that for some reason never got marked sent) is immediately split by department and
        printed exactly like the original `OPEN` -> `SENT` send (see `PATCH /orders/{id}`), then
        marked `sentAt`. This only ever prints the delta: a kitchen ticket for a re-order never
        repeats lines already on an earlier ticket. If the order is still `OPEN`, new lines stay
        unsent and wait for the explicit send along with everything else.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/OrderItemInput"
      responses:
        "201":
          description: Updated order, with the new line(s) appended and `total` recomputed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Order not found, or a `menuItemId` doesn't exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Order is not `OPEN` or `SENT` (i.e. it's already `PAID`/`CANCELLED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Order is not open or sent

  /orders/{id}/items/{itemId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateOrderItem
      tags: [Orders]
      summary: Replace a line item's quantity/note
      description: Requires role `WAITER` or above. Only legal while the order is `OPEN`. `unitPrice` is not re-snapshotted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderItemInput"
      responses:
        "200":
          description: Updated order, with `total` recomputed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Order or line item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Order is not `OPEN`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Order is not open
    delete:
      operationId: deleteOrderItem
      tags: [Orders]
      summary: Remove a line item
      description: Requires role `WAITER` or above. Only legal while the order is `OPEN`.
      responses:
        "200":
          description: Updated order, with `total` recomputed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Order or line item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Order is not `OPEN`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Order is not open

  /orders/{id}/items/{itemId}/void:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: voidOrderItem
      tags: [Orders]
      summary: Void (part of) a line that was already sent to the kitchen/bar
      description: >
        Requires role `MANAGER` or above - taking something off a ticket the kitchen already has
        is exactly how a shortfall or a theft would be hidden, so it needs someone other than the
        person who rang it up, and a reason. Legal only while the order is `OPEN`/`SENT` and only
        for a line with `sentAt` set (an unsent line is simply edited or removed through
        `PATCH`/`DELETE /orders/{id}/items/{itemId}`, 409 here). Voids `quantity` units of the
        line (all of them by default): that quantity leaves the line - the line is deleted when
        nothing is left - and is recorded as an `OrderItemVoid` on `Order.voids` with the reason,
        the user and the time; `total` is recomputed. A void ticket is printed for the line's
        department (best effort, same as every other print). Audited as `ORDER_ITEM_VOIDED`. A
        `PAID` order is not voided here - that would be a refund, which this API does not model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderItemVoidInput"
      responses:
        "200":
          description: Updated order, with `total` recomputed and the void on `voids`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Body failed validation, blank `reason`, or `quantity` larger than the line's.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Order or line item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Order is `PAID`/`CANCELLED`, or the line hasn't been sent yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /orders/{id}/close:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: closeOrder
      tags: [Orders]
      summary: Close an order with a payment
      description: >
        Requires role `CASHIER` or above, and requires the calling user to have an `OPEN`
        `Shift` (409 otherwise). Creates a `Payment` row for `Order.total`/`method` (and
        `bookingId` when `method` is `ROOM_CHARGE`) tied to that shift, then sets the order's
        status to `PAID`. The amount charged is always `Order.total` - see `CloseOrderInput`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseOrderInput"
      responses:
        "200":
          description: Closed order (status `PAID`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Body failed validation, or `method` is `ROOM_CHARGE` without a `bookingId`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Order not found, or (for `ROOM_CHARGE`) `bookingId` not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Order already `PAID`/`CANCELLED`, caller has no open shift, or (for `ROOM_CHARGE`) the booking is `CANCELLED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /orders/{id}/print-prebill:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: printOrderPrebill
      tags: [Orders]
      summary: Print a pre-bill for an order
      description: >
        Requires role `WAITER` or above. Prints to the active `CASHIER` printer: line items
        with prices and the total, but no payment method or paid marker - this is a courtesy
        printout for the guest to review before actually paying, not a receipt. Does not change
        `Order.status` or create a `Payment`. No-op (still returns 201, `attempted: false`, no
        `PrintJob` created) if there's no active `CASHIER` printer configured.
      responses:
        "201":
          description: Pre-bill print attempted (or skipped - see `attempted`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintAttemptResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /orders/{id}/print-receipt:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: printOrderReceipt
      tags: [Orders]
      summary: Reprint a paid order's guest receipt
      description: >
        Requires role `CASHIER` or above - the same floor as `POST /orders/{id}/close`, whose
        receipt this repeats. Regenerates the guest receipt from the order, its lines and its
        `Payment` (the room and guest for a room charge), titled "GUEST RECEIPT - COPY" so it
        can't be mistaken for the original, and prints it to the active `CASHIER` printer.
        Delivery is attempted before responding, like the pre-bill - the person asked for this
        printout and is waiting for it. Creates a `GUEST_RECEIPT` `PrintJob`; changes nothing
        about the order or its payment, and is not audited (the print job is the record). No-op
        (still returns 201, `attempted: false`) if there's no active `CASHIER` printer.
      responses:
        "201":
          description: Receipt copy print attempted (or skipped - see `attempted`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintAttemptResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: The order isn't `PAID`, so it has no receipt to reprint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /orders/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: cancelOrder
      tags: [Orders]
      summary: Cancel an order
      description: Requires role `WAITER` or above. No payment is created.
      responses:
        "200":
          description: Cancelled order (status `CANCELLED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Order not found
        "409":
          description: Order already `PAID`/`CANCELLED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /shifts/open:
    post:
      operationId: openShift
      tags: [Shifts]
      summary: Open a shift for the calling user
      description: Requires role `CASHIER` or above. 409 if the calling user already has an open shift (enforced by a unique partial index, not just an application-level check).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftOpenInput"
      responses:
        "201":
          description: Shift opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "409":
          description: Caller already has an open shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: You already have an open shift

  /shifts/current:
    get:
      operationId: getCurrentShift
      tags: [Shifts]
      summary: Get the calling user's currently open shift
      description: >
        Requires role `CASHIER` or above. Looks up by `openedByUserId` = the calling user's id
        AND `status=OPEN` - never returns another user's shift, even to a MANAGER/ADMIN caller.
        Lets a client on any device discover whether it already has an open shift without
        relying on browser local storage.
      responses:
        "200":
          description: The calling user's open shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: The calling user has no open shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: No open shift

  /shifts/{id}/close:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: closeShift
      tags: [Shifts]
      summary: Close a shift
      description: Requires role `CASHIER` or above.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftCloseInput"
      responses:
        "200":
          description: Closed shift (status `CLOSED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Shift not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Shift not found
        "409":
          description: >
            Already `CLOSED`, or there are `OPEN`/`SENT` orders anywhere in the system. This is
            a system-wide gate, not scoped to this particular shift - `Order` has no `shiftId`
            (only `Payment` does, and only once an order is closed), so there is no way to ask
            "orders opened during this shift" and the check intentionally doesn't pretend
            otherwise.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /shifts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getShift
      tags: [Shifts]
      summary: Get a shift summary
      description: >
        Requires role `CASHIER` or above. A caller whose role is exactly `CASHIER` (not
        `MANAGER`/`ADMIN`) may only fetch a shift they themselves opened - any other shift id
        404s for them, same as if it didn't exist, to avoid confirming another cashier's shift
        even exists. `MANAGER`/`ADMIN` can fetch any shift.
      responses:
        "200":
          description: The shift with payment totals broken out by method.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Shift not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Shift not found

  /shifts/{id}/export:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: exportShift
      tags: [Shifts]
      summary: Export a shift's Z-report as CSV
      description: >
        Requires role `MANAGER` or above. This is the till-reconciliation report, not a raw
        payment dump: identifiers that only make sense to a database (order/booking/cashier
        UUIDs) are replaced with what a manager actually needs to read - the order's
        table/zone and item composition (or a short fallback if there's no table), the guest
        name and room for ROOM_CHARGE payments, and the cashier's email. The underlying
        `Payment.id`/`Order.id` are kept as the last two columns for support/audit lookups,
        not as the first thing a human sees. Timestamps are seconds-precision (`yyyy-MM-dd
        HH:mm:ss "UTC"`), not the millisecond ISO instant used elsewhere in the API.


        The file opens with a UTF-8 BOM and a `sep=,` directive line - see `GET
        /bookings/export`'s description for why.


        After the payment rows, a blank line separates a totals block (label, value per row):
        `Cash`/`Card`/`Other`/`Room charge (posted to room folio - not received cash/card)`
        (same per-method split and the same ROOM_CHARGE exclusion as `GET /payments/summary`
        - see that operation's description for why ROOM_CHARGE isn't received revenue),
        `Received total (cash + card + other)`, `Payments` (count), `Opening cash float`,
        `Expected cash (float + cash payments)`, `Counted cash` (the shift's
        `closingCashCounted`, or `—` if the shift hasn't been closed/recounted yet), and
        finally `Discrepancy (counted - expected)` - positive means the drawer has more cash
        than it should, negative means it's short. This last figure is the actual point of
        closing a shift.
      responses:
        "200":
          description: >
            CSV file: a header row, one row per payment recorded under this shift, a blank
            row, then the reconciliation totals block described above.
          content:
            text/csv:
              schema:
                type: string
                example: |
                  Time,Method,Amount,Order,Guest / Room,Cashier,Payment ID,Order ID
                  2026-08-08 20:26:40 UTC,ROOM_CHARGE,1080.00,Bar – Bar Seat 3: 2× Mojito; 1× Caesar salad,Jane Doe – Ocean View Suite,cashier@sunsetbeach.example,aa89f455-...,5de7944d-...

                  Summary,
                  Cash,3200.00
                  Card,1500.00
                  Other,0.00
                  Room charge (posted to room folio - not received cash/card),1080.00
                  Received total (cash + card + other),4700.00
                  Payments,5
                  Opening cash float,2000.00
                  Expected cash (float + cash payments),5200.00
                  Counted cash,5150.00
                  Discrepancy (counted - expected),-50.00
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'Always `attachment; filename="shift-{id}.csv"`.'
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Shift not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Shift not found

  /shifts:
    get:
      operationId: listShifts
      tags: [Shifts]
      summary: List shifts for till reconciliation review
      description: >
        Requires role `MANAGER` or above. One row per shift, reconciliation numbers
        (`expectedCash`/`discrepancy`) already computed - previously the only way to see this
        across more than one shift was paging through the general audit log for `SHIFT_CLOSED`
        entries and reading the discrepancy back out of free text. `GET /shifts/{id}/export` is
        the single-shift CSV detail underneath this; this operation is what points a manager at
        *which* shift needs a closer look, or export, next.


        `from`/`to` bound `openedAt` (closed on both ends, matching every other date-range
        filter in this API), `staffId` narrows to shifts opened by one user. All filters are
        optional; with none given, every shift ever opened comes back, newest first, so a full
        audit doesn't require guessing a date range first.
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: staffId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Shifts matching the filters, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShiftListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /payments/summary:
    get:
      operationId: getPaymentsSummary
      tags: [Payments]
      summary: Get a payment totals summary for a date range
      description: >
        Requires role `MANAGER` or above. `from`/`to` are inclusive dates, filtered by
        `Payment.createdAt`. `totals` reuses the exact same per-method aggregation
        `GET /shifts/{id}` builds `ShiftSummary.totals` from - just scoped to a date range
        across all shifts instead of one shift (see `PaymentAggregation` in the backend; the
        arithmetic is not duplicated between the two).


        **`totals.roomCharge` is not received revenue.** It's money moved onto a guest's room
        folio at the moment a POS order was closed with `method=ROOM_CHARGE` - it only becomes
        real, collected revenue if/when the underlying `Booking` itself is later paid, which is
        a separate event this endpoint does not track (see `GET /bookings/{id}/folio`).
        Including it in a revenue total here would either double-count it (once here, again
        when the booking is paid) or count it before any money actually changed hands.
        `grandTotal` is therefore **`totals.cash + totals.card + totals.other` only** -
        `totals.roomCharge` is deliberately excluded and must be read as a separate "moved to
        room folios this period" figure, never added into `grandTotal` on the client.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Inclusive start date (by `Payment.createdAt`).
        - name: to
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Inclusive end date (by `Payment.createdAt`).
      responses:
        "200":
          description: Payment totals for the date range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsSummary"
        "400":
          description: '`from`/`to` missing, not a valid date, or `from` after `to`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /reports/revenue-export:
    get:
      operationId: exportRevenue
      tags: [Reports]
      summary: Export money collected in a date range, as an Excel workbook
      description: >
        Requires role `MANAGER` or above, same floor as `GET /payments/summary` and
        `GET /bookings/export`. Gross amounts actually received, by day and by method, for a
        bookkeeper to reconcile against cash and bank deposits. No tax breakdown: nothing in this
        system records tax.


        **Days are Asia/Bangkok calendar days.** `from`/`to` are inclusive hotel-local dates, and
        each payment is placed on the Bangkok date of its `createdAt`. This differs from
        `GET /payments/summary`, which compares `createdAt` against the dates without converting
        it, so its days run 07:00 to 07:00 Bangkok time. For the same `from`/`to`, the two can
        disagree by whatever was paid between 00:00 and 07:00 Bangkok time at either end of the
        range.


        **Room-rate revenue is not in any total.** This system has no payment record for the room
        itself. The only sign that a stay was paid for is `Booking.status = PAID`, which has no
        date, method or amount-paid of its own. The workbook therefore totals exactly two
        channels, and says so on its Summary sheet:

        - **POS payments received**: `Payment` rows with method `CASH`, `CARD` or `OTHER`.
          `ROOM_CHARGE` payments are shown in their own column but never added to any total.
          Closing an order to a room collects no money, it moves the amount onto the booking's
          folio (see `GET /payments/summary`).

        - **Room charges settled**: `FolioPayment` rows, i.e. money collected at the desk against
          room-charged POS orders (see `POST /bookings/{id}/folio-payments`). This is where a
          room-charged order's money is counted, once, when it is actually collected. It never
          includes the room rate: a folio payment can't exceed the booking's outstanding room
          charges.


        Four sheets. "Summary": one row per day in the range (days with nothing collected
        included, as zeros), then a totals row, then notes explaining the above. "POS payments":
        every `Payment` in the range, `ROOM_CHARGE` included and marked as not counted, with its
        order, table and the booking it was charged to. "Room charge settlements": every
        `FolioPayment` in the range, with its booking and the booking's `guestName` (the name
        stored on the booking, not a live guest-card lookup). "Paid bookings (info)":
        bookings whose status is `PAID` now and whose check-out falls in the range, with
        `totalPrice`. That sheet is for reference only. It is what the booking says today, not a
        record of when or how it was paid, and none of it is added to any total.


        Amounts are numeric cells with two decimals, so they can be summed in Excel.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Inclusive start date (Asia/Bangkok).
        - name: to
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Inclusive end date (Asia/Bangkok).
      responses:
        "200":
          description: The .xlsx workbook (Summary, POS payments, Room charge settlements, Paid bookings (info)).
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          description: '`from`/`to` missing, not a valid date, or `from` after `to`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /reports/occupancy:
    get:
      operationId: getOccupancyReport
      tags: [Reports]
      summary: Occupancy, ADR and RevPAR for a date range, per room type and in total
      description: >
        Requires role `MANAGER` or above, same floor as `GET /reports/revenue-export`. One set of
        figures for the whole requested range (no daily breakdown), per room type and for the
        property as a whole.


        **Nights.** `from`/`to` are inclusive hotel-local calendar dates, and each date in the
        range is one night: `from=2026-09-01&to=2026-09-30` is 30 nights. A stay occupies the
        nights `checkIn <= night < checkOut`, the same rule availability uses.


        **Room-nights sold** counts every night of every `BookingSegment` whose booking is not
        `CANCELLED` (any other status counts, `NEW` included, same as availability) that falls
        inside the range. A segment that starts before `from` or ends after `to` counts only the
        nights inside it. A segment with no physical room assigned yet still counts for its room
        type. A guest still `CHECKED_IN` after `checkOut` (`OverstayRule`) also counts, for every
        night from `checkOut` through tonight, in their last segment's room type and at zero
        revenue - they are physically in the room, but nothing was agreed or priced for those
        nights. This is the one population every room report reads (top production, market
        segment, the manager report, the forecast and the in-house list), so they agree.


        **Room revenue** is each such segment's `totalPrice`, prorated to the nights inside the
        range: `totalPrice × nightsInRange / segmentNights`. Rounded to two decimals once, on the
        final sum, not per segment. It is the agreed room price, not money collected: see
        `GET /reports/revenue-export` for cash actually received.


        **Room-nights available is a known simplification.** It is the number of physical units of
        the room type that are active *today*, times the number of nights in the range. It is not
        a historical day-by-day count: a unit added or deactivated during the range counts as if
        it had always been in its current state for the whole range. Nights a unit was blocked out
        of sale (`RoomUnitBlock`) are not subtracted either. Occupancy and RevPAR for a past range
        are therefore only as accurate as today's inventory is representative of that period.


        `occupancyPercent` = sold / available × 100. `adr` (average daily rate) = revenue / sold.
        `revpar` = revenue / available. Each is `null` when its denominator is zero. All three are
        computed from the unrounded revenue and rounded to two decimals at the end.


        A room type appears if it has at least one active unit today or at least one night sold in
        the range. `total` sums the rows; its ratios are recomputed from those sums, not averaged.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: First night of the range, inclusive (Asia/Bangkok).
        - name: to
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Last night of the range, inclusive (Asia/Bangkok).
      responses:
        "200":
          description: The occupancy figures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccupancyReport"
        "400":
          description: '`from`/`to` missing, not a valid date, or `from` after `to`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /reports/pos-sales-mix:
    get:
      operationId: getPosSalesMixReport
      tags: [Reports]
      summary: What the POS sold in a date range, by menu item, category and department
      description: >
        Requires role `MANAGER` or above, same floor as `GET /reports/revenue-export`.


        Counts the items of every order that is `PAID` and whose `Payment` was recorded inside the
        range. An order has exactly one `Payment` (a unique constraint enforces it), so "when was
        this order settled" has one answer. Days are Asia/Bangkok calendar days, bucketed exactly
        the way `GET /reports/revenue-export` buckets payments, so the two reports agree on which
        day a sale belongs to. Open, sent and cancelled orders are not counted.


        Every payment method counts, `ROOM_CHARGE` included: this report is about what sold, not
        about whether the money has been collected yet.


        `revenue` is `quantity × unitPrice` summed over order lines, using the price frozen on each
        line when it was added to the order (the same figure the order's `total` was built from),
        not today's menu price. `name`, `category` and `department` are read from the menu item as
        it is now, so an item renamed or moved since is reported under its current name and
        grouping.


        `items` has one row per menu item. `categories` and `departments` roll the same rows up,
        and each list sums to `totalQuantity`/`totalRevenue`. Every list is sorted by revenue,
        highest first.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Inclusive start date (Asia/Bangkok).
        - name: to
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Inclusive end date (Asia/Bangkok).
      responses:
        "200":
          description: The sales mix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosSalesMixReport"
        "400":
          description: '`from`/`to` missing, not a valid date, or `from` after `to`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /reports/guest-ltv:
    get:
      operationId: getGuestLtvReport
      tags: [Reports]
      summary: Top guests by lifetime room revenue
      description: >
        Requires role `MANAGER` or above, same floor as `GET /reports/revenue-export`. No date
        range: every booking ever made counts.


        Only bookings linked to a guest card (`Booking.guestId`) count, and only those that are not
        `CANCELLED`. A guest whose every booking is cancelled does not appear.


        `roomRevenue` is the sum of those bookings' `totalPrice`, which is the agreed room price
        only. Guests are ranked by it, highest first. POS spend is not inside `totalPrice`: an
        order charged to the room is recorded as a separate `ROOM_CHARGE` payment. That is
        reported as its own figure, `roomChargesTotal`, and is not part of the ranking. A POS order
        the guest paid for on the spot (cash, card) is linked to no booking or guest and so cannot
        be attributed to anyone.


        Future bookings count the same as past ones, in every figure: `lastCheckIn` can be a date
        that has not arrived yet.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: How many guests to return.
      responses:
        "200":
          description: The top guests, highest room revenue first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestLtvReport"
        "400":
          description: '`limit` is not an integer from 1 to 200.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /reports/top-production:
    get:
      operationId: getTopProductionReport
      tags: [Reports]
      summary: Room-nights and room revenue by producer (channel, complimentary, house use) for a date range
      description: >
        Requires role `MANAGER` or above, same floor as `GET /reports/revenue-export`.


        **Producer.** A booking whose `purpose` is `COMPLIMENTARY` counts under `COMPLIMENTARY`
        and one whose `purpose` is `HOUSE_USE` under `HOUSE_USE`, whatever its `channel`. Every
        other booking counts under its own `channel` value (`DIRECT`, `PHONE`, `WALK_IN`, ...), one
        row per value - no channels are merged. A producer with nothing in the range has no row.


        **What counts** is exactly what `GET /reports/occupancy` counts: every night of every
        `BookingSegment` whose booking is not `CANCELLED` (any other status counts, `NEW`
        included) that falls inside the range, with `from`/`to` as inclusive nights. `revenue` is
        each such segment's `totalPrice` prorated to the nights inside the range, summed unrounded
        and rounded to two decimals once. The rows' `roomNights`/`revenue` therefore sum to
        `GET /reports/occupancy`'s `total.roomNightsSold`/`total.roomRevenue` for the same range.


        Rows are sorted by `roomNights`, highest first, then by `revenue`, then by `producer`.
        `roomNightsPercent`/`revenuePercent` are each row's share of `total`, null when the total
        is zero. `adr` is revenue / room-nights.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: First night of the range, inclusive (Asia/Bangkok).
        - name: to
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Last night of the range, inclusive (Asia/Bangkok).
      responses:
        "200":
          description: The producers, most room-nights first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopProductionReport"
        "400":
          description: '`from`/`to` missing, not a valid date, or `from` after `to`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /reports/market-segment:
    get:
      operationId: getMarketSegmentReport
      tags: [Reports]
      summary: Room-nights, guests and room revenue by market segment for a date range
      description: >
        Requires role `MANAGER` or above, same floor as `GET /reports/revenue-export`.


        **Segment.** `COM` - `purpose` is `COMPLIMENTARY`. `HFO` (house folio) - `purpose` is
        `HOUSE_USE`. Otherwise by `channel`: `OTA` for `BOOKING_COM`, `AIRBNB`, `AGODA`, `EXPEDIA`,
        and for `OTHER` on a booking imported from SiteMinder (an OTA SiteMinder showed under a name
        this system has no channel value for); `OTH` for every other `OTHER` booking - entered by
        staff, including every staff booking made before `channel` existed, whose real channel was
        never recorded; `WLK` for `WALK_IN`; `DIR` for `DIRECT` and `PHONE`. It is the same grouping
        as `GET /reports/top-production`, one level up.


        **Six segments, not the legacy sheet's five.** The Z360 layout this mirrors has no
        "unknown" line, and this report used to fold staff-entered `OTHER` into `OTA` to keep its
        five rows - which credited online agents with bookings that never came through one. `OTH`
        moves those room-nights and that revenue out of `OTA`; the total is unchanged.


        **What counts** is the same population as `GET /reports/top-production` and
        `GET /reports/occupancy`: nights of non-`CANCELLED` bookings' segments inside the range,
        revenue prorated to those nights and rounded once. `guests` is `adults + children` summed
        over the distinct bookings with at least one night in the range - a booking counts once
        however many of its nights (or segments, after a relocation) fall inside it. It is a head
        count of parties, not guest-nights.


        All six segments are always returned, in the order `COM`, `DIR`, `HFO`, `OTA`, `OTH`,
        `WLK`, zero rows included. The `*Percent` fields are each segment's share of `total`, null when
        the total is zero. `averageRate` is revenue / room-nights, null when no room-night was
        sold.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: First night of the range, inclusive (Asia/Bangkok).
        - name: to
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Last night of the range, inclusive (Asia/Bangkok).
      responses:
        "200":
          description: The five segments and their total.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSegmentReport"
        "400":
          description: '`from`/`to` missing, not a valid date, or `from` after `to`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /reports/in-house:
    get:
      operationId: getInHouseReport
      tags: [Reports]
      summary: Guests in house on one night, one row per occupied room (legacy Z180)
      description: >
        Requires role `CASHIER` or above - lower than the rest of `/reports/*` (MANAGER+), the same
        tier as `GET /night-audit`: this is the front desk's routine daily list, not a strategic
        report.


        **Who is in house.** One row per `BookingSegment` covering the night `date`
        (`checkIn <= date < checkOut`) whose booking is not `CANCELLED` and whose guest was
        physically present that night: `occupancyStatus` is `CHECKED_IN`, or `CHECKED_OUT` with a
        `checkedOutAt` after `date` (a guest who has since left but was here that night - only
        possible for a past `date`; for today this is exactly "`CHECKED_IN`"). An `EXPECTED`
        arrival is not in house yet, and neither is a `NO_SHOW` - see `GET /night-audit` for
        arrivals still awaited. A guest still here past their `checkOut` is not listed either;
        they are a missed departure on the night-audit checklist.


        **One row per room, not per booking - and these are the same thing.** A booking's segments
        are contiguous and never overlap in time (enforced after every segment write), so a
        booking covers any one night with exactly one segment, in exactly one room. `adults` and
        `children` are the booking's own counts; there is no multi-room booking whose party would
        need splitting across rows.


        **Columns.** `arrival`/`departure` are the whole booking's `checkIn`/`checkOut`, not the
        current segment's (after a relocation they differ). `marketSegment` is the same
        `COM`/`DIR`/`HFO`/`OTA`/`OTH`/`WLK` rollup as `GET /reports/market-segment`. The booking id is
        the reservation reference - there is no separate reservation number.


        **Left out of the legacy Z180 layout:** nationality, company and remark. None of them is
        recorded on `Guest` or `Booking` (`Guest.notes` and tags are guest-level, not a per-stay
        remark), so they are omitted rather than filled from an unrelated field.


        Rows are sorted by physical room label; rows with no room assigned come last, by room type
        name.
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: The night to list (Asia/Bangkok). Defaults to tonight, hotel-local.
      responses:
        "200":
          description: The in-house list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InHouseReport"
        "400":
          description: '`date` is not a valid date.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"

  /reports/manager:
    get:
      operationId: getManagerReport
      tags: [Reports]
      summary: One night's room, guest, booking and room-revenue summary, with the same night last year (scoped legacy Z370)
      description: >
        Requires role `MANAGER` or above, same floor as the rest of `/reports/*`.


        `today` is computed for `date`, `lastYear` by the identical computation for the same
        calendar date one year earlier (29 February falls back to 28 February). No month-to-date
        or year-to-date columns.


        **Left out of the legacy Z370 layout, deliberately:**
        F&B and miscellaneous revenue lines (there is no revenue-code taxonomy to group POS sales
        into those lines yet - revenue here is room revenue only);
        Group vs. F.I.T. occupied rooms (no concept links several bookings into a group);
        and Day-Use rooms (no day-use / no-overnight concept exists).


        **Room statistic.** `totalRooms` - physical units active today (the same known
        simplification as `GET /reports/occupancy`: today's inventory, not a historical count,
        also for `lastYear`). `outOfOrder` - active units with a `RoomUnitBlock` covering the
        night (`fromDate <= date <= toDate`). `availableForSale` = `totalRooms - outOfOrder`.
        `occupied` - room-nights sold for this one night, exactly
        `GET /reports/occupancy?from=date&to=date`'s `total.roomNightsSold` (every non-`CANCELLED`
        booking's segment covering the night, checked in or not, plus an overdue guest still checked
        in past `checkOut` - see `GET /reports/occupancy`). `complimentary` / `houseUse` -
        the occupied rooms whose booking `purpose` is `COMPLIMENTARY` / `HOUSE_USE`;
        `occupiedExcludingCompAndHouseUse` = `occupied - complimentary - houseUse`.
        `occupancyPercent` = `occupied / availableForSale × 100` - out-of-order rooms are taken
        out of the denominator here, unlike `GET /reports/occupancy`, which does not subtract
        blocks. `averageRatePerOccupiedRoom` = room revenue / `occupied` (ADR-like).
        `averageRevenuePerAvailableRoom` = room revenue / `availableForSale` (RevPAR-like).


        **Guest statistic** - over the guests in house that night, exactly the rows
        `GET /reports/in-house?date=` returns (checked-in guests only, so it can be lower than
        `occupied`, which also counts rooms whose guests have not arrived yet).
        `adultsInHouse`/`childrenInHouse`/`guestsInHouse` are that report's totals.
        `averageGuestsPerRoom` = in-house guests / in-house rooms. `averageRatePerGuest` = the
        room revenue of the in-house rooms only / in-house guests. `averageLengthOfStay` - the
        in-house bookings' `checkOut - checkIn` in nights, averaged. `complimentaryGuests` /
        `houseUseGuests` - in-house guests on `COMPLIMENTARY` / `HOUSE_USE` bookings.


        **Account count.** `arrivals` / `departures` - non-`CANCELLED` bookings whose `checkIn` /
        `checkOut` is `date`, whatever their `occupancyStatus`. `walkInRooms` - those arrivals
        with `channel` `WALK_IN`. `cancellations` / `noShows` are approximations: no booking
        records *when* it was cancelled or marked no-show, so they count bookings that are `CANCELLED`
        / `NO_SHOW` *now* and whose `updatedAt` falls on `date` (hotel-local). Any later edit to
        the booking moves its `updatedAt` - a cancelled booking edited the next day stops
        counting for the day it was cancelled - and a booking cancelled and later reinstated no
        longer counts at all. Treat both as exact only for today.


        **Revenue.** `roomRevenue` - the occupancy report's room revenue for the night (segment
        `totalPrice` prorated to the night; comp and house-use bookings count at whatever price
        they carry, same as every other report). `averageRevenuePerInHouseGuest` = `roomRevenue`
        / in-house guests - unlike `averageRatePerGuest`, the numerator includes rooms sold but not
        yet checked into.


        **Tomorrow** (`date + 1`): arrivals, departures, room-nights sold and occupancy %, by the
        same rules as above.


        Every ratio is `null` when its denominator is zero; money and ratios are decimal strings
        with two decimals, rounded once from unrounded sums.
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: The night to report (Asia/Bangkok). Defaults to tonight, hotel-local.
      responses:
        "200":
          description: The manager report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerReport"
        "400":
          description: '`date` is not a valid date.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /reports/forecast:
    get:
      operationId: getForecastReport
      tags: [Reports]
      summary: Day-by-day arrivals, departures, occupancy and vacant rooms, per room type and in total (scoped legacy Z440)
      description: >
        Requires role `MANAGER` or above, same floor as the rest of `/reports/*` - forward
        planning, not routine front-desk lookup.


        **Meant for a future range.** Same `from`/`to` shape and validation as
        `GET /reports/occupancy` (inclusive hotel-local dates, `from` on or before `to`), and,
        unlike how the other reports are normally used, a `from` in the future is the ordinary
        case, not an error. A past range is accepted too and computed by the same rules.


        **One entry per date** in `[from, to]`, in date order. Each has one row per room type and
        a `total` row for the property, the same `rooms` + `total` layout as
        `GET /reports/occupancy`; the total's ratio is recomputed from its sums, not averaged.


        **Arrivals** / **departures** - non-`CANCELLED` bookings whose `checkIn` / `checkOut` is
        the date, whatever their `occupancyStatus`: exactly the manager report's own
        `accounts.arrivals` / `accounts.departures` for that date. Per room type, an arrival
        counts under the room type of its first night (where the guest actually arrives, even if
        the stay is later relocated) and a departure under the room type of its last night.


        **Occupied** - room-nights sold for that one night, exactly
        `GET /reports/occupancy?from=date&to=date`'s `roomNightsSold` (per room type, and `total`
        for the property): every non-`CANCELLED` booking's segment covering the night, checked in
        or not, a segment with no physical room assigned yet included.


        **Total rooms** / **out of order** - the manager report's room statistic, per room type:
        physical units active today (the same known simplification as the occupancy and manager
        reports - today's inventory, not a count as of that date), and active units with a
        `RoomUnitBlock` covering the date. **Vacant** = `totalRooms - occupied - outOfOrder`,
        exactly as the legacy report defines it. It is not clamped at zero: a negative value means
        more rooms are sold than are sellable that night (an overbooking, or a booked room that
        has since been blocked) - exactly what a forecast exists to surface.
        **occupancyPercent** = `occupied / (totalRooms - outOfOrder) × 100`, the manager report's
        denominator (its `tomorrow` block is this same computation for one date), so out-of-order
        rooms are taken out of it - unlike `GET /reports/occupancy`, which does not subtract
        blocks. `null` when nothing is sellable.


        A room type appears on a date if it has at least one active unit today, or any arrival,
        departure or occupied room that date. Rows are sorted by room type name.


        **Left out of the legacy Z440 layout, deliberately:**
        Allotment (no channel-allotment concept exists - rooms are not held back per channel or
        agent anywhere in this system);
        Wait / waitlist (no waitlist concept exists - a booking is either made or not);
        and Min-Max Availability (not defined clearly enough in the legacy sample to reproduce
        without guessing). They are omitted rather than filled with a stand-in figure.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: First date of the forecast, inclusive (Asia/Bangkok). Usually today or later.
        - name: to
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Last date of the forecast, inclusive (Asia/Bangkok).
      responses:
        "200":
          description: The forecast.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastReport"
        "400":
          description: '`from`/`to` missing, not a valid date, or `from` after `to`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /reports/revenue-statistic:
    get:
      operationId: getRevenueStatisticReport
      tags: [Reports]
      summary: Gross revenue, VAT and net revenue by revenue code for a date range (legacy Z410)
      description: >
        Requires role `MANAGER` or above, same floor as the rest of `/reports/*`.


        **Revenue codes.** A reporting-time classification by *where a figure comes from*, not a
        code stored on any transaction. These three are every revenue source this system records:

        - `ROOM` - exactly `GET /reports/occupancy`'s `total.roomRevenue` for the same range: every
          night inside the range of every non-`CANCELLED` booking's segments (`NEW` included), each
          segment's `totalPrice` prorated to those nights. The agreed room price, not money
          collected.

        - `FNB` - POS lines whose menu item's `department` is `KITCHEN` or `BAR`: exactly
          `GET /reports/pos-sales-mix`'s `departments` revenue for those two, for the same range
          (lines of `PAID` orders whose `Payment` falls inside the range, at the price frozen on
          each line, `ROOM_CHARGE` included).

        - `SPA` - the same POS population, `department` `SPA`: treatments bill through the POS as
          ordinary order lines. `FNB` + `SPA` is `GET /reports/pos-sales-mix`'s `totalRevenue`.

        Folio payments (money collected against room-charged POS orders) are not a separate
        source: they settle revenue already counted under `FNB`/`SPA` when the order was closed.
        There is no discount, allowance or adjustment concept anywhere in this system, so gross is
        simply the prices as charged.


        **Days.** Same as the two source reports: `ROOM` counts nights (`from`/`to` are inclusive
        nights), `FNB`/`SPA` count the Asia/Bangkok calendar day each order was paid. A stay and
        the dinner charged to it can therefore land on different days near the edges of a range.


        **VAT basis: prices are VAT-inclusive.** Nothing in this system adds tax to anything: a
        guest is charged exactly `Booking.totalPrice` for a stay and exactly an order's `total`
        (Σ `quantity × unitPrice`) for a POS order, and the printed receipt's `TOTAL` is that same
        sum with no tax line. Whatever VAT the hotel owes is therefore already inside those
        figures, and is extracted from them, never added on top:

        - `gross` - the figure as charged, rounded to two decimals once (as the source report shows it).

        - `vat` = `gross × vatRate / (100 + vatRate)`, rounded half-up to two decimals.

        - `net` = `gross - vat`, so `net + vat` is always exactly `gross`.


        **One rate for the whole range.** `vatRate` is the rate stored in `GET /settings/vat` at the
        moment this report is requested, applied uniformly to every code and every day in the
        range, and returned in the response so the figures explain themselves. The rate is not
        versioned: if it was changed during the range, the whole range is still computed at
        today's rate. This is a known simplification, not a historical VAT record.


        `rows` is always `ROOM`, `FNB`, `SPA`, in that order, zero rows included. `total` (whose
        `code` is null) is the sum of the three rows' `gross`, `vat` and `net` - the rows' own
        rounded figures added up, so it can differ by a cent from VAT computed on the total gross.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: First date of the range, inclusive (Asia/Bangkok).
        - name: to
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Last date of the range, inclusive (Asia/Bangkok).
      responses:
        "200":
          description: The three revenue codes and their total.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueStatisticReport"
        "400":
          description: '`from`/`to` missing, not a valid date, or `from` after `to`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /reports/trial-balance:
    get:
      operationId: getTrialBalanceReport
      tags: [Reports]
      summary: Debit/credit totals and balance of every ledger account as of a date (legacy Z120)
      description: >
        Requires role `MANAGER` or above, same floor as the rest of `/reports/*`.


        **Ledger go-live: no backfill.** This report reads the double-entry ledger
        (`GET /ledger/entries`), and the ledger only holds transactions posted from the moment it
        shipped. Bookings settled and POS orders closed before then were never posted and never
        will be. For any date range that includes pre-ledger activity, these figures will **not**
        reconcile with `GET /reports/revenue-statistic` (Z410), `GET /reports/occupancy` or
        `GET /reports/pos-sales-mix` - that is expected, not a bug. Two visible side effects of
        the cut-over: a folio payment collected after go-live against a room charge closed
        before it credits `Guest Ledger` with no matching earlier debit, so that account can show
        a credit (negative) balance; and a booking marked `PAID` before go-live that later leaves
        `PAID` has nothing in the ledger to reverse, so nothing is posted.


        **Even for post-go-live activity it is not the same number as Z410**, by design:

        - Room revenue is posted when a booking becomes `PAID` (the only record this system has
          of the room portion being collected), at the booking's `totalPrice` at that moment -
          Z410 counts room revenue per night stayed, whatever the status. A booking whose price
          changes while it is already `PAID` (an extension, a reprice) posts nothing for the
          difference - the same gap `PAID` already has everywhere else (its outstanding balance
          also reads zero); moving it out of `PAID` and back re-posts it at the new price.

        - VAT is extracted per transaction (same formula as Z410:
          `gross × vatRate / (100 + vatRate)`, half-up to two decimals) at the rate stored at the
          moment of posting, so the ledger's VAT is a historical record per transaction; Z410
          recomputes a whole range at today's rate from rounded per-code totals. Totals can
          differ by cents even when the populations match.


        **What posts automatically** (see `JournalSourceType`): a booking becoming `PAID`
        (Dr Cash/Bank, Cr Room Revenue + VAT Payable) and leaving `PAID` (the exact mirror of what
        was posted); a POS order closed (Dr Cash/Bank, or Guest Ledger for `ROOM_CHARGE`; Cr F&B
        and/or SPA Revenue by each line's menu department - the same classification as Z410 - plus
        VAT Payable); a folio payment (Dr Cash/Bank, Cr Guest Ledger). Everything else is a manual
        entry (`POST /ledger/entries`).


        **One row per account in the chart**, ordered by `code`, zero-activity accounts included.
        `balance` is on the account's normal side (`debit - credit` for `DEBIT`-normal accounts,
        `credit - debit` for `CREDIT`-normal ones), so a negative balance is an abnormal one.
        `totalDebit` and `totalCredit` are the sums over every row and must be equal - every
        entry is rejected at posting time unless its own lines balance - so `balanced: false`
        means a bug in the posting logic and should be reported, not worked around.
      parameters:
        - name: asOf
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Include every journal entry whose `entryDate` is on or before this date (Asia/Bangkok).
      responses:
        "200":
          description: Every account's totals and balance, plus the grand totals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrialBalanceReport"
        "400":
          description: '`asOf` missing or not a valid date.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /ledger/accounts:
    get:
      operationId: listLedgerAccounts
      tags: [Ledger]
      summary: The chart of accounts
      description: >
        Requires role `MANAGER` or above. Every account, ordered by `code`. The seven automatic
        posting accounts plus two starter accounts for manual entries (`3000` Owner Equity, `6000`
        General Expense) are seeded; anything else an ADMIN adds with `POST /ledger/accounts`.
      responses:
        "200":
          description: Every account.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LedgerAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
    post:
      operationId: createLedgerAccount
      tags: [Ledger]
      summary: Add an account to the chart
      description: >
        Requires role `ADMIN` (MANAGER included is a 403) - same tier as posting a manual entry,
        since a new account exists only to be posted to. Accounts are never renamed, retyped or
        deleted: an account's type decides which side its balance sits on, and changing it under
        existing entries would silently flip every figure already reported against it. Recorded in
        the audit log (`LEDGER_ACCOUNT_CREATED`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LedgerAccountCreateInput"
      responses:
        "201":
          description: The new account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerAccount"
        "400":
          description: A field is missing or malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: An account with this `code` already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /ledger/entries:
    get:
      operationId: listJournalEntries
      tags: [Ledger]
      summary: Journal entries dated within a range
      description: >
        Requires role `MANAGER` or above, same floor as `/reports/*`. Every entry - automatic and
        manual, reversals included - whose `entryDate` falls inside the inclusive range, oldest
        first. Only activity from ledger go-live forward exists; see
        `GET /reports/trial-balance`.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: First entry date, inclusive (Asia/Bangkok).
        - name: to
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Last entry date, inclusive (Asia/Bangkok).
      responses:
        "200":
          description: The entries, with their lines.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
        "400":
          description: '`from`/`to` missing, not a valid date, or `from` after `to`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
    post:
      operationId: createJournalEntry
      tags: [Ledger]
      summary: Post a manual journal entry
      description: >
        Requires role `ADMIN` - MANAGER included is a 403. A manual entry can claim any revenue,
        expense or cash movement against any account, which is the same "changes what the hotel's
        own financial figures say" blast radius `PUT /settings/vat` is ADMIN-only for.


        For anything the system does not model itself: expenses, vendor bills, owner draws,
        corrections. At least two lines; each line has exactly one of `debit`/`credit`, greater
        than zero; debits must equal credits, checked here on the server - an unbalanced entry is a
        400, never saved. `entryDate` may not be in the future. Posted entries are immutable: there
        is no edit or delete, a mistake is corrected with `POST /ledger/entries/{id}/reverse` and,
        if needed, a new correct entry. Recorded in the audit log (`LEDGER_ENTRY_POSTED`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryCreateInput"
      responses:
        "201":
          description: The posted entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          description: >
            Fewer than two lines, a line with both/neither of debit and credit, a non-positive or
            malformed amount, an unknown `accountCode`, a future `entryDate`, a blank
            `description`, or debits not equal to credits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /ledger/entries/{id}/reverse:
    post:
      operationId: reverseJournalEntry
      tags: [Ledger]
      summary: Post the exact mirror of an entry to cancel it out
      description: >
        Requires role `ADMIN`, same as posting a manual entry. Posts a new entry, dated today
        (Asia/Bangkok), with every line of the original and debit and credit swapped, so the two
        net to zero on every account; the original is left exactly as it was. Works on automatic
        and manual entries alike. An entry can be reversed once (a second attempt is a 409), and a
        reversal itself cannot be reversed (400) - to undo a reversal, post the correct entry
        again as a new manual entry. Recorded in the audit log (`LEDGER_ENTRY_REVERSED`).


        Reversing an automatic entry by hand does not change the booking or order behind it. If a
        booking whose settlement was reversed by hand later leaves `PAID`, the system finds
        nothing left to reverse and posts nothing, so the two paths never double-reverse.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryReverseInput"
      responses:
        "201":
          description: The reversing entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          description: Blank `description`, or the entry is itself a reversal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: The entry has already been reversed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /audit-log:
    get:
      operationId: listAuditLog
      tags: [AuditLog]
      summary: Search the audit log
      description: >
        Requires MANAGER or above. Every filter is optional and combines with AND; with none
        given, returns the most recent entries across the whole system, newest first.
        `entityType`+`entityId` together is how a specific booking's or order's own history is
        found (e.g. the booking detail page's History section calls this with
        `entityType=BOOKING&entityId={id}`) - `entityId` alone without `entityType` is rejected,
        since the same id string has no meaning without knowing which kind of record it names.
      parameters:
        - name: actorEmail
          in: query
          required: false
          schema:
            type: string
          description: >
            Case-insensitive substring match against the actor's email as it was recorded at the
            time of the action (not a live lookup against the current `User` table - see
            `AuditLogEntry.actorEmail`). Filtering by email rather than user id avoids forcing a
            MANAGER caller through the ADMIN-only `GET /users` just to find an id to filter by.
        - name: action
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AuditAction"
        - name: entityType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AuditEntityType"
        - name: entityId
          in: query
          required: false
          schema:
            type: string
          description: Requires `entityType` to also be given.
        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Inclusive start date (by `createdAt`).
        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Inclusive end date (by `createdAt`).
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: A page of matching entries, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"
        "400":
          description: '`entityId` given without `entityType`, an invalid date, or `from` after `to`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /night-audit:
    get:
      operationId: getNightAudit
      tags: [NightAudit]
      summary: The night-audit checklist for one hotel-local date
      description: >
        Requires CASHIER or above - routine front-desk work done every day, unlike the strategic
        `/reports/*` (MANAGER+). Read-only; nothing here acts on the bookings it lists.


        **`missedArrivals`**: bookings whose `occupancyStatus` is `EXPECTED`, `status` is not
        `CANCELLED`, and `checkIn` is on or before `date`. On or before, not only equal: a missed
        arrival from an earlier day that nobody resolved stays on the list until someone checks
        the guest in or marks them no-show (`POST /bookings/{id}/no-show`).


        **`missedDepartures`**: bookings whose `occupancyStatus` is `CHECKED_IN` and `checkOut` is
        on or before `date`.


        Both lists reflect the bookings' state *now*, not as it was on `date` - reviewing a past
        date shows what is still unresolved with a date on or before it, not a historical snapshot.


        **`snapshot`** is exactly `GET /reports/occupancy?from=date&to=date`'s `total` row - the
        same computation, called, not reimplemented.
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: The date to review (Asia/Bangkok). Defaults to today, hotel-local.
      responses:
        "200":
          description: The checklist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NightAudit"
        "400":
          description: '`date` is not a valid date.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"

  /night-audit/close:
    post:
      operationId: closeNightAudit
      tags: [NightAudit]
      summary: Record that a date was reviewed and closed
      description: >
        Requires CASHIER or above, same as the checklist. Writes one `NightAuditClosure` - a
        receipt that a person reviewed this date, nothing more. It does not require
        `missedArrivals`/`missedDepartures` to be empty, and closing a date prevents nothing
        afterwards: payments, folio settlements and booking edits dated into it stay allowed. One
        closure per date - a second attempt is a 409, never an overwrite. Recorded in the audit
        log (`NIGHT_AUDIT_CLOSED`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NightAuditCloseInput"
      responses:
        "200":
          description: The closure just recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NightAuditClosure"
        "400":
          description: '`date` missing or not a valid date.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "409":
          description: This date is already closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: "2026-09-27 is already closed."

  /settings/lifecycle-emails:
    get:
      operationId: getLifecycleEmailSettings
      tags: [Settings]
      summary: Read the lifecycle email settings
      description: Requires an authenticated session with role `ADMIN`. See `LifecycleEmailSettings`.
      responses:
        "200":
          description: The current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleEmailSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateLifecycleEmailSettings
      tags: [Settings]
      summary: Replace the lifecycle email settings
      description: >
        Requires an authenticated session with role `ADMIN` - MANAGER included is a 403. This
        decides what automated email reaches every eligible guest and, through
        `postStayReviewUrl`, where they're sent after checkout. Replaces every field (a full `PUT`,
        not a patch). `postStayReviewUrl` is trimmed; blank means none. Recorded in the audit log
        (`LIFECYCLE_EMAIL_SETTINGS_UPDATED`) with what changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LifecycleEmailSettingsUpdateInput"
      responses:
        "200":
          description: The updated settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleEmailSettings"
        "400":
          description: Body failed validation (a missing field, or a number out of range), or `postStayReviewUrl` isn't an http(s) URL.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /settings/vat:
    get:
      operationId: getVatSettings
      tags: [Settings]
      summary: Read the VAT rate
      description: >
        Requires an authenticated session with role `ADMIN`, same as every `/settings/*` route. A
        MANAGER doesn't need this to read the rate: `GET /reports/revenue-statistic` returns the
        rate it computed with. See `VatSettings`.
      responses:
        "200":
          description: The current VAT rate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VatSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateVatSettings
      tags: [Settings]
      summary: Change the VAT rate
      description: >
        Requires an authenticated session with role `ADMIN` - MANAGER included is a 403. Takes
        effect on the next report request; nothing is cached and no deploy or restart is needed.
        The rate is not versioned: every report computes with the rate stored at the moment it is
        requested, for its whole range. Recorded in the audit log (`VAT_SETTINGS_UPDATED`) with
        the old and new rate; an unchanged value records nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VatSettingsUpdateInput"
      responses:
        "200":
          description: The updated VAT rate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VatSettings"
        "400":
          description: '`vatRate` missing, below 0, above 99.99, or with more than two decimals.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: List staff users
      description: Requires an authenticated session with role `ADMIN`.
      responses:
        "200":
          description: All staff users (no `passwordHash`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      tags: [Users]
      summary: Create a staff user
      description: Requires an authenticated session with role `ADMIN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateInput"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Body failed `userCreateSchema` validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Email already in use (Prisma `P2002` unique constraint).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: A user with that email already exists

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateUserRole
      tags: [Users]
      summary: Change a staff user's role
      description: >
        Requires an authenticated session with role `ADMIN`. An admin
        cannot change their own role (blocked before any DB write).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleUpdateInput"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: '`id` in the path is the caller''s own id, or body failed `userRoleUpdateSchema` validation.'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/ErrorMessage"
              examples:
                selfRoleChange:
                  value: { error: "You can't change your own role" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: User not found (Prisma `P2025`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: User not found

  /users/{id}/functions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateUserFunctions
      tags: [Users]
      summary: Set a staff user's job functions
      description: >
        Requires an authenticated session with role `ADMIN` - job functions are managed under
        `/users/**` alongside role, password and active-state, not through any lower-privilege
        route. Replaces the full set (send every function this user should have; an empty array
        clears all of them). Unlike `PATCH /users/{id}` (role), `PATCH /users/{id}/password`, and
        `PATCH /users/{id}/active`, this does not bump `tokenVersion` and does not invalidate any
        existing token - `JwtAuthFilter` grants `FUNCTION_<name>` authorities from a fresh read of
        this user on every request already (the same row it re-reads to check `active`/
        `tokenVersion`), so a change here is enforced on the very next request with no re-login
        needed. `warning` in the response is set when this change removes `THERAPIST` from a
        user who holds future `BOOKED` spa appointments - see `UserUpdateResult`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserFunctionsUpdateInput"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserUpdateResult"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: User not found

  /users/{id}/password:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: resetUserPassword
      tags: [Users]
      summary: Reset another staff user's password
      description: >
        Requires an authenticated session with role `ADMIN`. No `currentPassword` check -
        this is an administrative reset for when the current password can't be trusted
        (e.g. a suspected compromise), not a self-service change (see `PATCH /auth/password`
        for that). Increments the target user's `tokenVersion`, immediately invalidating
        every token already issued to them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: User not found

  /users/{id}/credentials:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: grantUserCredentials
      tags: [Users]
      summary: Give a no-login staff account the ability to authenticate
      description: >
        Requires an authenticated session with role `ADMIN`. For a `User` created without an
        `email`/`password` (see `UserCreateInput`) - a dishwasher who becomes a receptionist, say.
        Sets both at once; the account can log in immediately afterward. Rejected with 409 if the
        target already has an email - this endpoint's only job is the no-login-to-login
        transition, not changing an existing login email (there is no such operation today).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCredentialsInput"
      responses:
        "200":
          description: Credentials granted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: User not found
        "409":
          description: The target already has login credentials, or the email is already in use by another account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                alreadyHasCredentials:
                  value: { error: "This user already has login credentials" }
                emailInUse:
                  value: { error: "A user with that email already exists" }

  /users/{id}/active:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateUserActive
      tags: [Users]
      summary: Enable or disable a staff user
      description: >
        Requires an authenticated session with role `ADMIN`. Disabling a user
        (`active: false`) rejects every request bearing one of their tokens on the very
        next request, regardless of that token's remaining validity window - the closest
        thing this stateless-JWT system has to revoking access on termination. An admin
        cannot disable their own account (blocked before any DB write, same guard as
        `PATCH /users/{id}` for role changes). `warning` in the response is set when disabling
        this user leaves future `BOOKED` spa appointments assigned to them - see `UserUpdateResult`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserActiveUpdateInput"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserUpdateResult"
        "400":
          description: '`id` in the path is the caller''s own id, or body failed validation.'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/ErrorMessage"
              examples:
                selfDisable:
                  value: { error: "You can't disable your own account" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: User not found

  /users/{id}/overtime-eligibility:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateUserOvertimeEligibility
      tags: [Users]
      summary: Set whether a staff user is eligible for overtime
      description: >
        Requires an authenticated session with role `ADMIN`. See `User.overtimeEligible`'s own
        description for why this is a per-person flag rather than something derived from a shift
        code. No self-change restriction, and no `tokenVersion` bump - unlike role/active, this
        can't lock the caller out of anything and doesn't affect authentication. Nothing in this
        API computes or accrues overtime pay from this flag; it only records the fact.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserOvertimeEligibilityUpdateInput"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: User not found

  /users/{id}/name:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateUserName
      tags: [Users]
      summary: Rename a staff user
      description: >
        Requires an authenticated session with role `ADMIN`. Changes `User.name` - see that
        field's own description for the retroactive-relabeling consequence: every screen that
        reads `name` live (punch logs, the roster grid and its Excel export, the spa therapist
        list, the admin Users screen) shows the new name for past records too, which is the point
        for a typo fix or a legal name change. Audit log `summary` text is the exception - it was
        written once, at the time of each action, and keeps whatever name it was written with.
        `name` cannot be cleared: it is trimmed, and a blank or whitespace-only value is a 400
        (there is no "send null to clear" case, unlike `PATCH /users/{id}/full-name`). No
        self-change restriction, and no `tokenVersion` bump - `name` is not carried in the JWT,
        so renaming doesn't affect anyone's session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserNameUpdateInput"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Body failed validation, or `name` was blank after trimming.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/ErrorMessage"
              examples:
                blank:
                  value: { error: "name must not be blank" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: User not found

  /users/{id}/full-name:
