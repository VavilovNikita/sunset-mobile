          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Order not found
        "429":
          description: Too many requests for this token within the rate-limit window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
