      tags: [PublicOrdering]
      summary: Add items to an order as a guest (public)
      description: >
        Unauthenticated - gated entirely by `token`, same 404-for-everything contract as
        `GET /public/orders/{id}` (see `OrderService#requireGuestAccess`). Delegates straight
        into `OrderService#addItems` - the same merge-into-unsent-line and re-order-ticket-print
        behavior `POST /orders/{id}/items` gives staff, not a second implementation of it. Rate
        limited per `token` (`GuestOrderRateLimiter`, same shape as `BookingRateLimiter`) - this
        is the app's second unauthenticated write endpoint after `POST /bookings`, and one QR
        code being hammered shouldn't be able to flood the kitchen printer.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      requestBody:
