openapi: 3.0.3
info:
  title: Sunset Beach Resort & Spa — Admin/Booking API
  description: >
    Contract reverse-engineered from the current Next.js route handlers under
    `app/api/**/route.ts`. It documents exactly what each route accepts and
    returns today (including quirks such as Prisma `Decimal`/`Date` JSON
    serialization), so it can serve as a migration contract for a backend
    rewrite in another language. No behavior was changed to produce this spec.
  version: "1.0.0"
  license:
    name: Proprietary
  x-codegen-notes: >
    A property marked `x-sensitive: true` (guest email/phone, payment notes) is redacted as
    "[REDACTED]" in its generated model's toString() by the customized pojo.mustache template
    under openapi-templates/ - see scripts/generate-api.sh, which passes --template-dir. This is
    the one and only place PII redaction needs to be declared; it survives regeneration
    automatically. Do not hand-edit a generated model's toString() to redact a field instead -
    mark the field here and regenerate.
servers:
  - url: /api
    description: Relative to the deployed Next.js app origin.

tags:
  - name: Auth
    description: >
      Self-hosted authentication - this app owns the `User` table and issues/verifies
      its own JWTs. Replaces the old NextAuth.js-managed cookie session.
  - name: GuestAccountAuth
    description: >
      Public registration/login for a brand-new, persistent guest identity (`GuestAccount`) -
      entirely separate from staff `Auth`/`User`/`Role` and from the CRM-facing `Guests` tag.
      Names deliberately don't collide with either: this is a guest creating their own
      self-service account (email + password, email-verified), not a staff member managing a
      `Guest` contact card. Issues its own JWT, signed with its own secret
      (`app.security.guest-jwt-secret`) - a guest token can never satisfy a staff-only route and
      a staff token can never satisfy `GuestAccount`, even if a filter were misconfigured later,
      because the two schemes don't share a key. `register`/`resend-verification` return the same
      generic message regardless of whether the email is already registered/verified, and
      `login` returns the same generic "Invalid email or password" for a wrong email or a wrong
      password - same anti-enumeration posture as `Auth.login` - but a *correct* password against
      an unverified account gets its own distinct, actionable error, since a correct password
      already proves legitimate possession of the account and there's nothing left to hide.
      All four operations are rate-limited (see each operation's own 429).
  - name: GuestAccount
    description: >
      Authenticated actions for a verified `GuestAccount` - profile, self-service password
      change, and read-only booking history. Booking history follows the account's link to its
      CRM `Guest` card: every `Booking` whose `guestId` is that card - the same stay history staff
      see on `GET /guests/{id}`. Both links are made automatically by email (an account on
      registration/verification, a booking on creation - see `GuestDetail.account`), so a guest
      who verifies an email that already has past stays under it sees them immediately, with no
      manual linking step. Requires a guest JWT (`Authorization: Bearer <token>` from
      `GuestAccountAuth`), never a staff one - see that tag's own description.
  - name: GuestOrder
    description: >
      Room-service ordering for a verified, currently `CHECKED_IN` guest (`Authorization: Bearer`
      guest JWT, same as `GuestAccount`) - a separate tag/generated `GuestOrderApi` from both
      `GuestAccount` (identity, not ordering) and `PublicOrdering` (unauthenticated, token-gated
      dine-in, not account-gated room charges), same one-tag-per-concern convention as elsewhere
      in this spec. A room-service order is an ordinary `Order` with `bookingId` set and no
      `tableId` - not a second order concept - opened, added to, and sent through the same
      `OrderService` machinery staff and dine-in QR ordering already use. Every operation here
      re-verifies, against the named booking, both that `Booking.guestEmail` matches this
      account's own verified email (case-insensitively) and that `Booking.occupancyStatus` is
      `CHECKED_IN` at the moment of the call - not just at order creation, since a guest can be
      checked out between two room-service actions. `GET /guest/orders/{id}` is the one exception:
      it checks ownership only, not occupancy, so a guest can still see their own receipt after
      checkout. Every failure - wrong booking, not checked in, an order that isn't this guest's
      own room-service order - collapses to the same generic 404, so a guessing attempt learns
      nothing about which reason applies (same discipline as `PublicOrdering`'s
      `OrderService#requireGuestAccess`).
  - name: Rooms
    description: Room (room *type*) CRUD and image management (staff only).
  - name: RoomUnits
    description: >
      Physical room CRUD (MANAGER or above) - individual sellable units of a Room type
      ("203", "Garden Bungalow 4"), plus per-unit manual blocks (date range + reason) that
      replace the old Room-level `Availability.blockedCount`.
  - name: Pricing
    description: Per-day rate overrides for a room (staff only).
  - name: Availability
    description: >
      Day-by-day type- and unit-level availability for a room (staff only, read-only - manual
      blocking now lives on RoomUnits).
  - name: Bookings
    description: >
      Guest booking creation (public) and status management (CASHIER or above - front-desk
      day-to-day work). `GET /bookings/export` is the one MANAGER+ exception - see that
      operation.
  - name: Guests
    description: >
      The guest as a person, distinct from a booking's own frozen `guestName`/`guestEmail`/
      `guestPhone` snapshot (CASHIER or above). A `Guest` is created explicitly, never inferred,
      and linking one to a booking (`PUT /bookings/{id}/guest`) is a separate, optional,
      reversible action - see `Booking.guestId`/`guest` for why the two coexist.
  - name: Menu
    description: POS menu item catalog (staff reads, MANAGER or above manages).
  - name: Tables
    description: POS restaurant/bar/spa/pool tables (staff reads, MANAGER or above manages).
  - name: RestaurantMap
    description: >
      The restaurant floor plan - a background image with every non-SPA table placed on it. The
      third copy of the `PropertyMap`/`SpaMap` mechanism (any staff reads, MANAGER or above
      replaces the image; tables are placed via `PATCH /tables/positions`).
  - name: Orders
    description: >
      POS orders and their line items (WAITER or above opens/edits; CASHIER or above closes
      or cancels — cancel is available to WAITER too, only closing requires CASHIER).
  - name: Shifts
    description: POS cashier shift open/close and cash reconciliation (CASHIER or above).
  - name: Payments
    description: Cross-shift POS payment reporting for a date range (MANAGER or above).
  - name: Reports
    description: Financial exports for the hotel's accountant, and occupancy, sales-mix, guest-value and manager reports (MANAGER or above); the in-house list (CASHIER or above).
  - name: NightAudit
    description: >
      The front desk's once-a-day review (CASHIER or above): a checklist of bookings that should
      have arrived or departed and didn't, the day's room figures, and a record that someone
      looked at them and closed the day. Deliberately not a ledger process - a folio balance is
      computed live on every read (see `BookingFolio`), so there is nothing to post or batch
      overnight. Closing a day blocks, locks and changes nothing else.
  - name: Printers
    description: >
      ESC/POS network printer CRUD and connection testing (MANAGER or above), plus the durable
      print-job queue (WAITER or above, with per-role document visibility - see
      `GET /print-jobs`). Printing is best-effort and asynchronous where it needs
      to be: an unreachable printer never fails the order/shift operation that triggered it - it
      leaves a `PENDING`/`FAILED` `PrintJob` behind instead, retried automatically in the
      background and retriable by hand from here. A `FAILED` job that a retry can't fix (the
      printer was replaced, the order already reached the guest, the kitchen was told by voice)
      can be closed instead of retried - `POST /print-jobs/dismiss` marks it (never deletes it)
      and drops it out of the default list and any failed-job count/indicator built from it.
  - name: Users
    description: Staff account management (ADMIN only).
  - name: Settings
    description: >
      Hotel-wide configuration. ADMIN only, same tier as `Users` and outside the role hierarchy's
      usual MANAGER floor for admin screens: what lives here changes what goes into every guest's
      inbox, or what the hotel's own VAT figures are computed with.
  - name: Ledger
    description: >
      Double-entry general ledger: a chart of accounts and immutable, balanced journal entries.
      Bookings becoming (or leaving) `PAID`, POS order closes and folio payments post
      automatically; everything else (expenses, vendor bills, owner draws, corrections) is a
      manual entry. Reads MANAGER+, writes ADMIN only. Holds activity from its go-live forward
      only - nothing earlier was backfilled; see `GET /reports/trial-balance`.
  - name: SiteMinder
    description: >
      One-way import of reservations from SiteMinder (the channel manager) into this system. Our
      own polling script reads SiteMinder's reservation screens and posts each reservation it
      finds to `POST /integrations/siteminder/reservations`. Nothing is ever pushed back to
      SiteMinder. Guest email and phone aren't available yet (SiteMinder masks them until
      trusted-device access is set up), so an imported booking and its guest card carry a name
      only. SiteMinder's room type names are translated to this system's room types through a
      MANAGER-maintained mapping table (`/integrations/siteminder/room-type-mappings`).
  - name: AuditLog
    description: >
      Read-only, append-only record of significant staff actions - money and guest-data
      operations (booking status/schedule/price changes, relocation, order close/cancel, shift
      open/close, exports, user/room-unit management). Written internally from the service layer on the
      relevant write path, never through a dedicated write endpoint - there is no POST, PATCH,
      or DELETE here for any role. Requires MANAGER or above: the operational disputes this
      exists to resolve (a cash discrepancy, a guest billing question, a suspected misuse of a
      role) are exactly the kind of thing a manager needs to investigate without escalating to
      an admin first, the same reasoning already applied to `GET /payments/summary` and the
      booking/shift CSV exports.
  - name: Public
    description: >
      Unauthenticated, guest-facing reads for the public site (room listing,
      room detail, monthly pricing/availability for the booking calendar) and
      static serving of uploaded room images. Distinct from the staff-only
      Rooms/Pricing/Availability tags: no session required, and availability
      here never reveals whether a blocked day is a real booking or a manual
      staff block.
  - name: PublicOrdering
    description: >
      Unauthenticated dine-in QR ordering: a guest scans a code printed for their table's
      already-open `Order` and reads/adds to it from their own phone, no account required.
      A separate tag (and generated `PublicOrderingApi`) from `Public`/`PublicApi` purely so
      this stays its own controller (`GuestOrderingController`) rather than folding guest
      ordering into `PublicController` - same one-controller-per-tag convention as everywhere
      else in this spec. Gated entirely by a per-order `token` query parameter matched against
      `Order.guestAccessToken` (see `OrderService#requireGuestAccess`) - there is no login, and
      the same 404 is returned whether the token is wrong, the order doesn't exist, or the
      order is no longer `OPEN`/`SENT`, so a guessing attempt learns nothing.
  - name: PropertyMap
    description: >
      The front desk's visual map of the property (CASHIER or above) - every physical room
      placed on a floor-plan image, colored by current state (occupied/vacant/dirty/blocked/
      debt), a dedicated addition to the existing Today Board (what to do today) and booking
      calendar (what's coming up), not a replacement for either. Placing rooms on the plan
      (`PATCH /room-units/positions`) and replacing the background image are MANAGER or above;
      viewing is CASHIER or above, same floor as `GET /bookings/today`. Internal only - unlike
      Rooms' image endpoints, nothing here is reachable from the public site.
  - name: Roster
    description: >
      The staff work schedule - not `Shifts` (a cash-drawer session) or `Payments` (cross-shift
      cash reconciliation). See `RosterEntry`'s own description for the roster/attendance
      naming split this module is built around. Viewing the full grid, editing it, setting
      coverage minimums and employee patterns, and reading pay/attendance data are all MANAGER
      or above - every employee (any role) may read their own entries via `GET /roster/me`, and
      `GET /shift-codes` (what a code on the grid actually means) is open to any authenticated
      staff member for exactly that reason.

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Log in with email/password
      description: >
        Verifies `email`/`password` against `User.passwordHash` (bcrypt) and, on
        success, returns a JWT to send as `Authorization: Bearer <token>` on
        subsequent requests. No server-side session is created.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Email not found or password incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Invalid email or password
        "429":
          description: >
            More than 5 failed attempts for this IP/email pair within the last 15 minutes
            (LoginRateLimiter) - wait for the window to pass and try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Too many failed login attempts. Try again later.

  /auth/register:
    post:
      operationId: registerUser
      tags: [Auth]
      summary: Create a staff user (alias of POST /users)
      description: >
        Requires an authenticated session with role `ADMIN`. Identical
        behavior to `POST /users` - see that operation for the full response/
        error shape.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateInput"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Body failed `userCreateSchema` validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Email already in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: A user with that email already exists

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Get the currently authenticated user
      description: "Requires a valid `Authorization: Bearer` JWT."
      responses:
        "200":
          description: The authenticated user (no `passwordHash`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/password:
    patch:
      operationId: changeOwnPassword
      tags: [Auth]
      summary: Change your own password
      description: >
        Requires a valid `Authorization: Bearer` JWT for any staff role. Verifies
        `currentPassword` against the caller's own `passwordHash` before accepting
        `newPassword`, then increments the user's `tokenVersion` - every other token
        already issued to this account (other devices/tabs, or a token that leaked)
        is rejected on its very next request. The response carries a fresh token so
        the session making this call keeps working without a re-login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed - a fresh token is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing/invalid token, or `currentPassword` is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Current password is incorrect

  /guest-auth/register:
    post:
      operationId: registerGuestAccount
      tags: [GuestAccountAuth]
      summary: Create a guest account (unverified)
      description: >
        Creates a `GuestAccount` with `emailVerifiedAt` null and emails a verification link
        (`EmailService#sendGuestVerificationEmail`, same fail-open contract as every other
        `EmailService` method - the account is still created even if the email send fails).
        Never returns a token - the account can't authenticate until verified.

        Always returns the same 200 with a generic message, regardless of what's already true
        about `email`: if it already has a *verified* account, nothing is created or changed and
        no email is sent, so a caller can't use this to learn whether an email is registered. If
        it already has an *unverified* account (an abandoned signup), no second account is
        created - the existing one's verification token is simply regenerated and re-sent.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestAccountRegisterInput"
      responses:
        "200":
          description: >
            Always this, whether or not `email` was free, already pending, or already verified -
            see this operation's own description.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestAccountMessage"
              example:
                message: If this email isn't already registered, we've sent a verification link.
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "429":
          description: Too many registration attempts from this IP/email recently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Too many requests. Please slow down and try again.

  /guest-auth/verify:
    post:
      operationId: verifyGuestAccount
      tags: [GuestAccountAuth]
      summary: Verify a guest account's email
      description: >
        A `POST`, not a `GET` a link click could fire by itself (prefetch, an email client's own
        link-scanning) - verification is a mutating, one-shot action, not a page view. Looks up
        the account by `token`, checks it against `emailVerificationExpiresAt` (24h from issue by
        default, see `app.guest-account.verification-ttl-hours`), sets `emailVerifiedAt`, clears
        the token, and returns a `guestBearerAuth` token so the guest is logged in immediately -
        no separate login step after verifying.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestAccountVerifyInput"
      responses:
        "200":
          description: Verified - `token` logs the guest in immediately.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestAccountAuthResponse"
        "400":
          description: Token is unknown, already used, or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Invalid or expired verification token
        "429":
          description: Too many verification attempts from this IP recently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Too many requests. Please slow down and try again.

  /guest-auth/resend-verification:
    post:
      operationId: resendGuestAccountVerification
      tags: [GuestAccountAuth]
      summary: Resend the verification email
      description: >
        Same generic response every time, whether `email` doesn't exist, is already verified, or
        is genuinely pending - only an unverified account actually gets a new token and a new
        email (regenerating the token, same as a fresh `register` of an already-pending email).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestAccountResendVerificationInput"
      responses:
        "200":
          description: Always this - see this operation's own description.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestAccountMessage"
              example:
                message: If this email has a pending verification, we've sent a new link.
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "429":
          description: Too many resend attempts from this IP/email recently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Too many requests. Please slow down and try again.

  /guest-auth/login:
    post:
      operationId: loginGuestAccount
      tags: [GuestAccountAuth]
      summary: Log in with email/password
      description: >
        Wrong email or wrong password both return the identical generic 401 below - same
        discipline as `Auth.login`, so a caller can't tell which is wrong. A *correct* password
        against an account whose `emailVerifiedAt` is still null is different: the password
        already proves this caller legitimately owns the account, so there's nothing left to hide
        - it gets its own distinct, actionable 403 instead of the generic message.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestAccountLoginInput"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestAccountAuthResponse"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Email not found or password incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Invalid email or password
        "403":
          description: Password is correct, but this account's email isn't verified yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Please verify your email before logging in.
        "429":
          description: Too many failed attempts for this IP/email pair recently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Too many failed login attempts. Try again later.

  /guest-auth/forgot-password:
    post:
      operationId: requestGuestAccountPasswordReset
      tags: [GuestAccountAuth]
      summary: Email a password-reset link
      description: >
        Same generic response every time, whether or not `email` has an account - so this can't
        be used to find out who is registered. When it does, a single-use reset token is
        generated (only its SHA-256 is stored), valid for 1 hour, replacing any earlier one, and
        emailed as a link to the site's `/guest/reset-password` page. Rate limited per IP and per
        email exactly like `register`/`resend-verification` (`GuestAccountAuthRateLimiter`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestAccountForgotPasswordInput"
      responses:
        "200":
          description: Always this - see this operation's own description.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestAccountMessage"
              example:
                message: If this email has an account, we've sent a link to reset the password.
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "429":
          description: Too many attempts from this IP/email recently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Too many requests. Please slow down and try again.

  /guest-auth/reset-password:
    post:
      operationId: resetGuestAccountPassword
      tags: [GuestAccountAuth]
      summary: Set a new password with an emailed reset token
      description: >
        Consumes the token from `forgot-password` (unknown, used or expired all give the same
        400). Sets the new password, clears the token, and bumps `tokenVersion`, which signs out
        every guest token issued before. Holding the emailed token proves control of the mailbox,
        so an account whose email was never verified becomes verified here too - which also means
        whoever first registered an address without verifying it loses that account to the
        mailbox's real owner. Returns a `guestBearerAuth` token, like `verify`, so the guest is
        signed in straight away.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestAccountResetPasswordInput"
      responses:
        "200":
          description: Password changed - `token` signs the guest in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestAccountAuthResponse"
        "400":
          description: Body failed validation, or the token is unknown, already used, or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: This reset link is invalid or has expired.
        "429":
          description: Too many attempts from this IP recently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Too many requests. Please slow down and try again.

  /guest-auth/unsubscribe:
    get:
      operationId: unsubscribeGuestAccount
      tags: [GuestAccountAuth]
      summary: Opt a guest account out of lifecycle emails
      description: >
        The target of the unsubscribe link in every automated lifecycle email (pre-arrival,
        post-stay, win-back - see `LifecycleEmailSettings`). No login: a guest clicking a link in
        an email must not have to sign in first. `token` is the account's own stable
        `unsubscribeToken` - issued once, never rotated or cleared, so a link in an old email keeps
        working. Sets `marketingEmailsOptOut` on the matching account, which stops all three email
        types at once (there is no per-type opt-out). Idempotent: repeating it on an
        already-opted-out account changes nothing and returns the same response. Transactional
        emails the guest caused themselves (verification, booking status) are unaffected.

        The email's link points at the site's own `/guest/unsubscribe` page, which calls this -
        so a mail client's link scanner that fetches the page without running its script
        doesn't opt anyone out by itself.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Opted out (or already was).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestAccountMessage"
              example:
                message: You've been unsubscribed. You won't receive any more of these emails.
        "400":
          description: No account has this token (a mistyped or truncated link).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: This unsubscribe link isn't valid.
        "429":
          description: Too many attempts from this IP recently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Too many requests. Please slow down and try again.

  /guest/me:
    get:
      operationId: getCurrentGuestAccount
      tags: [GuestAccount]
      summary: Get the currently authenticated guest account
      description: "Requires a valid guest `Authorization: Bearer` JWT (see `GuestAccountAuth`)."
      security:
        - guestBearerAuth: []
      responses:
        "200":
          description: The authenticated guest account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestAccount"
        "401":
          description: Missing/invalid/expired guest token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /guest/bookings:
    get:
      operationId: listCurrentGuestBookings
      tags: [GuestAccount]
      summary: This guest's booking history
      description: >
        Every `Booking` linked (`guestId`) to this account's own `Guest` card, newest
        (`createdAt`) first - past, current, and future stays alike, and exactly the set staff see
        on that card (see the `GuestAccount` tag's own description). An account with no card link
        (its email matched more than one `Guest`, so none was picked) falls back to every
        `Booking` whose `guestEmail` matches the account's own email, case-insensitively.
        Deliberately narrow, guest-facing `GuestBookingView`, never the staff
        `Booking` shape (no `paymentNote`, `source`, `guestId`/`guest`, `roomUnitId`/`roomUnit`,
        occupancy timestamps, or anything else staff-internal).
      security:
        - guestBearerAuth: []
      responses:
        "200":
          description: This guest's bookings, newest first. Empty array if none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GuestBookingView"
        "401":
          description: Missing/invalid/expired guest token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /guest/password:
    patch:
      operationId: changeGuestAccountPassword
      tags: [GuestAccount]
      summary: Change your own guest account password
      description: >
        Same shape as `Auth.changeOwnPassword`: verifies `currentPassword` against this account's
        own `passwordHash`, then bumps `tokenVersion` - every other guest token already issued to
        this account is rejected on its next request. The response carries a fresh token so this
        session keeps working without a re-login.
      security:
        - guestBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestPasswordChangeInput"
      responses:
        "200":
          description: Password changed - a fresh token is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestAccountAuthResponse"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing/invalid guest token, or `currentPassword` is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Current password is incorrect

  /guest/orders:
    post:
      operationId: submitGuestOrder
      tags: [GuestOrder]
      summary: Place a room-service order
      description: >
        The guest's own "place my order" action - there's no waiter to separately confirm and
        send the way dine-in staff do, so this doesn't stop at `OPEN`: it creates the `Order`
        (`bookingId` set, `tableId` null), adds `items`, and immediately transitions it to `SENT`
        (dispatching the kitchen/bar ticket, same as `PATCH /orders/{id}` does for staff). `403`/
        `not found`-style distinctions are deliberately never surfaced - see the `GuestOrder` tag's
        own description for why `bookingId` failing any of "exists" / "is yours" / "is currently
        `CHECKED_IN`" all return the same 404. Rate limited per guest account, same shape as
        `PublicOrdering.addPublicOrderItems`.
      security:
        - guestBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestOrderSubmitInput"
      responses:
        "201":
          description: Order placed and sent - the order's guest-facing view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestOrderView"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing/invalid/expired guest token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: >
            `bookingId` doesn't exist, isn't this guest's own booking, or isn't currently
            `CHECKED_IN` - all three collapse to this one response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Booking not found
        "429":
          description: Too many requests from this guest account recently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Too many requests. Please slow down and try again.

  /guest/orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getGuestOrder
      tags: [GuestOrder]
      summary: Get a room-service order's guest-facing view
      description: >
        Ownership check only (this order's `bookingId` belongs to this guest account) - no
        `CHECKED_IN` requirement, so a guest can still see their own room-service receipt after
        checkout.
      security:
        - guestBearerAuth: []
      responses:
        "200":
          description: The order's guest-facing view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestOrderView"
        "401":
          description: Missing/invalid/expired guest token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Unknown order, or it isn't this guest's own room-service order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Order not found

  /guest/orders/{id}/items:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: addGuestOrderItems
      tags: [GuestOrder]
      summary: Order another round on an already-open room-service order
      description: >
        Re-verifies ownership and `CHECKED_IN` again (not just at the original `submitGuestOrder`
        call - see the `GuestOrder` tag's own description), then delegates straight into
        `OrderService#addItems` - the same merge-into-unsent-line and re-order-ticket-print
        behavior staff and dine-in QR ordering get, not a second implementation of it. Rate
        limited per guest account, same shape as `submitGuestOrder`.
      security:
        - guestBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/OrderItemInput"
      responses:
        "201":
          description: Items added; the order's updated guest-facing view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestOrderView"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing/invalid/expired guest token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: >
            Unknown order, it isn't this guest's own room-service order, or the booking is no
            longer `CHECKED_IN` - all collapse to this one response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Order not found
        "429":
          description: Too many requests from this guest account recently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Too many requests. Please slow down and try again.

  /rooms:
    get:
      operationId: listRooms
      tags: [Rooms]
      summary: List all rooms
      description: >
        Requires CASHIER or above - a CASHIER quoting a room type for a walk-in via
        `POST /bookings/staff` needs to read this list, not just create against it (the same
        "action allowed, prerequisite read blocked" fix already applied to RoomUnits/Availability).
        Writes (create/update/delete, images) stay MANAGER-only. No pagination (small hotel).
        Broader context: at this property CASHIER is a combined cashier/front-desk role (see
        `POST /bookings/staff`'s description) - this is a deliberate scoping decision covering
        this operation and `GET /pricing/{roomId}`, `GET /bookings`, `GET /bookings/calendar`,
        and `GET /availability/{roomId}` together, not five independent oversights to flag one
        by one in review.
      responses:
        "200":
          description: All rooms.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createRoom
      tags: [Rooms]
      summary: Create a room
      description: Requires any authenticated staff session (ADMIN or MANAGER).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "201":
          description: Room created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Body failed `roomSchema` validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /rooms/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRoom
      tags: [Rooms]
      summary: Get a room by id
      description: >
        Requires CASHIER or above (see `GET /rooms`). Also used to prefill the admin edit form
        for MANAGER/ADMIN.
      responses:
        "200":
          description: The room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found
    patch:
      operationId: updateRoom
      tags: [Rooms]
      summary: Update a room
      description: Requires any authenticated staff session (ADMIN or MANAGER). Full replacement of all `roomSchema` fields (no partial update).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "200":
          description: Updated room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Body failed `roomSchema` validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found (Prisma `P2025`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found
    delete:
      operationId: deleteRoom
      tags: [Rooms]
      summary: Delete a room
      description: Requires any authenticated staff session (ADMIN or MANAGER).
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkTrue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found (Prisma `P2025`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found
        "409":
          description: Room has existing bookings or room units and cannot be deleted (Prisma `P2003`, FK constraint).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: This room has existing bookings and can't be deleted.

  /rooms/{id}/images:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: uploadRoomImages
      tags: [Rooms]
      summary: Upload one or more room images
      description: >
        Requires any authenticated staff session (ADMIN or MANAGER). Files
        are written to `public/uploads/rooms/{id}/` under a randomized
        filename and appended to `Room.images`. All files in the request are
        validated (type + size) before any are written; the first violation
        aborts the whole request.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: One or more image files. Field name must be repeated as `files` per file.
              required: [files]
      responses:
        "201":
          description: Room updated with the new image paths appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: No files provided, an unsupported MIME type, or a file over 8MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                noFiles:
                  value: { error: "No files provided" }
                unsupportedType:
                  value: { error: "Unsupported file type: image/gif" }
                tooLarge:
                  value: { error: "photo.jpg exceeds the 8MB limit" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found
    delete:
      operationId: deleteRoomImage
      tags: [Rooms]
      summary: Remove a room image
      description: >
        Requires any authenticated staff session (ADMIN or MANAGER). Removes
        the given path from `Room.images` and, if it points under this
        room's upload directory, deletes the file from disk (best-effort —
        failure to unlink is ignored).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: Exact image path as stored in `Room.images`, e.g. `/uploads/rooms/{id}/169...-ab12cd.jpg`.
      responses:
        "200":
          description: Room updated with the image path removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: '`path` missing or not a string.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: path is required
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found

  /pricing/{roomId}:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRoomPricing
      tags: [Pricing]
      summary: Get per-day prices for a room for a given month
      description: >
        Requires CASHIER or above - a CASHIER needs to quote a price to a walk-in guest
        through an authenticated endpoint rather than the public site (see `GET /rooms`
        for the same reasoning). Setting a price override (`PATCH`, below) stays MANAGER-only.
        Part of the same deliberate combined cashier/front-desk role scoping - see
        `POST /bookings/staff`'s description for the full reasoning.
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          description: 'Month key `YYYY-MM`. Defaults to the current UTC month.'
      responses:
        "200":
          description: Base price and the resolved price for every day of the month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found
    patch:
      operationId: setRoomPricing
      tags: [Pricing]
      summary: Set a price override for a date range
      description: >
        Requires any authenticated staff session (ADMIN or MANAGER). Upserts
        one `RatePlan` row per day in `[from, to]` (inclusive). Rejects
        ranges longer than 366 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceRangeInput"
      responses:
        "200":
          description: Number of days upserted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkUpdated"
        "400":
          description: Body failed `priceRangeSchema` validation, or the range exceeds 366 days.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/ErrorMessage"
              examples:
                tooLarge:
                  value: { error: "Range too large (max 366 days)" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found

  /availability/{roomId}:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRoomAvailability
      tags: [Availability]
      summary: Get day-by-day, type- and unit-level availability for a room for a given month
      description: >
        Requires CASHIER or above - part of the same deliberate combined cashier/front-desk role
        scoping as `GET /rooms`/`GET /bookings`/`GET /bookings/calendar` (see
        `POST /bookings/staff`'s description for the full reasoning). Returns the full per-day inventory breakdown at the
        room-type level (`unitCount`, `blockedCount`, `bookedCount`, `availableCount`) *and* a
        per-unit breakdown (`units[]`) so staff can see exactly which physical room is
        blocked/booked/free on each day - the data both the future booking calendar grid and
        `PUT /bookings/{id}/room-unit` (also CASHIER+) are built on. A day counts as booked if
        it is covered by a non-CANCELLED booking (`checkIn <= date < checkOut`); a booking
        without an assigned unit still counts toward `bookedCount` but against no specific entry
        in `units[]`. Manual blocking is no longer done here - see the RoomUnits tag
        (`POST /room-units/{id}/blocks`).
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          description: 'Month key `YYYY-MM`. Defaults to the current UTC month.'
      responses:
        "200":
          description: Availability for every day of the month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found

  /room-units:
    get:
      operationId: listRoomUnits
      tags: [RoomUnits]
      summary: List physical rooms
      description: >
        Requires any authenticated staff session (ADMIN/MANAGER/CASHIER/WAITER) - room numbers
        aren't sensitive, and e.g. a CASHIER needs this to pick a candidate before calling
        `PUT /bookings/{id}/room-unit`. Manual blocks (`GET /room-units/{id}/blocks`) are a
        separate, more restricted resource - see that operation.
      parameters:
        - name: roomId
          in: query
          required: false
          schema:
            type: string
          description: Filter to units of a single room type.
      responses:
        "200":
          description: Matching room units.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomUnit"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createRoomUnit
      tags: [RoomUnits]
      summary: Create a physical room
      description: Requires MANAGER or above.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUnitInput"
      responses:
        "201":
          description: Room unit created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomUnit"
        "400":
          description: Body failed validation, or `roomId` does not reference an existing room type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "409":
          description: '`label` is already in use by another room unit (unique hotel-wide).'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: This label is already in use by another room.

  /room-units/positions:
    patch:
      operationId: saveRoomUnitPositions
      tags: [RoomUnits]
      summary: Place (or un-place) physical rooms on the property map
      description: >
        Requires MANAGER or above. Batch: the manager's editor drags several rooms around and
        saves once, so this takes an array and applies it in one transaction rather than one
        request per drag. Every entry is validated (range, paired nulls, `roomUnitId` exists)
        before any write happens - the same all-or-nothing approach as
        `POST /rooms/{id}/images`. `positionX`/`positionY` both null clears a unit's position
        (returns it to "not placed"). See `PropertyMap`/`GET /property-map`, which reads these
        same coordinates back for the map screen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/RoomUnitPositionInput"
      responses:
        "200":
          description: The updated room units.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomUnit"
        "400":
          description: A position outside 0..1, an entry with only one of positionX/positionY set, or an unknown roomUnitId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /room-units/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateRoomUnit
      tags: [RoomUnits]
      summary: Rename or (de)activate a physical room
      description: >
        Requires MANAGER or above. Full replacement of `label`/`isActive` (no partial update).
        The room type (`roomId`) is fixed at creation and cannot be changed here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUnitUpdateInput"
      responses:
        "200":
          description: Updated room unit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomUnit"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Room unit not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: >
            `label` collides with another room unit, or deactivating (`isActive: false`) is
            rejected because this unit has a non-cancelled booking assigned with a future
            checkout date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                labelTaken:
                  value: { error: This label is already in use by another room. }
                hasUpcomingBooking:
                  value: { error: "Room 203 has an upcoming booking assigned and can't be deactivated." }
    delete:
      operationId: deleteRoomUnit
      tags: [RoomUnits]
      summary: Delete a physical room
      description: Requires MANAGER or above. Also deletes this unit's blocks.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkTrue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Room unit not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: This room unit has a non-cancelled booking assigned with a future checkout date and can't be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: "Room 203 has an upcoming booking assigned and can't be deleted."

  /room-units/{id}/housekeeping:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateRoomUnitHousekeeping
      tags: [RoomUnits]
      summary: Mark a physical room clean or dirty
      description: >
        Requires CASHIER or above - deliberately a lower bar than the rest of `/room-units/**`
        (MANAGER+), since front desk is who actually needs to flip this day to day. Independent
        of `PATCH /room-units/{id}` (label/isActive) and of `RoomUnitBlock` (which pulls a unit
        off sale for a reason, not a cleaning state) - see `HousekeepingStatus`'s own
        description.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HousekeepingStatusInput"
      responses:
        "200":
          description: Updated room unit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomUnit"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Room unit not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /room-units/{id}/blocks:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listRoomUnitBlocks
      tags: [RoomUnits]
      summary: List manual blocks for a physical room
      description: >
        Requires MANAGER or above - deliberately more restricted than `GET /room-units`/
        `GET /room-units/{id}`, which any staff role may call. `reason` is free text staff write
        for each other and can carry internal notes, so this list is not exposed to CASHIER/
        WAITER the way the room list itself is; do not assume the two endpoints share visibility.
      responses:
        "200":
          description: Blocks for this room unit.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomUnitBlock"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Room unit not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      operationId: createRoomUnitBlock
      tags: [RoomUnits]
      summary: Pull a physical room off sale for a date range
      description: >
        Requires MANAGER or above. Creating a block never cancels, moves, or otherwise touches a
        booking - if the blocked range overlaps one or more non-CANCELLED bookings assigned to
        this unit, the block is still created and `RoomUnitBlockResult.warning` is set instead;
        see that schema's own description for the overlap rule. Overlapping blocks on the same
        unit are allowed (not merged).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUnitBlockInput"
      responses:
        "201":
          description: Block created, with a warning set if it overlaps any bookings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomUnitBlockResult"
        "400":
          description: Body failed validation (includes `fromDate <= toDate`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Room unit not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /room-units/{id}/blocks/{blockId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: blockId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteRoomUnitBlock
      tags: [RoomUnits]
      summary: Remove a manual block
      description: Requires MANAGER or above.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkTrue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Room unit or block not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /guests:
    get:
      operationId: searchGuests
      tags: [Guests]
      summary: Search guests by name, email, or phone
      description: >
        Requires CASHIER or above. Case-insensitive substring match against `name`, `email`, or
        `phone` - one field checked matches, not all three - same mechanism as the existing
        `GET /bookings?guestName=` filter, widened to the three fields a guest card actually has.
        `q` empty or omitted returns every guest (newest first) rather than erroring, matching
        `GET /bookings?guestName=`'s own precedent - useful for a small property's guest list,
        not only for lookup. Powers both the standalone guest search screen and, on the client
        side, the booking-detail/check-in link action: that action calls this endpoint with the
        booking's own `guestEmail` and then its `guestPhone` to surface likely matches without
        the reception user typing anything, and with the entered value on plain guest creation
        to warn before making a duplicate - both are pure client-side uses of this one endpoint,
        not separate operations.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matching guests, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
    post:
      operationId: createGuest
      tags: [Guests]
      summary: Create a guest
      description: >
        Requires CASHIER or above. Never checks for a likely duplicate itself - `GET /guests?q=`
        is how a caller checks first, and is expected to be called for exactly that reason (see
        `Guest`'s own description on why merging is out of scope).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestCreateInput"
      responses:
        "201":
          description: Guest created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"

  /guests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getGuest
      tags: [Guests]
      summary: Get a guest's card, including stay history
      description: Requires CASHIER or above. See `GuestDetail` for why `bookings` carries no rolled-up total.
      responses:
        "200":
          description: Guest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Guest not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    patch:
      operationId: updateGuest
      tags: [Guests]
      summary: Update a guest's contact details and notes
      description: Requires CASHIER or above. Full replacement, same convention as `PATCH /room-units/{id}` - no partial update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestUpdateInput"
      responses:
        "200":
          description: Updated guest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Guest not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteGuest
      tags: [Guests]
      summary: Delete a guest
      description: >
        Requires CASHIER or above. Blocked while any booking still references this guest -
        past or future, unlike `RoomUnit` deletion which only blocks on upcoming bookings - a
        guest's stay history is the entire point of the entity, so deleting a guest with any
        recorded stay would silently orphan that history rather than protect anything. Unlink
        first (`PUT /bookings/{id}/guest` with `guestId: null`) if the record genuinely needs to
        go.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkTrue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Guest not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Guest has bookings on record and can't be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                hasBookings:
                  value: { error: "This guest has bookings on record and can't be deleted." }

  /maintenance-tasks:
    get:
      operationId: listMaintenanceTasks
      tags: [MaintenanceTasks]
      summary: List maintenance tasks
      description: >
        Requires any authenticated staff session - the same floor as filing one (`POST`, below).
        A role that can file a task must be able to see it again; this project already treats
        that "can act but can't see" asymmetry as a bug it has introduced and fixed three times
        elsewhere (see `SecurityConfig`'s own notes on `/room-units`/`/rooms`/`/availability`).
        No filters - the admin board loads every task and filters client-side (see
        `MaintenanceTaskBoard.tsx`); a `status`/`roomUnitId` query filter used to exist here but
        was never sent by any real caller and was removed.
      responses:
        "200":
          description: Every task, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createMaintenanceTask
      tags: [MaintenanceTasks]
      summary: File a maintenance task against a physical room
      description: >
        Requires any authenticated staff session - the person who notices a problem is usually
        the one standing in the room, not necessarily a manager. Creates the task with status
        `OPEN` and no block (see `POST /maintenance-tasks/{id}/block` for that, `MANAGER` or
        above only). Photos are optional (zero or more, not every problem is photographable) and
        validated/stored the same way as `POST /rooms/{id}/images`/`POST /property-map/image`
        (see `ImageUploadValidator`): content-sniffed type, 8MB cap each, randomized filenames.
        Unlike room photos these are never reachable under `/uploads/**` - see
        `GET /maintenance-tasks/{id}/photos/{filename}`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [roomUnitId, description]
              properties:
                roomUnitId:
                  type: string
                description:
                  type: string
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Zero or more image files. Field name must be repeated as `photos` per file.
      responses:
        "201":
          description: Task created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceTask"
        "400":
          description: Missing `roomUnitId`/`description`, or a photo failed validation (type/size).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room unit not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /maintenance-tasks/{id}/photos/{filename}:
    get:
      operationId: getMaintenanceTaskPhoto
      tags: [MaintenanceTasks]
      summary: Serve one photo attached to a maintenance task
      description: >
        Requires any authenticated staff session. Staff-only, like `GET /property-map/image` -
        not reachable under `/uploads/**`: a photo of, say, a broken air conditioner in a guest
        room is not public-site content the way a room's own marketing photos are.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The image file.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Task or photo not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /maintenance-tasks/{id}/block:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: blockMaintenanceTaskRoom
      tags: [MaintenanceTasks]
      summary: Pull this task's room off sale
      description: >
        Requires `MANAGER` or above - blocking a room stays a manager decision; filing a task
        does not require one. Reuses `RoomUnitBlockInput`/`RoomUnitService#createBlock` as-is
        (same overlap warning, same `fromDate <= toDate` validation) rather than a narrower
        schema - the manager still enters both dates, `toDate` being their best guess at when the
        work finishes (see `PATCH /maintenance-tasks/{id}/status`, which corrects it to the day
        work actually finished). Rejected if this task already has a block - remove the existing
        one via `DELETE /room-units/{id}/blocks/{blockId}` first if it needs replacing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUnitBlockInput"
      responses:
        "200":
          description: >
            Task updated with the new block, plus the same overlap-warning result
            `POST /room-units/{id}/blocks` itself returns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceTaskBlockResult"
        "400":
          description: Body failed validation, or this task already has a block.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /maintenance-tasks/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateMaintenanceTaskStatus
      tags: [MaintenanceTasks]
      summary: Move a maintenance task through OPEN -> IN_PROGRESS -> DONE
      description: >
        Requires the `ENGINEER` job function, or role `MANAGER` or above - a manager is the
        fallback for this if nobody currently holds the function (see `JobFunction`). The
        function half is not expressed as a role check: `FUNCTION_ENGINEER` is its own authority,
        unrelated to `RoleHierarchy` (see `SecurityConfig#roleHierarchy`'s own note on this).
        Forward-only - skipping `IN_PROGRESS` is allowed, going backward or repeating the current
        status is not. Transitioning to `DONE`, when this task has a block, moves that block's
        `toDate` to yesterday (today is still covered by an inclusive `toDate`, so the room must
        not return to sale until the day after it's actually fixed) - or deletes the block
        outright if yesterday is before the block's own `fromDate` (created and fixed the same
        day, so it never covered a usable night). If the block was already removed by other means,
        closing succeeds and touches no block.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceTaskStatusUpdateInput"
      responses:
        "200":
          description: Updated task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceTask"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenEngineerOrManagerPlus"
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Not a valid forward transition from the task's current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /property-map:
    get:
      operationId: getPropertyMap
      tags: [PropertyMap]
      summary: Get the property map (background image + every room's current state)
      description: >
        Requires any authenticated staff session (CASHIER or above) - same floor as
        `GET /bookings/today`. Returns every physical room, placed or not; `PropertyMap.units[]`
        never omits an unplaced room, it just carries null `positionX`/`positionY`.
      responses:
        "200":
          description: The property map.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyMap"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"

  /property-map/image:
    get:
      operationId: getPropertyMapImage
      tags: [PropertyMap]
      summary: Serve the property map's background image
      description: >
        Requires any authenticated staff session (CASHIER or above) - unlike room photos
        (`GET /uploads/rooms/{roomId}/{filename}`), this is not reachable from the public site,
        so it isn't served under `/uploads/**`. No filename in the path: since there is exactly
        one current image, the server resolves it from the `PropertyMap` row itself - there is
        no client-supplied path segment to validate against traversal at all.
      responses:
        "200":
          description: The image file.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: No property map image has been uploaded yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      operationId: uploadPropertyMapImage
      tags: [PropertyMap]
      summary: Upload (or replace) the property map's background image
      description: >
        Requires MANAGER or above. Same validation as `POST /rooms/{id}/images` (content-sniffed
        type, 8MB cap, randomized filename) - see `ImageUploadValidator`. Replacing the image
        does not touch any `RoomUnit.positionX`/`positionY` - those live in a separate table and
        are addressed only by `PATCH /room-units/positions`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "201":
          description: The updated property map.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyMap"
        "400":
          description: No file provided, an unsupported MIME type, or a file over 8MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /bookings:
    get:
      operationId: listBookings
      tags: [Bookings]
      summary: List bookings
      description: >
        Requires CASHIER or above - finding a guest's booking is front-desk work, not a
        MANAGER-only report (contrast with `GET /bookings/export`, which stays MANAGER+: a
        single-booking lookup and a bulk CSV of every guest's contact details are different risk
        profiles). Filters mirror `GET /bookings/export` (`guestName` is the one exception - see
        below). Ordered by `checkIn` ascending. Part of the same deliberate combined
        cashier/front-desk role scoping as `GET /rooms`/`GET /pricing/{roomId}` - see
        `POST /bookings/staff`'s description for the full reasoning.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Include bookings whose `checkOut` is after this date (i.e. still relevant on/after `from`).
        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: 'Include bookings whose `checkIn` is on or before this date - together with `from`, a proper closed-range/half-open-stay overlap test (so `from=to=<today>` finds a booking checking in today).'
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/BookingStatus"
        - name: guestName
          in: query
          required: false
          schema:
            type: string
          description: >
            Case-insensitive substring match against `guestName` - lets a phone-sized "charge to
            room" picker search by typing instead of scrolling a long list of same-day bookings.
            Not available on `GET /bookings/export` (that stays a bulk date-range report, not a
            guest lookup tool).
      responses:
        "200":
          description: Matching bookings, ordered by `checkIn` ascending.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createBooking
      tags: [Bookings]
      summary: Create a booking (public — guest-facing, no session required)
      description: >
        Intentionally unauthenticated: guests are not logged in. The server
        recomputes `totalPrice` from `Room.basePrice`/`RatePlan` and
        re-validates availability itself inside a `Serializable` transaction
        — nothing the client sends about price or availability is trusted.
        Sends a new-booking notification email on success.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCreateInput"
      responses:
        "201":
          description: Booking created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Body failed `bookingCreateSchema` validation (includes `checkIn < checkOut`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found
        "409":
          description: >
            Requested dates are no longer available — either lost a race to
            another booking (checked inside the transaction) or the
            underlying Postgres serialization failure (Prisma `P2034`) from
            a concurrent conflicting request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                unavailable:
                  value: { error: "Selected dates are no longer available" }
                serializationConflict:
                  value: { error: "Someone just booked these dates — please try again." }

  /bookings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getBooking
      tags: [Bookings]
      summary: Get a booking by id
      description: >
        Requires CASHIER or above. Used by the admin detail/status-change screen and by front
        desk before deciding whether/how to change a booking's status or assign it a physical
        room (`PUT /bookings/{id}/room-unit`, also CASHIER+).
      responses:
        "200":
          description: The booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Booking not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Booking not found
    patch:
      operationId: updateBookingStatus
      tags: [Bookings]
      summary: Update a booking's status / payment note / channel / purpose / guest counts
      description: >
        Requires CASHIER or above - marking a booking paid/cancelled, adding a payment note or
        correcting the booking's channel, purpose or party size is routine front-desk work. Each
        of `channel`/`purpose`/`adults`/`children` is independent: omitted leaves it as it is,
        present sets it. Sends a guest-facing status-change email when the status actually changes
        to PAID or CANCELLED - never for a request that only touches the other fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingStatusInput"
      responses:
        "200":
          description: Updated booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Body failed `bookingStatusSchema` validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Booking not found (Prisma `P2025`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Booking not found

  /bookings/{id}/room-unit:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: assignBookingRoomUnit
      tags: [Bookings]
      summary: Assign or unassign the physical room for a booking
      description: >
        Requires CASHIER or above. One endpoint for both directions: a non-null `roomUnitId`
        assigns that physical room to the booking, `null` clears the assignment. Deliberately
        not part of `PATCH /bookings/{id}` - room assignment has its own validation (same room
        type, active, free for the whole stay) and its own race-safety story (SERIALIZABLE,
        same pattern as `POST /bookings`), so it gets its own operation. Only legal while the
        booking has exactly one segment (see `Booking.segments`) - once a booking has been split
        by `POST /bookings/{id}/relocate`, "the room" is no longer a single well-defined value
        this endpoint's one `roomUnitId` can express. `PUT /bookings/{id}/segments/{segmentId}/
        room-unit` is the sibling built for that case - the same validation and race-safety
        story, addressed at a named segment instead of implicitly "the sole segment"; this
        endpoint stays as the convenient shorthand for the common never-relocated case, it isn't
        superseded by the sibling existing. `relocate`/`undo-relocation` remain the tools for
        anything that also changes dates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUnitAssignmentInput"
      responses:
        "200":
          description: Updated booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: The room unit belongs to a different room type, or is not active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                wrongType:
                  value: { error: "Room 5 is a different room type than this booking" }
                inactive:
                  value: { error: "Room 5 is not active" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Booking or room unit not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: >
            The room unit is blocked or already booked for an overlapping stay - either found
            up front or from a concurrent conflicting assignment (Postgres serialization
            failure, SQLSTATE `40001`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                blocked:
                  value: { error: "Room 5 is blocked (under renovation) from 2026-08-05 to 2026-08-09" }
                booked:
                  value: { error: "Room 5 is already booked for an overlapping stay" }
                raceLost:
                  value: { error: "Someone just assigned this room — please try again." }
                multiSegment:
                  value: { error: "This booking has been split by a room relocation — change dates via relocate/undo-relocate, or one segment's own room via PUT .../segments/{segmentId}/room-unit." }

  /bookings/{id}/segments/{segmentId}/room-unit:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: segmentId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: assignBookingSegmentRoomUnit
      tags: [Bookings]
      summary: Assign or unassign the physical room for one segment of a booking
      description: >
        Requires CASHIER or above. The sibling `PUT /bookings/{id}/room-unit` was built for -
        same validation (same room type as this segment's own `roomId`, active, free for this
        segment's own dates) and the same SERIALIZABLE race-safety story, just addressed at a
        named segment instead of implicitly "the sole segment", so it works on any segment of
        any booking regardless of how many segments it has. Never touches dates, segment
        boundaries, or any other segment's own row. Never reprices: moving between two units of
        the *same* room type is not a new agreement - the segment's already-frozen nightly rates
        (`BookingSegmentNightlyRate`) are untouched either way, the same "same type, same price"
        guarantee `PUT /bookings/{id}/room-unit` already gives a never-relocated booking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUnitAssignmentInput"
      responses:
        "200":
          description: Updated booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: The room unit belongs to a different room type than this segment, or is not active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                wrongType:
                  value: { error: "Room 5 is a different room type than requested" }
                inactive:
                  value: { error: "Room 5 is not active" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Booking not found, segment not found (or doesn't belong to this booking), or room unit not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: >
            The room unit is blocked or already booked for an overlapping stay - either found
            up front or from a concurrent conflicting assignment (Postgres serialization
            failure, SQLSTATE `40001`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                blocked:
                  value: { error: "Room 5 is blocked (under renovation) from 2026-08-05 to 2026-08-09" }
                booked:
                  value: { error: "Room 5 is already booked for an overlapping stay" }
                raceLost:
                  value: { error: "Someone just assigned this room — please try again." }

  /bookings/{id}/segments/{segmentId}/swap-room-unit:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: segmentId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: swapBookingSegmentRoomUnit
      tags: [Bookings]
      summary: Swap this segment's physical room with another segment's, atomically
      description: >
        Requires CASHIER or above. The operation a drag that drops one booking's bar onto
        another's needs: two sequential `PUT .../room-unit` calls cannot do this, because moving
        the first guest into the second guest's room fails the overlap check while the second
        guest's own segment is still sitting there. This does both moves in one SERIALIZABLE
        write, each side's availability checked against a world where neither move has happened
        yet - each segment's own dates must be free in the *other's* current room unit,
        excluding only these two named segments, not their whole parent bookings (a relocated
        booking's *other* segments elsewhere still conflict-check normally) and not excluding
        anyone else - a third segment genuinely occupying part of the target unit for an
        overlapping sub-range still blocks the swap, named in the 409 the same way an ordinary
        assignment names it.

        Same room type only, checked before any availability work: the two segments' own `roomId`
        must be equal, or this is a 400, not a 409. A cross-type swap would mean either repricing
        both segments retroactively at today's rate, or leaving one guest paying the other
        room type's already-agreed price - this API does neither silently, the same reasoning
        `BookingWriter`'s "Nightly price snapshots" section already gives for every other
        schedule-touching write. A same-type swap reprices nothing: each segment keeps its own
        already-frozen nightly rates, only `roomUnitId` moves.

        Both segments must already have a physical room assigned - swapping with nothing isn't a
        swap, it's a single-sided assignment; use `PUT .../room-unit` for that. Writes one audit
        entry under each booking's own id, naming the other guest, so each booking's own history
        shows the move.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwapSegmentRoomUnitInput"
      responses:
        "200":
          description: >
            This segment's own updated booking. The other booking named in the request also
            changed (its own segment's `roomUnitId` swapped the other way) - fetch it separately
            (`GET /bookings/{id}`) or refetch the calendar window to see it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: The two segments' room types differ, one of the segments has no room unit assigned, or the two segment ids are the same.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                wrongType:
                  value: { error: "These segments are different room types and can't be swapped" }
                unassigned:
                  value: { error: "Both rooms must already have a physical room assigned to swap them" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Booking not found, this segment not found (or doesn't belong to this booking), or the other segment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: >
            One side's own dates are already booked in the other's room by a third segment, or a
            concurrent conflicting write lost the race (Postgres serialization failure, SQLSTATE
            `40001`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                booked:
                  value: { error: "Room 5 is already booked for an overlapping stay" }
                raceLost:
                  value: { error: "Someone just changed one of these rooms — please try again." }

  /bookings/{id}/guest:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: assignBookingGuest
      tags: [Bookings]
      summary: Link or unlink the Guest record for a booking
      description: >
        Requires CASHIER or above. One endpoint for both directions, same shape as
        `PUT /bookings/{id}/room-unit`: a non-null `guestId` links that guest to the booking,
        `null` clears the link. New bookings are already linked automatically by email when one
        `Guest` card matches it unambiguously; this is for corrections. Relinking to a different
        guest needs no confirmation and no state check - nothing contends for a guest link the
        way `PUT /bookings/{id}/room-unit` contends for inventory. It is not inconsequential,
        though: which `Guest` a booking points to decides both that card's stay history
        (`GET /guests/{id}`) and whose self-service account lists the booking
        (`GET /guest/bookings`), so linking a booking to the wrong card shows that stay to the
        wrong guest. Never touches
        `guestName`/`guestEmail`/`guestPhone` - those stay frozen exactly as given at booking
        time regardless of what this endpoint does.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingGuestLinkInput"
      responses:
        "200":
          description: Updated booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Booking or guest not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /bookings/staff:
    post:
      operationId: createStaffBooking
      tags: [Bookings]
      summary: Create a booking as staff (front-desk / walk-in), optionally assigning a room immediately
      description: >
        Requires CASHIER or above. Distinct from the public `POST /bookings` guest-inquiry flow:
        no new-booking notification email is sent, guest email/phone are optional (a walk-in may
        not have one on hand), and if `roomUnitId` is given the room is assigned in the same
        `Serializable` transaction as the booking - never a separate call, so there is no window
        where the booking exists without the room the staff member asked for. `totalPrice` is
        always server-computed from `Room.basePrice`/`RatePlan`, same as every other booking
        creation path.


        This is also the anchor for a broader, deliberate role-scoping decision: at this
        property, CASHIER is a combined cashier/front-desk reception role, not a payments-only
        till operator. Creating this kind of booking requires reading room types and their
        prices to quote a walk-in, and requires reading existing bookings/the calendar/
        availability to know what can even be offered - so `GET /rooms`, `GET /pricing/{roomId}`,
        `GET /bookings`, `GET /bookings/calendar`, and `GET /availability/{roomId}` are all
        CASHIER+ too. That is intentional breadth in support of this endpoint's own job, not five
        separate oversights to flag in review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffBookingCreateInput"
      responses:
        "201":
          description: Booking created (and room assigned, if `roomUnitId` was given).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Body failed validation, or `roomUnitId` belongs to a different room type / is not active.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/ErrorMessage"
              examples:
                wrongType:
                  value: { error: "Room 5 is a different room type than this booking" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Room (or room unit) not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: >
            Requested dates are no longer available at the type level, or `roomUnitId` is blocked
            or already booked for an overlapping stay - either found up front or from a
            concurrent conflicting request (Postgres serialization failure, SQLSTATE `40001`).
            The whole operation is atomic: on conflict, no booking is created at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /bookings/staff/quote:
    post:
      operationId: quoteStaffBooking
      tags: [Bookings]
      summary: Preview the price and availability of a new staff booking without creating it
      description: >
        Requires CASHIER or above, same as `POST /bookings/staff`. Non-mutating: prices the nights
        at the current rates exactly as `POST /bookings/staff` would (the same `BookingWriter`
        pricing and the same availability and room-unit checks), without a `Serializable`
        transaction and without writing anything. Advisory only - the create call re-validates and
        re-prices from scratch, so a concurrent booking or a rate change between preview and create
        can still change the answer. A separate operation rather than a `dryRun` flag, same
        reasoning as `POST /bookings/{id}/schedule/quote`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffBookingQuoteInput"
      responses:
        "200":
          description: >
            Computed price and availability. Returned even when `available: false` - a successful
            computation whose answer is "no", not an error. `totalPrice` is computed either way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingScheduleQuote"
        "400":
          description: Body failed validation (includes `checkIn < checkOut`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Room (or room unit) not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /bookings/calendar:
    get:
      operationId: getBookingsCalendar
      tags: [Bookings]
      summary: Get everything the booking calendar grid needs for a date range
      description: >
        Requires CASHIER or above - part of the same deliberate combined cashier/front-desk role
        scoping as `GET /rooms`/`GET /bookings` (see `POST /bookings/staff`'s description for the
        full reasoning: a CASHIER checking a guest in needs to see what's booked and available,
        not just create against it). Answers a different question than
        `GET /availability/{roomId}` - that endpoint is a per-room-type, per-month
        occupancy/pricing matrix (booleans and counts); this one is a booking-identity read
        model across every room type at once (guest name, status, exact `bookingId` per stay) for
        rendering and driving the drag/resize calendar grid. Deliberately a new purpose-built
        endpoint rather than a third way to compute availability: it does not duplicate
        `GET /availability/{roomId}`'s per-day occupancy formula (the shared server-side
        computation both endpoints rely on for `availableCount` lives in one place, see
        `RoomTypeDailyAvailability`), it just also returns booking/guest identity that endpoint
        never has. `from`/`to` accept an arbitrary range (not just a calendar month), capped at
        366 days so the grid can show up to a year on one screen - still capped, not unbounded,
        so a request for an arbitrarily large range is rejected with a clear error rather than
        made to time out or exhaust memory.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: to
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Exclusive end of the range (same `[from, to)` convention as a stay).
      responses:
        "200":
          description: Calendar data for `[from, to)`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingCalendarResponse"
        "400":
          description: Malformed dates, `from >= to`, or range exceeds 366 days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: "Range too large (max 366 days)"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /bookings/{id}/schedule:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateBookingSchedule
      tags: [Bookings]
      summary: Change a booking's dates and/or physical room in one operation
      description: >
        Requires CASHIER or above. One operation for what the booking calendar grid does with a
        mouse - extend/shorten a stay, move to a different room, or both at once - rather than
        three separate endpoints: dragging a reservation to a new row *and* new dates at the same
        time must not pass through an intermediate state where only one has changed. `totalPrice`
        is always recomputed server-side from `Room.basePrice`/`RatePlan` for the new dates,
        never accepted from the client. Re-validates availability with the same `Serializable`
        race-safety as `POST /bookings` / `PUT /bookings/{id}/room-unit`, correctly excluding the
        booking's own current reservation from the conflict check (so extending a stay is never
        blocked by the booking's own prior dates). See `POST /bookings/{id}/schedule/quote` to
        preview the new price/availability before calling this.


        For a booking split across more than one room by `POST /bookings/{id}/relocate` (see
        `Booking.segments`), a single `checkIn`/`checkOut`/`roomUnitId` triple only has a
        well-defined meaning when it moves exactly one outer edge of the stay: `checkIn` alone
        (an earlier/later arrival, applied to the first segment) or `checkOut` alone (extending
        or shortening the stay, applied to the last segment - the most common front-desk request
        on an already-relocated booking), each without crossing into the segment next to it. Any
        other combination - both dates moving at once, or neither (a bare room change with no
        segment named to apply it to) - has no single segment this shape can address, and is
        rejected with 409: both-dates-moving in favor of `relocate`/`undo-relocation`, a bare room
        change in favor of `PUT /bookings/{id}/segments/{segmentId}/room-unit`, which names a
        segment explicitly instead of guessing one from a dateless request. A date that crosses
        into the neighboring segment is rejected with 400 instead - it is a genuinely invalid
        request, not a race or an ambiguity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingScheduleInput"
      responses:
        "200":
          description: Updated booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: >
            Body failed validation (includes `checkIn < checkOut`), `roomUnitId` belongs to a
            different room type / is not active, or (multi-segment booking only) the requested
            date crosses into the neighboring segment.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/ErrorMessage"
              examples:
                boundaryCrossing:
                  value: { error: "New check-out must stay after 2026-09-08 - crossing into the previous segment isn't a schedule change, it's an undo-relocation." }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Booking or room unit not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: >
            The new dates are no longer available at the type level, `roomUnitId` is blocked or
            already booked for an overlapping stay, a concurrent conflicting change was detected
            (Postgres serialization failure, SQLSTATE `40001`), or (multi-segment booking only)
            the change would touch more than one segment (both dates moving, or neither).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                unavailable:
                  value: { error: "Selected dates are no longer available" }
                raceLost:
                  value: { error: "Someone just changed this booking's schedule — please try again." }
                multiSegment:
                  value: { error: "This booking has been split by a room relocation — change dates via relocate/undo-relocate, or one segment's own room via PUT .../segments/{segmentId}/room-unit." }

  /bookings/{id}/schedule/quote:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: quoteBookingSchedule
      tags: [Bookings]
      summary: Preview the price/availability of a schedule change without applying it
      description: >
        Requires CASHIER or above. Non-mutating preview for `PATCH /bookings/{id}/schedule` -
        same request body, no `Serializable` transaction (nothing is written), so this is
        advisory only: the apply call re-validates from scratch and is the sole source of truth.
        A separate operation rather than a `dryRun` flag on the PATCH above, so the two contracts
        stay simple - one always mutates and returns the updated `Booking`, the other never
        mutates and always returns a quote, instead of one endpoint whose response shape depends
        on a flag. Used by the booking calendar grid to show the recalculated price and a
        would-this-succeed signal before the user confirms a drag/resize.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingScheduleInput"
      responses:
        "200":
          description: >
            Computed price and availability for the requested schedule. Returned even when
            `available: false` - this is a successful computation whose answer is "no", not an
            error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingScheduleQuote"
        "400":
          description: Body failed validation (includes `checkIn < checkOut`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Booking not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /bookings/{id}/relocate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: relocateBooking
      tags: [Bookings]
      summary: Move a guest to a different room partway through their stay
      description: >
        Requires CASHIER or above. Splits the segment covering `effectiveDate` into two: the
        existing room/unit keeps `[that segment's checkIn, effectiveDate)`, and a new segment
        for `[effectiveDate, that segment's checkOut)` takes `roomId`/`roomUnitId` - the new room
        may be a different room *type* than the one being left, at that type's own price.
        `effectiveDate` must fall strictly after the containing segment's own checkIn (relocating
        on a segment's first night is "assign this segment a different room", i.e.
        `PUT /bookings/{id}/room-unit` or `PATCH /bookings/{id}/schedule` when there is only one
        segment - not a mid-stay move). Same three checks on the *new* room/unit as
        `PUT /bookings/{id}/room-unit` (same type, active, free for the new segment's dates), same
        `Serializable` race-safety as `POST /bookings`. See `POST /bookings/{id}/relocate/quote`
        to preview the recalculated total before calling this, and
        `POST /bookings/{id}/undo-relocation` to reverse it. Recorded in the audit log with who,
        from which room, to which room, and effective from which date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelocationInput"
      responses:
        "200":
          description: Updated booking, now with an extra segment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: >
            Body failed validation, `effectiveDate` does not fall strictly inside an existing
            segment, or `roomUnitId` belongs to a different room type / is not active.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Booking, room, or room unit not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: >
            The new room type/unit has no availability for the new segment's dates - either found
            up front or from a concurrent conflicting change (Postgres serialization failure,
            SQLSTATE `40001`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                unavailable:
                  value: { error: "Selected room type has no availability for that period" }
                booked:
                  value: { error: "Room 5 is already booked for an overlapping stay" }
                raceLost:
                  value: { error: "Someone just booked these dates — please try again." }

  /bookings/{id}/relocate/quote:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: quoteBookingRelocation
      tags: [Bookings]
      summary: Preview the price/availability of a relocation without applying it
      description: >
        Requires CASHIER or above. Non-mutating preview for `POST /bookings/{id}/relocate` - same
        request body, no `Serializable` transaction. `totalPrice` in the response is the whole
        booking's *new* total (every unaffected segment's price, plus the shrunk old segment's
        recomputed price, plus the new segment's price) - the same shape
        `POST /bookings/{id}/schedule/quote` returns, reused rather than a second near-identical
        response schema; `nights` describes the *new* segment being created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelocationInput"
      responses:
        "200":
          description: >
            Computed whole-booking total and availability for the requested relocation. Returned
            even when `available: false`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingScheduleQuote"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Booking or room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /bookings/{id}/undo-relocation:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: undoBookingRelocation
      tags: [Bookings]
      summary: Reverse a relocation, merging two segments back into one
      description: >
        Requires CASHIER or above. The inverse of `POST /bookings/{id}/relocate`: merges the two
        segments meeting at `splitDate` back into one, keeping the *earlier* segment's room -
        undoing a relocation means "this move didn't happen," so the room reverts to what covered
        that whole span before it. `splitDate` must be an existing boundary (some segment's
        `checkOut` equal to the next segment's `checkIn`) - not a no-op write: the earlier room's
        unit/type may no longer be free for the range it is about to re-absorb (something else
        may have booked it in the meantime, since the relocation made it look free), so this
        re-runs the same availability check `relocate` does, under the same `Serializable`
        isolation. Recorded in the audit log the same way `relocate` is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelocationUndoInput"
      responses:
        "200":
          description: Updated booking, with the two segments merged into one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Body failed validation, or `splitDate` is not an existing segment boundary.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Booking not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: >
            The earlier room's type/unit no longer has availability for the merged period - either
            found up front or from a concurrent conflicting change (Postgres serialization
            failure, SQLSTATE `40001`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                unavailable:
                  value: { error: "Cannot undo — the earlier room type has no availability for the merged period" }
                raceLost:
                  value: { error: "Someone just booked these dates — please try again." }

  /bookings/{id}/reprice/quote:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: quoteBookingReprice
      tags: [Bookings]
      summary: Preview repricing a segment's future nights to current rates, without applying it
      description: >
        Requires MANAGER or above - a deliberate override of an already-agreed price, not a
        front-desk administration of a guest's own request, so this sits one tier above the
        CASHIER-level schedule/relocate operations. Non-mutating preview for
        `POST /bookings/{id}/reprice` - same request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepriceInput"
      responses:
        "200":
          description: Computed old/new segment totals and how many nights would be repriced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepriceQuote"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Booking not found, or segmentId does not belong to this booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /bookings/{id}/reprice:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: repriceBooking
      tags: [Bookings]
      summary: Reprice a segment's future nights to current rates
      description: >
        Requires MANAGER or above. Recomputes only the named segment's nights from today onward
        (inclusive) at today's `RatePlan`/`Room.basePrice` rates - nights already stayed are
        never touched, even when this is invoked mid-stay. This is the one explicit, deliberate
        way to move an already-agreed price forward; every other write in this API (extending,
        shortening, or relocating a stay) preserves whatever was already agreed for nights that
        were already part of the booking, pricing only genuinely new nights. A segment with
        nothing left to reprice (entirely in the past) is a legitimate no-op, not an error.
        Recorded in the audit log with the before/after totals.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepriceInput"
      responses:
        "200":
          description: Updated booking, with the named segment's total (and the booking's overall total) recomputed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Booking not found, or segmentId does not belong to this booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /bookings/today:
    get:
      operationId: getTodayBoard
      tags: [Bookings]
      summary: The front desk's daily working set - arriving, departing, and in-house
      description: >
        Requires CASHIER or above. See `TodayBoard`'s own description for exactly which bookings
        land in which of the three lists. Read-only - nothing here is a snapshot of a past sweep,
        it's computed fresh from current `checkIn`/`checkOut`/`occupancyStatus` on every call.
      responses:
        "200":
          description: The three lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayBoard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"

  /bookings/{id}/check-in:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: checkInBooking
      tags: [Bookings]
      summary: Mark a guest as physically checked in
      description: >
        Requires CASHIER or above. Only legal once a physical room is assigned
        (`booking.roomUnitId` - this is the moment a key is handed over) and while
        `occupancyStatus` is `EXPECTED` or `NO_SHOW` (a guest who no-showed can still turn up
        late and check in normally). Checking into a `DIRTY` room is allowed, not blocked - see
        `CheckInResult.warning`. Recorded in the audit log.
      responses:
        "200":
          description: Checked in, with a warning set if the room wasn't clean.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResult"
        "400":
          description: No room unit is assigned to this booking yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: "Assign a room before checking in."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Booking not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Already checked in or already checked out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: "This booking is already checked in."

  /bookings/{id}/check-out:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: checkOutBooking
      tags: [Bookings]
      summary: Mark a guest as checked out
      description: >
        Requires CASHIER or above. Only legal while `occupancyStatus` is `CHECKED_IN`. Sets the
        booking's current room `DIRTY` (`PATCH /room-units/{id}/housekeeping` is the way to mark
        it cleaned again) and reports any outstanding balance - see `CheckOutResult`. Recorded in
        the audit log.
      responses:
        "200":
          description: Checked out, with the outstanding balance (if any) at the moment of checkout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckOutResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Booking not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: This booking was never checked in, or is already checked out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: "This booking hasn't been checked in."

  /bookings/{id}/no-show:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: markBookingNoShow
      tags: [Bookings]
      summary: Mark a guest as not having arrived
      description: >
        Requires CASHIER or above. Only legal while `occupancyStatus` is `EXPECTED`. A label, not
        an action - see `OccupancyStatus`'s own description for why this changes nothing about
        the booking's dates, `status`, or availability. Recorded in the audit log.
      responses:
        "200":
          description: Marked no-show.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Booking not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: This booking has already been checked in, checked out, or marked no-show.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: "This booking is not awaiting arrival."

  /bookings/{id}/folio:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getBookingFolio
      tags: [Bookings]
      summary: Get the total amount owed against a booking's room folio
      description: >
        Requires any authenticated staff session. `roomTotal` + `roomChargesTotal` = `folioTotal`
        - built on the same `BookingService` query `GET /bookings/{id}/pos-orders` itemizes (see
        that operation), just totaled instead of broken out per order.
      responses:
        "200":
          description: The booking's folio total.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingFolio"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Booking not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Booking not found

  /bookings/{id}/folio-payments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listFolioPayments
      tags: [Bookings]
      summary: List the settlement history behind a booking's folio balance
      description: >
        Requires any authenticated staff session - same floor as `GET /bookings/{id}/folio`,
        which this explains the arithmetic of. Ordered oldest first.
      responses:
        "200":
          description: This booking's folio payments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FolioPayment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Booking not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      operationId: recordFolioPayment
      tags: [Bookings]
      summary: Record money collected against a booking's folio
      description: >
        Requires CASHIER or above. See `FolioPayment`'s own description for what this does and
        deliberately does not do (no shift/cash-drawer linkage). Not tied to `occupancyStatus`
        in any way - collectible any time, not just at check-out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FolioPaymentInput"
      responses:
        "201":
          description: Recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolioPayment"
        "400":
          description: Body failed validation, or `amount` is not greater than zero.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Booking not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: '`amount` exceeds what is currently outstanding on this booking''s folio.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: "This would overpay the folio - ฿500.00 is currently outstanding."

  /bookings/{id}/pos-orders:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listBookingPosOrders
      tags: [Bookings]
      summary: List POS orders charged to a booking's room folio
      description: >
        Requires any authenticated staff session. One entry per `Order` that has a `Payment`
        with `method=ROOM_CHARGE` and `bookingId` equal to this booking (built from the same
        underlying query `BookingService.computeFolio` sums over - see that method's Javadoc).
        Each entry carries a short item breakdown so the admin "Room charges" view can render
        without a follow-up `GET /orders/{id}` per row.
      responses:
        "200":
          description: Room-charge orders for this booking, oldest first. Empty array if none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookingPosOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Booking not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Booking not found

  /bookings/search:
    get:
      operationId: searchBookings
      tags: [Bookings]
      summary: Search, sort and page bookings (the admin Bookings list)
      description: >
        Requires CASHIER or above - same floor and same filters as `GET /bookings`, plus a free-text
        `q`, a sort column and server-side paging. A separate operation rather than new parameters
        on `GET /bookings`, because that one returns a bare array that POS charge-to-room, the spa
        guest picker and the calendar side panels all read whole; changing its response shape would
        break every one of them. `from`/`to` widen by `OverstayRule` exactly like `GET /bookings`.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: >
            Case-insensitive substring of the guest name, guest email or guest phone, or of the
            SiteMinder reference (`externalReference`), or a prefix of the booking id. Blank means
            no text filter.
        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Same as `GET /bookings`.
        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Same as `GET /bookings`.
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/BookingStatus"
        - name: sort
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/BookingSortField"
        - name: direction
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SortDirection"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: One page of matching bookings, ordered by `sort`/`direction` and then by `id` (so paging is stable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingPage"
        "400":
          $ref: "#/components/responses/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"

  /bookings/export:
    get:
      operationId: exportBookings
      tags: [Bookings]
      summary: Export bookings as CSV
      description: >
        Requires MANAGER or above - deliberately stricter than `GET /bookings`/
        `GET /bookings/{id}` (CASHIER+): those return one guest's booking at a time for a
        specific front-desk task, this returns every matching guest's name/email/phone/stay in
        one bulk file. Bulk export of personal data is a materially different risk (a leaked or
        misused CSV exposes the whole filtered set at once) from looking someone up, so it gets
        the higher bar even though the underlying data overlaps.


        The file opens with a UTF-8 BOM followed by a `sep=,` directive line so it opens
        correctly by double-click in Excel regardless of the OS's regional list-separator
        setting (a ru-RU/de-DE/etc. Windows defaults that to `;`, which is why a plain
        comma-CSV lands as one column there) - see `CsvBuilder` in the backend. Both CSV
        exports (`GET /bookings/export` and `GET /shifts/{id}/export`) share this same
        preamble/escaping so they can't drift apart.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Include bookings whose `checkOut` is after this date (i.e. still relevant on/after `from`).
        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: 'Include bookings whose `checkIn` is on or before this date - together with `from`, a proper closed-range/half-open-stay overlap test (so `from=to=<today>` finds a booking checking in today).'
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/BookingStatus"
      responses:
        "200":
          description: >
            CSV file, one row per booking, ordered by `checkIn` ascending. Prefixed with a
            UTF-8 BOM and a `sep=,` directive line (not shown in the example below) - see this
            operation's description.
          content:
            text/csv:
              schema:
                type: string
                example: |
                  ID,Room,Guest,Email,Phone,Check-in,Check-out,Total,Status,Payment note,Created at
                  clx123,Ocean View Suite,Jane Doe,jane@example.com,+66801234567,2026-08-01,2026-08-05,24000.00,PAID,,2026-07-01T10:00:00.000Z
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'Always `attachment; filename="bookings.csv"`.'
        "401":
          $ref: "#/components/responses/Unauthorized"

  /menu:
    get:
      operationId: listMenuItems
      tags: [Menu]
      summary: List all menu items
      description: Requires any authenticated staff session (ADMIN/MANAGER/CASHIER/WAITER).
      responses:
        "200":
          description: All menu items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createMenuItem
      tags: [Menu]
      summary: Create a menu item
      description: Requires role `MANAGER` or above.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemInput"
      responses:
        "201":
          description: Menu item created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /menu/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getMenuItem
      tags: [Menu]
      summary: Get a menu item by id
      description: Requires any authenticated staff session.
      responses:
        "200":
          description: The menu item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Menu item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Menu item not found
    patch:
      operationId: updateMenuItem
      tags: [Menu]
      summary: Update a menu item
      description: Requires role `MANAGER` or above. Full replacement of all `MenuItemInput` fields — no partial update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemInput"
      responses:
        "200":
          description: Updated menu item.
          content:
            application/json:
              schema:
