          description: Available, non-SPA menu items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"

  /public/orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPublicOrder
      tags: [PublicOrdering]
      summary: Get an order's guest-facing view (public)
      description: >
        Unauthenticated - gated entirely by `token` (see `OrderService#requireGuestAccess`).
        Powers the guest ordering page, polled every few seconds so multiple phones sharing one
        table's order stay in sync with each other and with anything staff ring in directly.
        Returns the same 404 for a wrong/missing token, an unknown order id, or an order that
        has left `OPEN`/`SENT` (paid or cancelled) - a guessing attempt learns nothing about
        which reason applies.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The order's guest-facing view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestOrderView"
        "404":
          description: Wrong/missing token, unknown order, or the order is no longer OPEN/SENT.
