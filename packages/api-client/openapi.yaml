  /public/rooms/{id}/quote:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPublicRoomQuote
      tags: [Public]
      summary: Price and availability of a stay, before booking it (public)
      description: >
        Unauthenticated and read-only. The guest-facing counterpart of `POST /bookings/staff/quote`:
        the same `BookingWriter` pricing (each night at the current `RatePlan`/`Room.basePrice`)
        and the same availability check `POST /bookings` runs, so the figure a guest is shown
        before booking is the figure the booking call would store - never a client-side sum of
        `GET /public/rooms/{id}/pricing` days. Unlike the staff quote it takes no `roomUnitId`
        (guests don't pick a physical room) and its `reason` never names a room or count.
        Advisory: `POST /bookings` re-prices and re-checks from scratch. Rate limited per caller
        address (`PublicQuoteRateLimiter`, the same sliding-window shape as `BookingRateLimiter`
        but its own, larger bucket, so quoting never uses up a guest's booking attempts). A stay
        is capped at 90 nights.
      security: []
      parameters:
        - name: checkIn
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: checkOut
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: >
            Server-computed `totalPrice` and availability. Returned even when `available` is
            false - `reason` then says why, in the same words the booking call would use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingScheduleQuote"
        "400":
          description: Not a real date, `checkIn` not before `checkOut`, or longer than 90 nights.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found
        "429":
          description: Too many quote requests from this address recently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Too many price requests from this address. Please try again later.

  /public/rooms/{id}/availability:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPublicRoomAvailability
      tags: [Public]
      summary: Get day-by-day availability for a room for a given month (public)
      description: >
        Unauthenticated. Powers the guest booking calendar. Unlike the staff
        endpoint, this never reveals *why* a day is blocked (real booking vs.
        manual staff block), nor how many units remain (`availableCount`) -
        only whether at least one unit is still bookable. Exposing the exact
        remaining count would let competitors read occupancy/load straight
        off the public site.
      security: []
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          description: 'Month key `YYYY-MM`. Defaults to the current UTC month.'
      responses:
        "200":
          description: Availability for every day of the month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAvailabilityResponse"
        "404":
